<h3>Атом құрылысы және квант сандары</h3>
<p><b>Атом</b> — химиялық элементтің қасиеттерін тасымалдайтын ең кіші электрбейтарап бөлшек: оң зарядталған <b>ядродан</b> (протондар + нейтрондар) және оны қоршаған <b>электрондардан</b> тұрады. Ядро заряды = протондар саны Z = реттік нөмір; бейтарап атомда электрондар саны да Z. Массалық сан A = Z + N, сондықтан нейтрондар саны <b>N = A − Z</b>. <b>Изотоптар</b> — Z бірдей, A әр түрлі атомдар (${S(1)}H, ${S(2)}H, ${S(3)}H).</p>

${T(['Квант саны','Нені сипаттайды','Мәндері'],[
['<b>n</b> — бас','электрон энергиясы, ядродан қашықтығы, энергетикалық деңгей (период нөмірі)','1, 2 … 7 (K, L, M, N, O, P, Q); деңгейдегі ең көп электрон N = 2n'+S(2)],
['<b>l</b> — орбитальдық (қосымша)','орбитальдың пішіні, деңгейше','0 … (n − 1): s (0), p (1), d (2), f (3)'],

<h3>Атом мен ион радиусы</h3>
<p>Атом электрон бергенде (катион) сыртқы қабатын жоғалтады, сондықтан <b>катион радиусы атомнан кіші</b>: r(Na) = 0,186 нм &gt; r(Na${S('+')}) = 0,102 нм. Атом электрон қосып алғанда (анион) электрондардың өзара тебілуі артады, сондықтан <b>анион радиусы атомнан үлкен</b>: r(Cl) = 0,099 нм &lt; r(Cl${S('−')}) = 0,181 нм. Топ бойынша жоғарыдан төмен радиус артады (қабат саны көбейеді), период бойынша солдан оңға кемиді (ядро заряды артады).</p>
<h3>Электрон бұлттарының құрылысы байланыс түрін қалай анықтайды?</h3>
<ul><li><b>Сыртқы электрондары аз (1–2), иондану энергиясы төмен</b> атомдар (s-металдар Na, K, Ca, Mg) электрон беріп, катион түзеді → <b>иондық</b> (бейметалдармен) немесе <b>металдық</b> байланыс.</li>
<li><b>Октетке 1–3 электрон жетпейтін</b> атомдар (p-бейметалдар) электрон қабылдайды немесе ортақ жұп түзеді → <b>коваленттік</b> немесе иондық байланыс.</li>
<li><b>Жұпталмаған электрондар саны</b> валенттілікті анықтайды (H — 1, O — 2, N — 3, C* — 4).</li>
<li><b>Бөлінбеген электрон жұбы</b> бар атом (N, O, S, галогенид-иондар) — <b>донор</b>, <b>бос орбитальдары</b> бар бөлшек (H${S('+')}, d-металл катиондары) — <b>акцептор</b> → <b>донорлы-акцепторлы (координациялық)</b> байланыс, комплексті қосылыстар (гемоглобиндегі Fe${S('2+')}, B${B(12)}-дегі Co${S('3+')}).</li>
<li><b>Электртерістілік (ЭТ)</b> айырмасы байланыс полярлығын анықтайды: ΔЭТ = 0 — полюссіз коваленттік; 0 &lt; ΔЭТ &lt; ≈ 1,7 — полюсті коваленттік; ΔЭТ &gt; ≈ 1,7 — иондық.</li></ul>

<p><b>Комплексті қосылыс</b> — қатты күйде де, ерітіндіде де құрамын сақтайтын күрделі ионнан тұратын қосылыс; онда <b>координациялық (донорлы-акцепторлы)</b> байланыс болады. Жалпы түрі: [M(L)${B('n')}]${S('z')}: M — орталық атом (көбіне d-металл катионы — акцептор), L — лиганд (донор), n — координациялық сан, z — комплекс заряды.</p>
<ul><li><b>Монодентатты</b> лигандтар бір орын алады: Cl${S('−')}, OH${S('−')}, CN${S('−')}, H${B(2)}O, NH${B(3)}; <b>полидентатты</b> — бірнеше орын: оксалат C${B(2)}O${B(4)}${S('2−')}, этилендиамин (en), ЭДТА.</li>
<li><b>Комплекс заряды</b> = орталық атом заряды + лигандтар зарядтарының қосындысы. Мысалы, K${B(2)}[ZnCl${B(4)}]: x + 4(−1) = −2 → Zn${S('+2')}.</li>
<li><b>Атауы:</b> лигандтар (аква, аммин, хлоро, циано, гидроксо…) + орталық атом + тотығу дәрежесі (рим цифрымен); анионды комплексте «-ат» жұрнағы: [Cu(NH${B(3)})${B(4)}]SO${B(4)} — тетраамминмыс(II) сульфаты; K${B(2)}[ZnCl${B(4)}] — калий тетрахлороцинкаты(II).</li>
<li><b>Тірі ағзада:</b> гемоглобин (Fe${S('2+')}), хлорофилл (Mg${S('2+')}), B${B(12)} (Co${S('3+')}), Zn-ферменттер. Ауыр металмен уланғанда комплексондар (ЭДТА, унитиол) металды берік комплекске байлап, ағзадан шығарады.</li></ul>`},

/* 4 */
{n:4,short:'Медициналық тәжірибеде қолданылуы',h:'Биогенді элементтер қосылыстарының медициналық тәжірибеде қолданылуына мысалдар',body:`
<p>Биогенді элементтердің бейорганикалық қосылыстары дәрі ретінде екі мақсатта қолданылады: (1) <b>жетіспеушілікті толтыру</b> (Fe, Ca, K, I препараттары) және (2) қосылыстың <b>химиялық қасиетін пайдалану</b> — тотықтырғыш (антисептик), негіз (антацид), осмостық белсенді зат (іш жүргізетін), адсорбент, рентгенконтраст.</p>
${T(['Топ (әсері)','Қосылыс','Неге әсер етеді (химиясы)'],[
['Плазма алмастыратын, регидратация','NaCl 0,9 % (изотонды), Рингер–Локк ерітіндісі (NaCl, KCl, CaCl'+B(2)+', NaHCO'+B(3)+', глюкоза), регидрон','қанның осмостық қысымына (≈ 7,7 атм) тең ерітінді жасушаларды зақымдамайды; судың, электролиттердің жоғалуын толтырады'],
['Антисептик','I'+B(2)+' 5 % спирттік ерітіндісі, Люголь (I'+B(2)+' + KI), H'+B(2)+'O'+B(2)+' 3 %, KMnO'+B(4)+' 0,01–5 %, H'+B(3)+'BO'+B(3)+', Na'+B(2)+'B'+B(4)+'O'+B(7)+', AgNO'+B(3)+', ZnO, Теймуров пастасы','күшті тотықтырғыштар микроб ақуыздарын тотықтырады; H'+B(2)+'O'+B(2)+' → H'+B(2)+'O + [O] (көбіктену жараны механикалық тазартады); Ag'+S('+')+', Zn'+S('2+')+' ақуыздармен қосылып тұтқыр қабат (альбуминат) түзеді'],
['Гипертонды ерітінді','NaCl 10 %','осмос бойынша жарадан ірің мен суды тартып шығарады'],
['Антацидтер (асқазан қышқылдығы жоғары болғанда)','NaHCO'+B(3)+', CaCO'+B(3)+', MgO, Mg(OH)'+B(2)+', Al(OH)'+B(3)+' (алмагель), AlPO'+B(4),'асқазандағы артық HCl-ды бейтараптайды: CaCO'+B(3)+' + 2HCl → CaCl'+B(2)+' + H'+B(2)+'O + CO'+B(2)+'↑; Mg(OH)'+B(2)+' + 2HCl → MgCl'+B(2)+' + 2H'+B(2)+'O'],
['Іш жүргізетін (осмостық)','Na'+B(2)+'SO'+B(4)+'·10H'+B(2)+'O (Глаубер тұзы), MgSO'+B(4)+'·7H'+B(2)+'O, Карлсбад тұзы','ішекте нашар сіңеді, ішекке су тартып, перистальтиканы күшейтеді'],
['Тамыр кеңейтетін, тырысуға қарсы','MgSO'+B(4)+' (вена ішіне), NaNO'+B(2),'Mg'+S('2+')+' — Ca'+S('2+')+' антагонисті, тегіс бұлшықетті босаңсытады; NO'+B(2)+S('−')+' → NO'],
['Уды бейтараптайтын','Na'+B(2)+'S'+B(2)+'O'+B(3)+'·5H'+B(2)+'O (тиосульфат); унитиол, ЭДТА (комплексондар)','тиосульфат цианидтерді улылығы аз тиоцианатқа айналдырады; комплексондар ауыр металдарды байлап, бүйрек арқылы шығарады'],
['Энтеросорбенттер','активтелген көмір (карболен), карболонг','кеуекті беті үлкен (500–1500 м'+S(2)+'/г) — токсиндерді адсорбциялайды'],
['Седативті','NaBr, KBr','Br'+S('−')+' ОЖЖ-де тежелуді күшейтеді'],
['Кальций, фосфор алмасуы','CaCl'+B(2)+', кальций глюконаты, Ca'+B(3)+'(PO'+B(4)+')'+B(2)+', «Кальций-Д'+B(3)+' Никомед» (CaCO'+B(3)+' + D'+B(3)+')','Ca'+S('2+')+' тапшылығын толтырады; CaCl'+B(2)+' — қан ұюын жақсартады, аллергияға қарсы'],
['Калий препараттары','KCl, панангин, калинор (K цитраты, KHCO'+B(3)+')','гипокалиемия мен аритмияда K'+S('+')+' деңгейін қалпына келтіреді'],
['Қан түзілуін күшейтетін','FeSO'+B(4)+', темір лактаты, MnSO'+B(4)+', цианокобаламин (Co)','гемоглобин түзілуіне Fe мен Co қажет'],
['Тироксин синтезін реттегіш','KI, NaI','I'+S('−')+' — тироксин синтезінің шикізаты (зоб профилактикасы)'],
['Рентгенконтраст','BaSO'+B(4),'Ba ауыр атомы рентген сәулесін жұтады; суда және HCl-да ерімейді, сондықтан Ba'+S('2+')+' қанға сіңбейді (ерігіш Ba тұздары улы!)'],
['Офтальмология','ZnSO'+B(4)+' + H'+B(3)+'BO'+B(3)+' көз тамшылары, протаргол (Ag ақуыздық қосылысы)','тұтқыр, микробқа қарсы әсер'],
['Дезинфекция','хлорлы әк CaOCl'+B(2)+', NaOCl, аммиак ерітіндісі 10 % (NH'+B(4)+'OH)','белсенді хлор мен HClO микробтарды тотықтырады'],
['Стоматология','фосфат, силикат цементтері (ZnO), Co–Cr–Mo, Au–Pd балқымалары, NaF','протез және пломба материалдары; фтор эмальді нығайтады']])}
<p class="note"><b>Мысал-түсіндірме:</b> неге BaSO${B(4)}-пен рентген жасауға болады, ал BaCl${B(2)}-мен болмайды? BaSO${B(4)}-тің ерігіштігі өте аз (K${B('s')} ≈ 1·10${S('−10')}), сондықтан ағзада Ba${S('2+')} иондары түзілмейді; BaCl${B(2)} суда жақсы ериді — Ba${S('2+')} K${S('+')}-арналарын бөгеп, ауыр улануға әкеледі.</p>`},

/* 5 */
{n:5,short:'Эндемиялық аурулар, улы металдар, радиация, синергизм',h:'Эндемиялық аурулар. Улы металдардың әсері. Медицинадағы радиоактивті элементтер. Радиацияның биологиялық әсері. Элементтердің синергизмі және антагонизмі',body:`
<h3>Эндемиялық аурулар</h3>
<p><b>Эндемиялық аурулар</b> — белгілі бір географиялық аймақтың топырағында, суында, тағамында элемент мөлшерінің тұрақты ауытқуынан (жетіспеуі немесе артық болуы) туатын аурулар. <b>Себебі</b> — биогеохимиялық провинциялар (В.И. Вернадский, А.П. Виноградов): тау аймақтарында иод аз, кейбір өзендерде фтор көп т.с.с.</p>
${T(['Ауру','Себебі','Белгілері','Алдын алу'],[
['<b>Эндемиялық зоб</b>','суда, тағамда <b>иод тапшылығы</b> (тау, таулы аймақтар, мұхиттан алыс жерлер)','қалқанша бездің ұлғаюы; балаларда — кретинизм (бой мен ақыл-ойдың артта қалуы); микседема','иодталған тұз (KI, KIO'+B(3)+'), теңіз өнімдері, жүкті әйелдерге KI'],
['<b>Эндемиялық флюороз</b>','ауыз суда <b>фтор артық</b> (&gt; 1,5 мг/л)','тіс эмалінде дақтар, сынғыштық; сүйек деформациясы','суды фторсыздандыру, басқа су көзі'],
['<b>Кариес (эндемиялық)</b>','суда <b>фтор аз</b> (&lt; 0,5 мг/л)','тіс эмалінің бұзылуы','фторлы тіс пасталары, суды фторлау'],
['<b>Кашин–Бек (Уров) ауруы</b>','топырақ пен суда Ca, Se аз, Sr, Fe, Mn артық','буындар мен сүйектің деформациясы, бойдың қысқаруы','тамақтанудың минералдық құрамын түзету'],
['<b>Кешан ауруы</b>','<b>селен тапшылығы</b>','кардиомиопатия','селен қосылған тұз, қоспалар'],
['<b>Молибден подаграсы</b>','топырақта Mo артық, Cu аз','несеп қышқылы тұздарының буындарда жиналуы','—']])}
<p class="note">Слайдтарда аталған <b>силикоз</b> (SiO${B(2)} шаңы) және <b>антракоз</b> (көмір шаңы) — өкпенің шаңнан болатын кәсіби/экологиялық аурулары (пневмокониоздар); <b>остеопороз</b> Ca мен F алмасуы бұзылғанда дамиды.</p>
${fig('0 0 360 170',`<text x="10" y="14" class="t3r">Таулы аймақ: жаңбыр иодты топырақтан шайып кетеді</text>
<path d="M10 120 L60 50 L100 85 L150 32 L205 95 L240 70 L290 120 Z" class="solid" opacity=".45"/>
<path d="M10 128 Q150 112 290 128" class="c-b"/><text x="20" y="146" class="t3b">су мен тағамда I⁻ аз → тироксин аз</text>
<g transform="translate(318 70)"><path d="M0 26 C-24 6 -22 -16 0 -4 C22 -16 24 6 0 26 Z" class="f-a">${AN('opacity','.55;1;.55',2)}</path></g><text x="318" y="112" class="t3" text-anchor="middle">қалқанша</text><text x="318" y="125" class="t3a" text-anchor="middle">без ұлғаяды</text>
${[0,1,2].map(i=>`<circle r="5" class="f-o"><animateMotion dur="4.5s" begin="${i*1.5}s" repeatCount="indefinite" path="M250 150 Q300 148 312 100"/></circle>`).join('')}<text x="10" y="162" class="t3g">иодталған тұз (KI, KIO₃) → без қалпына келеді</text>`,'8-сурет. Эндемиялық зобтың себебі мен алдын алу: таулы аймақтарда иод тапшылығы → тироксин азаяды → без ұлғаяды')}
<h3>Улы металдардың адам денсаулығына әсері</h3>
<p><b>Әсер ету механизмі:</b> ауыр металдардың иондары (Hg${S('2+')}, Pb${S('2+')}, Cd${S('2+')}, As) — «жұмсақ қышқылдар», ферменттердің <b>–SH (тиол) топтарымен</b> берік байланысып, оларды белсенсіздендіреді; өмірге қажетті металдардың орнын басады (Cd → Zn орнына, Pb → Ca орнына); тотығу стрессін тудырады; жасуша мембранасын бұзады.</p>
${T(['Металл','Көздері','Улылық белгілері','Антидот'],[
['<b>Сынап Hg</b>','термометрлер, люминесцентті шамдар, амальгама, ластанған балық (метилсынап)','меркуриализм: тремор, тітіркенгіштік, стоматит, бүйрек зақымы; Минамата ауруы (Жапония)','унитиол, сукцимер'],
['<b>Қорғасын Pb</b>','ескі бояулар, аккумуляторлар, этилденген бензин, кенорындары','сатурнизм: анемия (гем синтезін тежейді), энцефалопатия, қызыл иектегі қара «қорғасын жиегі», іштің түйілуі','ЭДТА (CaNa'+B(2)+'-ЭДТА), D-пеницилламин'],
['<b>Кадмий Cd</b>','темекі түтіні, Ni–Cd аккумуляторлар, фосфат тыңайтқыштары','бүйрек зақымы, сүйек жұмсаруы — «итай-итай» ауруы (Жапония)','комплексондар'],
['<b>Мышьяк (күшән) As</b>','ластанған жер асты сулары, пестицидтер, металлургия','тері зақымы, «қара аяқ» ауруы, полинейропатия, қатерлі ісік','унитиол, димеркапрол'],
['<b>Таллий Tl, бериллий Be</b>','кеміргіштерге қарсы улар (Tl), өнеркәсіп (Be)','Tl — шаштың түсуі, нейропатия; Be — бериллиоз (өкпе)','—']])}
<p><b>Табиғатта пайда болуы:</b> вулкандар, кен шығатын жерлер (табиғи) және өнеркәсіп, металлургия, жанармай жағу, тыңайтқыштар, қалдықтар (антропогендік). Олар топырақтан су мен өсімдікке, одан тағамдық тізбек бойымен адамға жетеді және ағзада <b>жинақталады</b> (биоаккумуляция).</p>
<h3>Медицинада қолданылатын радиоактивті элементтер</h3>
<p><b>Радиоактивтілік</b> — тұрақсыз ядролардың өздігінен ыдырап, α-, β-бөлшектер мен γ-сәулелер шығаруы. Ыдырау 1-ретті реакция заңымен жүреді: N = N${B(0)}·(½)${S('t/T½')}, мұндағы <b>T½ — жартылай ыдырау периоды</b>.</p>
<span class="fx">N = N${B(0)} · e${S('−λt')} ; λ = ${F('ln 2','T<sub>½</sub>')} = ${F('0,693','T<sub>½</sub>')}</span>
${T(['Изотоп','T½','Сәулесі','Медицинада қолданылуы'],[
[S(131)+'I','8,02 тәулік','β, γ','қалқанша без гиперфункциясы мен ісігін емдеу, без қызметін зерттеу'],
[S(99)+'ᵐTc','6,0 сағат','γ','ең көп қолданылатын диагностикалық изотоп (сцинтиграфия, ОФЭКТ): сүйек, жүрек, бүйрек'],
[S(18)+'F','110 минут','β'+S('+'),'ПЭТ-диагностика (фтордезоксиглюкоза) — ісікті анықтау'],
[S(60)+'Co','5,27 жыл','β, γ','сыртқы гамма-терапия, медициналық құралдарды стерильдеу'],
[S(32)+'P','14,3 тәулік','β','полицитемия, кейбір лейкоздарды емдеу'],
[S(89)+'Sr, '+S(223)+'Ra','50,5 тәулік; 11,4 тәулік','β; α','сүйек метастаздарының ауыруын басу, емдеу'],
[S(226)+'Ra, '+S(222)+'Rn','1600 жыл; 3,82 тәулік','α, γ','бұрын — брахитерапия; радон ванналары (физиотерапия)'],
[S(125)+'I','59,4 тәулік','γ','простата ісігіне енгізілетін «дәндер» (брахитерапия)']])}
${fig('0 0 360 168',`<circle cx="34" cy="75" r="22" class="f-a"/><text x="34" y="79" class="t3w" text-anchor="middle">ядро</text>
<rect x="120" y="30" width="6" height="90" class="colw"/><text x="123" y="138" class="t3" text-anchor="middle">қағаз</text>
<rect x="200" y="30" width="10" height="90" class="solid"/><text x="205" y="138" class="t3" text-anchor="middle">алюминий</text>

<h3>Радиацияның биологиялық әсері</h3>
<ul><li><b>Тура әсер</b> — сәуле ДНҚ, ақуыз молекулаларын тікелей иондап, байланыстарды үзеді.</li>
<li><b>Жанама әсер (судың радиолизі)</b> — ағзаның 60–70 %-ы су болғандықтан, негізгі зақым судан түзілетін бос радикалдардан: H${B(2)}O → H· + ·OH; ·OH, H${B(2)}O${B(2)}, O${B(2)}${S('−')}· ақуыздар мен ДНҚ-ны тотықтырады.</li>
<li><b>Ең сезімтал ұлпалар</b> — тез бөлінетін жасушалар: сүйек кемігі, ішек эпителийі, жыныс бездері, лимфоидты ұлпа (Бергонье–Трибондо ережесі).</li>
<li><b>Салдары:</b> жедел сәуле ауруы (&gt; 1 Гр бір реттік доза), лейкоз, қатерлі ісіктер, генетикалық мутациялар. Бірліктері: жұтылған доза — грей (Гр), эквиваленттік доза — зиверт (Зв), активтілік — беккерель (Бк).</li>
<li><b>Ағзаға енген изотоптың тағдыры</b> химиялық ұқсастығына тәуелді: ${S(90)}Sr Ca сияқты сүйекке, ${S(137)}Cs K сияқты бұлшықетке, ${S(131)}I қалқанша безге жиналады. Сондықтан радиациялық апатта KI таблеткасы қалқанша безді тұрақты иодпен «қанықтырып», радиоиодтың жиналуын азайтады.</li></ul>
