MODS.t06={...EMPTY(),intro:'Конспект тақырыптың 6 негізгі сұрағына жауап ретінде құрылған (оқулық: 8-тақырып, 127–138 беттер).',notes:[
{n:1,short:'Беттік құбылыстар, адсорбция',h:'Беттік құбылыстар. Адсорбция. Негізгі түсініктер',body:`
<p><b>Беттік құбылыстар</b> — фазалар бөліну бетінде жүретін, беттік қабаттың ерекше құрамы мен құрылысына байланысты процестер.</p>
<ul><li><b>Меншікті бет</b> S<sub>мен</sub> = S<sub>қос</sub> / V — бөлшек ұсақтаған сайын артады.</li><li><b>Беттік керілу σ</b> — бет бірлігін түзуге жұмсалатын жұмыс (Дж/м<sup>2</sup>) немесе бетті қысқартуға ұмтылатын күш (Н/м). Беттік энергия E<sub>s</sub> = σ·S.</li><li><b>Беттік активтілік g</b> = −dσ/dC — заттың беттік керілуді өзгерту қабілеті.</li></ul>
<ul><li><b>Адсорбция</b> — еріген зат концентрациясының фазалар бөліну бетінде өздігінен өзгеруі; <b>десорбция</b> — кері процесс.</li><li><b>Адсорбент</b> — бетінде адсорбция жүретін зат; <b>адсорбтив (адсорбат)</b> — адсорбцияланатын зат.</li><li><b>Оң адсорбция</b> — бетте концентрация артады; <b>теріс</b> — кемиді.</li><li><b>Адсорбциялық тепе-теңдік</b> — адсорбция мен десорбция жылдамдықтары тең.</li></ul>`},
{n:2,short:'Гиббс теңдеуі',h:'Фазалардың жылжымалы бөліну бетіндегі адсорбция. Гиббс теңдеуі',body:`
<p>Сұйық–газ, сұйық–сұйық шекарасындағы адсорбция беттік керілудің өзгерісімен анықталады.</p>
<span class="fx">Г = −${F('C','RT')}·${F('dσ','dC')} ≈ −${F('C','RT')}·${F('σ<sub>2</sub> − σ<sub>1</sub>','C<sub>2</sub> − C<sub>1</sub>')}</span>
<p>Г — адсорбция (моль/м<sup>2</sup>); dσ/dC &lt; 0 болса Г &gt; 0 (оң адсорбция). <b>Адсорбция изотермасы</b> — тұрақты T-да Г-ның C-ға тәуелділігі; <b>беттік керілу изотермасы</b> — σ-ның C-ға тәуелділігі.</p>`},
{n:3,short:'БАЗ, мембраналар',h:'Беттік-активті заттар. Молекулалардың бағытталуы. Биологиялық мембраналардың құрылымы',body:`
${T(['Зат түрі','σ ерітінді','g','Г','Мысалдар'],[
['Беттік-активті (БАЗ)','&lt; σ<sub>0</sub>','&gt; 0','&gt; 0','спирттер, май қышқылдары, сабындар, ақуыздар, өт қышқылдары'],
['Беттік-инактивті (БИЗ)','&gt; σ<sub>0</sub>','&lt; 0','&lt; 0','бейорганикалық қышқылдар, негіздер, тұздар, глицерин, аминқышқылдары'],
['Беттік-активті емес','= σ<sub>0</sub>','0','0','қант, глюкоза']])}
<p>БАЗ молекуласы <b>дифильді</b>: полярлы гидрофильді «бас» (–COOH, –OH, –SO<sub>3</sub>H) және полярсыз гидрофобты көмірсутек «құйрық». Су бетінде бас суға, құйрық ауаға бағытталады.</p>
<p><b>Дюкло–Траубе ережесі:</b> гомологтық қатарда тізбекті бір –CH<sub>2</sub>– тобына ұзартқанда беттік активтілік 3–3,5 есе артады.</p>
<h3>Биологиялық мембраналар</h3>
<ul><li>негізі — <b>фосфолипидтердің қос қабаты</b>: полярлы бастары сыртқа, гидрофобты құйрықтары ішке қараған; ақуыздар мен холестерин кіреді;</li><li>Даниэлли–Давсон моделі: липид қос қабаты екі жағынан ақуыз қабатымен жабылған;</li><li>сұйық-мозаикалық модель: интегралды ақуыздар қос қабатты тесіп өтеді, иондық каналдар түзеді, ақуыздар асимметриялы орналасқан;</li><li>функциясы: жасушаны бөліп тұрады, таңдамалы өткізгіштік, рецепторлар арқылы сигнал қабылдау.</li></ul>`},
{n:4,short:'Лэнгмюр, Фрейндлих',h:'Жылжымайтын бөліну бетіндегі адсорбция. Лэнгмюр және Фрейндлих теңдеулері',body:`
<ul><li><b>Абсорбция</b> — заттың сорбенттің бүкіл көлеміне сіңуі; <b>капиллярлық конденсация</b> — кеуекте газдың сұйыққа айналуы; <b>сорбция</b> — бәрінің жиынтығы.</li><li>Қатты адсорбенттер: кеуексіз (оксидтер, тұздар) және кеуекті (белсендірілген көмір, силикагель).</li></ul>
${T(['','Физикалық адсорбция','Хемосорбция'],[['Күштер','ван-дер-ваальс','химиялық байланыс'],['Қайтымдылық','қайтымды','көбіне қайтымсыз'],['Таңдамалылық','жоқ','бар'],['Температура артқанда','әлсірейді','күшейеді']])}
<h3>Лэнгмюр теориясы</h3>
<p>Адсорбция тек белсенді орталықтарда жүреді, әр орталық бір молекуланы ұстайды (мономолекулалы қабат), орталықтар бірдей, адсорбцияланған молекулалар өзара әрекеттеспейді.</p>
<span class="fx">Г = Г<sub>∞</sub>·${F('C','K + C')}</span>
<p>Аз концентрацияда Г ≈ Г<sub>∞</sub>C/K (сызықтық), үлкен концентрацияда Г → Г<sub>∞</sub> (шекті адсорбция).</p>
<h3>Фрейндлих теңдеуі (эмпирикалық)</h3>
<span class="fx">${F('x','m')} = K·C<sup>1/n</sup> ; lg${F('x','m')} = lgK + ${F('1','n')}lgC</span>
<p>lg(x/m)–lgC графигінде түзу: ординатадан қиған кесінді = lgK, көлбеулік = 1/n. Орташа концентрацияда қолданылады.</p>
<p class="note">БЭТ теориясы — полимолекулалы адсорбция, изотерма S-тәрізді.</p>`},
{n:5,short:'Ерітіндіден адсорбция, ион алмасу',h:'Ерітіндіден адсорбцияның заңдылықтары. Ион алмасу адсорбциясы. Медицинада қолданылуы',body:`
<span class="fx">Г = ${F('(C<sub>0</sub> − C)·V','m')} <small>моль/кг</small></span>
<p>Әсер ететін факторлар: адсорбат, адсорбент және еріткіш табиғаты, концентрация, температура, меншікті бет.</p>
<p><b>Ребиндер ережесі:</b> адсорбция фазалар полярлығын теңестіру бағытында жүреді (полярлы адсорбент полярсыз еріткіштен полярлы затты жақсы адсорбциялайды).</p>
<p><b>Панет–Фаянс ережесі:</b> адсорбент бетінде алдымен оның кристалл торын толықтыра алатын (құрамына кіретін) иондар адсорбцияланады.</p>
<h3>Ион алмасу адсорбциясы</h3>
<ul><li><b>Иониттер</b> — иондарды алмастыра алатын сорбенттер: <b>катиониттер</b> R–H<sup>+</sup> (катион алмасады), <b>аниониттер</b> R–OH<sup>−</sup> (анион алмасады), амфотерлі иониттер.</li><li><b>Алмасу сыйымдылығы</b> — 1 г құрғақ ионит сіңіретін ион мөлшері (ммоль).</li><li>Регенерация: катионит — қышқылмен, анионит — сілтімен.</li></ul>
<p>Медицинада: су, антибиотик, ақуыз, витаминдерді тазарту; қанның ұюын болдырмау (Ca<sup>2+</sup>-ді байланыстыру); уланғанда токсиндерді байланыстыру; иондық балансты реттеу. Суды тұзсыздандыру: катионит → анионит.</p>`},
{n:6,short:'Хроматография',h:'Анализдің хроматографиялық әдісінің негізі. Биология және медицинада қолданылуы',body:`
<p><b>Хроматография</b> — заттарды қозғалмайтын (сорбент) және қозғалмалы (элюент — сұйық не газ) фазалар арасында әр түрлі таралуына негізделген бөлу әдісі; сорбция мен десорбция көп рет қайталанады.</p>
${T(['Жіктеу белгісі','Түрлері'],[
['Бөлу механизмі','адсорбциялық, таралу, ион алмасу, молекулалы-елеуіш (гель-фильтрация — өлшем бойынша)'],
['Техникасы','бағаналы, қағаздық, жұқа қабатты, капиллярлы'],
['Фазалар күйі','газдық (газ–сұйық, газ–қатты), сұйықтық']])}
<p><b>Сатылары:</b> сынама мен сорбентті дайындау → сынаманы енгізу → хроматографиялау → детекциялау → сандық анықтау.</p>
<h3>Медицинада</h3>
<ul><li>биосұйықтардағы микрокомпоненттер, допинг-бақылау, қандағы алкоголь мен есірткі;</li><li>ақуыз, аминқышқылдары, нуклеин қышқылдары, гормондарды бөлу және тазарту;</li><li>дәрілердің тазалығы мен сапасын анықтау;</li><li>гемосорбция — қан, лимфа, плазманы сорбенттен өткізіп, улы заттардан тазарту.</li></ul>`}
]};

/* ===== 7. Дисперсті жүйелер (оқулық, 9-тақырып, 144–163 б.) ===== */
MODS.t07={...EMPTY(),intro:'Конспект тақырыптың 8 негізгі сұрағына жауап ретінде құрылған (оқулық: 9-тақырып, 144–163 беттер).',notes:[
{n:1,short:'Негізгі түсініктер',h:'Дисперсті жүйелер. Негізгі түсініктер',body:`
<p><b>Дисперсті жүйе</b> — дисперсті фаза мен дисперстік ортадан тұратын жүйе.</p>
<ul><li><b>Дисперсті фаза</b> — ұсақталған күйде біркелкі таралған зат (қатты бөлшектер, тамшылар, көпіршіктер).</li><li><b>Дисперстік орта</b> — фаза таралған біртекті зат.</li><li><b>Дисперстілік</b> D = 1/a (a — бөлшектің көлденең өлшемі), м<sup>−1</sup>.</li></ul>
<p><b>Ағзада:</b> қан — дисперстік ортасы плазма (92% су, 6% ақуыз және метаболиттер, 2% иондар), фазасы — эритроциттер (7,2–7,5 мкм), лейкоциттер (10–13 мкм), тромбоциттер (2–5 мкм) және коллоидты бөлшектер. Сондай-ақ лимфа, ми сұйықтығы, зәр, цитоплазма.</p>
<p class="note">ЭТЖ (эритроциттердің тұну жылдамдығы) — қанның седиментациялық тұрақтылығын көрсетеді; норма 10–12 мм/сағ-тан аспайды.</p>`},
{n:2,short:'Жіктелуі, алу әдістері',h:'Дисперсті жүйелердің классификациясы. Коллоидты ерітінділерді алу әдістері',body:`
<h3>Дисперстілік дәрежесі бойынша</h3>
${T(['Жүйе','Бөлшек өлшемі','Қасиеттері','Мысал'],[
['Шын ерітінді','&lt; 1 нм (10<sup>−9</sup> м)','гомогенді, тұрақты, мөлдір, мембранадан өтеді','тұз, қант ерітіндісі'],
['Коллоидты (золь)','1–100 нм','ультрагетерогенді, салыстырмалы тұрақты, Тиндаль эффектісі, қағаз сүзгіден өтеді, мембранадан өтпейді','ақуыз, қан'],
['Дөрекі дисперсті','&gt; 100 нм (10<sup>−7</sup> м)','гетерогенді, тұрақсыз, лай, микроскоппен көрінеді','сүт, тұман, акварель']])}
<h3>Агрегаттық күйі бойынша (фаза/орта)</h3>
<p>Г/Г — флуктуациялар; С/Г — тұман; Қ/Г — түтін, шаң (аэрозольдер); Г/С — көбік; С/С — эмульсия; Қ/С — суспензия, золь; Г/Қ — қатты көбік (пемза); С/Қ — гель; Қ/Қ — қатты ерітінділер (қорытпалар).</p>
<h3>Фаза мен ортаның әрекеттесуі бойынша</h3>
<ul><li><b>Лиофильді</b> — фаза еріткішпен күшті әрекеттеседі, сольват қабаты бар, өздігінен түзіледі (ΔG &lt; 0), тұрақты: желатин, ақуыз, крахмал.</li><li><b>Лиофобты</b> — әрекеттесу әлсіз, өздігінен түзілмейді (ΔG &gt; 0), тұрақсыз: Ag, Au зольдері, AgI, As<sub>2</sub>S<sub>3</sub>.</li></ul>
<h3>Алу әдістері</h3>
<ul><li><b>Диспергациялық</b> — ұсақтау: механикалық, ультрадыбыстық, электрлік.</li><li><b>Конденсациялық</b> — молекулаларды біріктіру: физикалық (еріткішті алмастыру, бу конденсациясы), химиялық (гидролиз, тотықсыздану, алмасу реакциялары).</li><li><b>Пептизация</b> — жаңа тұнбаны пептизатор әсерімен зольге айналдыру.</li></ul>
<p>Химиялық конденсация шарттары: өнімнің ерімеуі, тұрақтандырғыш (бір реагенттің артығы), сұйылтылған ерітінділер.</p>`},
{n:3,short:'Мицелла құрылысы',h:'Мицелла құрылысы',body:`
<p><b>Мицелла</b> — қос электрлік қабатпен қоршалған, электрбейтарап коллоидты бөлшек. Мысал: AgNO<sub>3</sub> артық болғанда (AgNO<sub>3</sub> + KI) түзілген AgI золі:</p>
<span class="fx">{ m[AgI] · nAg<sup>+</sup> · (n − x)NO<sub>3</sub><sup>−</sup> }<sup>x+</sup> · xNO<sub>3</sub><sup>−</sup></span>
${T(['Бөлігі','Құрамы'],[
['Агрегат','m[AgI]'],
['Потенциал анықтаушы иондар','nAg<sup>+</sup> (Панет–Фаянс ережесі: торды толықтыратын, артық алынған ион)'],
['Ядро','агрегат + потенциал анықтаушы иондар'],
['Адсорбциялық қабаттың қарсы иондары','(n − x)NO<sub>3</sub><sup>−</sup>'],
['Гранула (коллоидты бөлшек)','ядро + адсорбциялық қабат; заряды x+'],
['Диффузиялық қабат','xNO<sub>3</sub><sup>−</sup>'],
['Мицелла','гранула + диффузиялық қабат (бейтарап)']])}
<p class="note">KI артық болса: {m[AgI]·nI<sup>−</sup>·(n − x)K<sup>+</sup>}<sup>x−</sup>·xK<sup>+</sup> — гранула теріс зарядталады.</p>`},
{n:4,short:'Қасиеттері',h:'Дисперсті жүйелердің молекулалық-кинетикалық, электрокинетикалық, оптикалық қасиеттері',body:`
<h3>Молекулалық-кинетикалық</h3>
<ul><li><b>Броундық қозғалыс</b> — еріткіш молекулаларының соқтығысынан бөлшектердің ретсіз қозғалысы.</li><li><b>Диффузия</b>, <b>осмостық қысым</b> (π = νRT/N<sub>A</sub>, ν — бөлшектік концентрация; шын ерітіндіге қарағанда өте аз), <b>седиментация</b> — ауырлық күшімен шөгу.</li></ul>
<h3>Оптикалық</h3>
<ul><li>Коллоидтар жарықты <b>шашыратады</b>: <b>Тиндаль конусы</b> (жарқыраған конус) және <b>опалесценция</b>.</li></ul>
<span class="fx">I = I<sub>0</sub>·K·${F('νV<sup>2</sup>','λ<sup>4</sup>')} <small>Рэлей теңдеуі</small></span>
<p>Шашырау бөлшектер санына және көлемінің квадратына тура, толқын ұзындығының 4-дәрежесіне кері пропорционал — қысқа толқынды (көк) жарық көп шашырайды.</p>
<h3>Электрокинетикалық</h3>
<ul><li>Бөлшек бетіндегі <b>қос электрлік қабатпен (ҚЭҚ)</b> байланысты: потенциал анықтаушы иондар, адсорбциялық және диффузиялық қабат қарсы иондары.</li><li><b>φ-потенциал</b> (электротермодинамикалық) — ядро бетіндегі потенциал.</li><li><b>ζ-потенциал</b> (дзета, электрокинетикалық) — адсорбциялық және диффузиялық қабаттар арасындағы ығысу шекарасындағы потенциал. Золь тұрақтылығын және электрокинетикалық құбылыстар қарқынын анықтайды.</li><li><b>Изоэлектрлік күй</b> — ζ = 0. <b>Қайта зарядталу</b> — электролит әсерінен ζ таңбасының өзгеруі.</li></ul>`},
{n:5,short:'Тазарту: диализ',h:'Коллоидты ерітінділерді тазарту: диализ, электродиализ, ультрафильтрация. Диализдің медицинада қолданылуы',body:`
<ul><li><b>Диализ</b> — төмен молекулалы заттарды өткізіп, коллоид бөлшектерін ұстайтын жартылай өткізгіш мембрана арқылы тазарту.</li><li><b>Электродиализ</b> — тұрақты ток әсерімен жеделдетілген диализ.</li><li><b>Ультрафильтрация</b> — мембрананың екі жағындағы қысым айырымы әсерімен жүретін диализ.</li><li><b>Компенсациялық диализ (вивидиализ)</b> — диализденетін ерітіндіде қанда сақталуы керек заттар қандағыдай концентрацияда болады; тек «зиянды» заттар шығады.</li></ul>
<p class="note"><b>«Жасанды бүйрек»</b> аппараты компенсациялық вивидиффузия принципімен жұмыс істейді: бүйрек жеткіліксіздігінде, уланғанда, ауыр күйікте қанды зат алмасу өнімдерінен (мочевина, креатинин) тазартады.</p>
<p>Ультрафильтрация: су, ақуыз, вирус, витаминдерді тазарту, вирустар өлшемін анықтау.</p>`},
{n:6,short:'Электрофорез, электроосмос',h:'Электрофорез. Электроосмос. Медицинада қолданылуы',body:`
<ul><li><b>Электрофорез</b> — сыртқы электр өрісінде зарядталған коллоид бөлшектерінің (гранулалардың) қарама-қарсы зарядты электродқа қозғалуы.</li><li><b>Электроосмос</b> — электр өрісінде дисперстік ортаның қозғалмайтын фазаға (кеуекті мембранаға) қатысты қозғалуы.</li></ul>
<h3>Медицинада</h3>
<ul><li>ақуыздарды, аминқышқылдарын фракцияларға бөлу (қан сарысуы ақуыздарының электрофореграммасы — диагностика);</li><li><b>ионофорез</b> — дәріні тері арқылы ток көмегімен енгізу;</li><li>дәрілерді (антибиотик, витамин) тазарту және тазалығын анықтау;</li><li>ферменттер, вирустар, қан жасушаларының электрохимиялық қасиеттерін зерттеу.</li></ul>`},
{n:7,short:'Тұрақтылық, коагуляция',h:'Коллоидты жүйелердің тұрақтылығы және коагуляциясы. Коллоидты қорғау',body:`
<ul><li><b>Седиментациялық (кинетикалық) тұрақтылық</b> — ауырлық күшіне қарсы бөлшектердің біркелкі таралуын сақтау.</li><li><b>Агрегативтік тұрақтылық</b> — бөлшектердің бірікпей, өлшемін сақтауы.</li></ul>
<p>Тұрақтылық факторлары: электростатикалық (ҚЭҚ, ζ-потенциал), адсорбциялық-сольваттық, энтропиялық, гидродинамикалық.</p>
<p><b>Коагуляция</b> — коллоид бөлшектерінің ірі агрегаттарға бірігуі: <b>жасырын</b> (көзге көрінбейді) → <b>айқын</b> (лайлану, тұнба, түс өзгерісі). Себептері: электролит қосу, температура, механикалық әсер, сәулелену, электр және магнит өрісі.</p>
<p><b>Шульце–Гарди ережесі:</b> коагуляцияны таңбасы гранула зарядына қарама-қарсы ион (ион-коагулянт) тудырады; заряды үлкен болған сайын коагуляциялау қабілеті жоғары (шамамен z<sup>6</sup>-ға пропорционал).</p>
<span class="fx">C<sub>т</sub> = ${F('C<sub>эл</sub>·V<sub>эл</sub>','V<sub>золь</sub> + V<sub>эл</sub>')} ; КҚ = ${F('1','C<sub>т</sub>')}</span>
<p>C<sub>т</sub> — коагуляция табалдырығы (моль/л), КҚ — коагуляциялау қабілеті. Лиотропты қатар: Ba<sup>2+</sup> &gt; Sr<sup>2+</sup> &gt; Ca<sup>2+</sup> &gt; Mg<sup>2+</sup>; Cs<sup>+</sup> &gt; Rb<sup>+</sup> &gt; K<sup>+</sup> &gt; Na<sup>+</sup> &gt; Li<sup>+</sup>.</p>
<ul><li>концентрациялық (индифферентті электролит) және нейтрализациялық коагуляция;</li><li>электролиттер қоспасы: аддитивтілік, синергизм, антагонизм; өзара коагуляция — қарама-қарсы зарядты зольдер.</li></ul>
<p><b>Коллоидты қорғау</b> — ЖМЗ (ақуыз, полисахарид) бөлшектерді адсорбциялық-сольват қабатпен қаптап, тұрақтылығын арттыруы. Сандық өлшемі — «алтын», «күміс», «темір» саны. Аз ЖМЗ керісінше тұрақтылықты азайтады — <b>сенсибилизация</b>.</p>
<p class="note">Ағзада ақуыздар холестерин мен кальций тұздарының тамыр қабырғасына, тастың бүйрек пен өт жолдарына тұнуына кедергі жасайды. Коагуляцияға ұқсас процестер: қанның ұюы, тас түзілуі, атеросклероз.</p>`},
{n:8,short:'Аэрозоль, суспензия, эмульсия',h:'Дөрекі дисперсті жүйелер: аэрозольдер, суспензиялар, эмульсиялар. Медицинада қолданылуы',body:`
<p>Бөлшек өлшемі 10<sup>−7</sup>–10<sup>−4</sup> м, фаза бөлу беті үлкен, термодинамикалық тұрақсыз, тұрақтандырғышпен тұрақтанады.</p>
<h3>Аэрозольдер (орта — газ)</h3>
<p>Тұман (сұйық фаза), түтін, шаң (қатты), смог (аралас). Жарықты шашыратады, броундық қозғалыс пен седиментация жылдам, ҚЭҚ жоқ.</p>
<ul><li>Медицинада: ингаляциялық, стерильдеуші, жараға арналған, желімдеуші аэрозольдер.</li><li>Аурулар: көмір шаңы — антракоз, SiO<sub>2</sub> — силикоз, асбест — асбестоз; тозаң — аллергия; бактериялық аэрозольдер — туберкулез, грипп; күйе — онкологиялық аурулар.</li></ul>
<h3>Суспензиялар (Қ/С)</h3>
<p>Броундық қозғалыс, диффузия, осмос жоқ; седиментация жылдам. Мысалдар: лай су, ас қорытудағы тағам, дәрілік және косметикалық суспензиялар.</p>
<h3>Эмульсиялар (С/С)</h3>
<ul><li><b>Тура (I текті)</b> — май/су (сүт, ішке қабылданатын дәрілік эмульсиялар).</li><li><b>Кері (II текті)</b> — су/май (сыртқа қолданылатын кремдер, маргарин).</li><li><b>Эмульгаторлар</b> тұрақтандырады: гидрофильді — тура, гидрофобты — кері эмульсияларды. <b>Коалесценция</b> — тамшылардың бірігуі.</li></ul>
<p class="note">Ас қорытуда майлар өт қышқылдарының (эмульгатор) көмегімен ішекте эмульгирленіп, сіңіріледі.</p>`}
]};

/* ===== 8. Тотығу-тотықсыздану, электрод потенциалдары (оқулық, 7-тақырып, 114–122 б.) ===== */
MODS.t08={...EMPTY(),intro:'Конспект тақырыптың 9 негізгі сұрағына жауап ретінде құрылған (оқулық: 7-тақырып, 114–122 беттер).',notes:[
{n:1,short:'Электрод, Нернст теңдеуі',h:'Электрод. Электродты потенциал. Пайда болу механизмі. Нернст теңдеуі',body:`
<p><b>Электрод (жартылай элемент)</b> — электрондық өткізгіш (металл) пен иондық өткізгіш (электролит) түйіскен, шекарада қос электрлік қабат (ҚЭҚ) түзілетін жүйе.</p>
<p><b>Пайда болу механизмі:</b> металды өз тұзының ерітіндісіне батырғанда металл катиондары ерітіндіге өтеді (пластинка теріс зарядталады — белсенді металдар, мысалы Zn) немесе ерітіндіден металға тұнады (пластинка оң зарядталады — Cu, Ag). Шекарада ҚЭҚ түзіліп, потенциал секірмесі пайда болады.</p>
<ul><li><b>Тотығу</b> — электрон беру (тотығу дәрежесі артады); <b>тотықсыздандырғыш</b> — электрон доноры.</li><li><b>Тотықсыздану</b> — электрон қабылдау; <b>тотықтырғыш</b> — электрон акцепторы.</li></ul>
<span class="fx">φ = φ° + ${F('RT','nF')}·ln a(Me<sup>n+</sup>) = φ° + ${F('0,059','n')}·lg a(Me<sup>n+</sup>) <small>Нернст теңдеуі, 298 К</small></span>
<p>R = 8,31 Дж/(моль·К), F = 96 500 Кл/моль. Потенциалға металл табиғаты, ион активтілігі, температура әсер етеді.</p>
<p><b>Стандартты потенциал φ°</b> — 298 К-да ион активтілігі 1 моль/л болғанда стандартты сутекті электродпен салыстырып өлшенген потенциал. Олар реттеліп <b>электрохимиялық кернеу қатарын</b> құрайды.</p>`},
{n:2,short:'Электродтар классификациясы',h:'Электродтардың классификациясы: I және II текті, анықтаушы және салыстырушы электродтар',body:`
${T(['Түрі','Құрылысы','Мысалдар'],[
['I текті','өз тұзының ерітіндісіне батырылған металл; катионға қайтымды','Zn<sup>2+</sup>/Zn, Cu<sup>2+</sup>/Cu, Ag<sup>+</sup>/Ag, сутекті электрод'],
['II текті','нашар еритін тұзымен қапталған металл, ортақ анионы бар жақсы еритін тұз ерітіндісінде; анионға қайтымды','хлоркүміс Ag|AgCl,KCl; каломель Hg|Hg<sub>2</sub>Cl<sub>2</sub>,KCl'],
['Тотығу-тотықсыздану','Ox/Red ерітіндісіндегі инертті металл (Pt, Au)','Pt|Fe<sup>3+</sup>,Fe<sup>2+</sup>']])}
<p><b>Стандартты сутекті электрод</b> — 1 моль/л H<sup>+</sup> ерітіндісіне батырылған платиналанған платина, оған 101 325 Па қысыммен H<sub>2</sub> беріледі; φ° = 0.</p>
<span class="fx">φ(H) = 0,059·lg a(H<sup>+</sup>) = −0,059·pH</span>
${T(['Мақсаты','Анықтамасы','Мысалдар'],[
['Салыстырушы','потенциалы белгілі, тұрақты, анықталатын иондарға тәуелсіз','сутекті (0), каломель (+0,248 В), хлоркүміс (+0,222 В)'],
['Анықтаушы (индикаторлы)','потенциалы анықталатын ион концентрациясына тәуелді','сутекті, хингидронды, шыны (H<sup>+</sup> үшін), ион таңдамалы']])}`},
{n:3,short:'Хлоркүміс электроды',h:'Хлоркүміс электроды — салыстырушы электрод',body:`
<span class="fx">Ag | AgCl, KCl</span>
<ul><li>Негізгі процесс: Ag<sup>+</sup> + e ⇄ Ag<sup>0</sup>; ілесе жүретін: AgCl ⇄ Ag<sup>+</sup> + Cl<sup>−</sup>.</li><li>Қосынды: <b>AgCl + e ⇄ Ag + Cl<sup>−</sup></b>.</li></ul>
<span class="fx">φ<sub>хк</sub> = φ°<sub>хк</sub> − 0,059·lg a(Cl<sup>−</sup>) ; φ°<sub>хк</sub> = +0,222 В</span>
<p>Қаныққан KCl-да Cl<sup>−</sup> концентрациясы тұрақты, сондықтан потенциал тұрақты. Артықшылығы: қарапайым, тұрақты, улы емес (каломельдегі сынаптан айырмашылығы), сондықтан медициналық-биологиялық зерттеулерде pH-метрдің салыстырушы электроды ретінде қолданылады.</p>`},
{n:4,short:'Редокс-потенциал',h:'Тотығу-тотықсыздану электродты потенциалдар. Редокс-электродтар',body:`
<p><b>Редокс-электрод</b> — тотыққан және тотықсызданған формалар (Ox/Red жұбы) бар ерітіндіге батырылған инертті металл (Pt, Au); металл тек электрон тасымалдаушы.</p>
<span class="fx">Ox + ze ⇄ Red ; φ = φ° + ${F('RT','nF')}·ln${F('a(Ox)','a(Red)')} <small>Нернст–Петерс теңдеуі</small></span>
<p><b>Стандартты редокс-потенциал</b> — a(Ox) = a(Red) болғандағы потенциал. Ол неғұрлым үлкен болса, Ox формасы соғұрлым күшті тотықтырғыш.</p>
<h3>Тотығу-тотықсыздану реакциясының өздігінен жүру шарты</h3>
<span class="fx">ΔG° = −nFE° &lt; 0 ⇔ E° = φ°(тотықтырғыш) − φ°(тотықсыздандырғыш) &gt; 0</span>
<p>Электрондар редокс-потенциалы кіші жүйеден үлкен жүйеге өтеді.</p>
<p class="note">Ағзада биологиялық тотығу: электрондар субстраттан O<sub>2</sub>-ге қарай редокс-потенциалы біртіндеп өсетін жүйелер тізбегі (тыныс алу тізбегі) бойымен тасымалданып, энергия АТФ түрінде жинақталады.</p>`},
{n:5,short:'Гальваникалық элемент, ЭҚК',h:'Гальваникалық элемент. Электрқозғаушы күші',body:`
<p><b>Гальваникалық элемент</b> — сыртқы тізбегі металл өткізгішпен, ішкі тізбегі тұзды көпірмен жалғанған екі электродтан тұратын жүйе; химиялық энергияны электр энергиясына айналдырады.</p>
<span class="fx">E = φ(+) − φ(−) ; E° = φ°(+) − φ°(−)</span>
<h3>Якоби–Даниэль элементі</h3>
<span class="fx">(−) Zn | ZnSO<sub>4</sub> || CuSO<sub>4</sub> | Cu (+)</span>
<p>Анод (−): Zn − 2e → Zn<sup>2+</sup>; катод (+): Cu<sup>2+</sup> + 2e → Cu. Жалпы: Zn + Cu<sup>2+</sup> → Zn<sup>2+</sup> + Cu. E° = 0,34 − (−0,76) = 1,1 В.</p>
<p><b>Концентрациялық элемент</b> — бір металдан, бірақ ион активтіліктері әр түрлі ерітінділерде:</p>
<span class="fx">(−) Ag | AgNO<sub>3</sub>(a<sub>1</sub>) || AgNO<sub>3</sub>(a<sub>2</sub>) | Ag (+), a<sub>2</sub> &gt; a<sub>1</sub> : E = ${F('0,059','n')}·lg${F('a<sub>2</sub>','a<sub>1</sub>')}</span>
<p><b>Редокс-элемент</b> — екі редокс-электродтан: (−) Pt | Sn<sup>4+</sup>, Sn<sup>2+</sup> || Fe<sup>3+</sup>, Fe<sup>2+</sup> | Pt (+).</p>`},
{n:6,short:'Диффузиялық және мембраналық потенциал',h:'Диффузиялық және мембраналық потенциалдардың пайда болу механизмі. Биологиялық рөлі',body:`
<ul><li><b>Диффузиялық потенциал</b> — екі ерітінді шекарасында иондардың әр түрлі жылдамдықпен диффузиялануынан пайда болады. Ағзада жасуша қабығы механикалық зақымданғанда туындайды — <b>зақымдану потенциалы</b>, ~30–40 мВ.</li>
<li><b>Мембраналық потенциал</b> — мембрананың таңдамалы өткізгіштігінен (K<sup>+</sup> үшін жақсы, Na<sup>+</sup> үшін нашар) пайда болады.</li></ul>
${T(['Потенциал','Сипаттамасы','Шамасы'],[
['Тыныштық потенциалы','қозбаған жасушада; мембрананың сырты оң, іші теріс','~70–90 мВ'],
['Әрекет потенциалы','жасуша қозғанда; деполяризация мен реполяризация амплитудасы','~120–140 мВ'],
['Зақымдану (диффузиялық)','жасуша қабығы зақымданғанда','~30–40 мВ']])}
<p><b>Әрекет потенциалының функциялары:</b> қаңқа бұлшықетінің қозғалысы, жүрек жиырылуы, ОЖЖ-дегі қозу мен тежелу, жүйке импульсінің таралуы.</p>`},
{n:7,short:'Ион таңдамалы электродтар',h:'Ион таңдамалы электродтар. Биологиялық сұйықтықтардағы иондарды анықтау',body:`
<p><b>Ион таңдамалы электрод</b> — белгілі бір ионға таңдамалы сезімтал мембранамен екі бөлікке бөлінген электрохимиялық жүйе. Потенциалы сол ионның активтілігіне Нернст теңдеуі бойынша тәуелді.</p>
<p>Потенциометрия (ионометрия) әдісімен анықтайды:</p>
<ul><li>биосұйықтар мен жасушалардың pH-ы;</li><li>плазмадағы, сарысудағы, тұтас қандағы Na<sup>+</sup>, K<sup>+</sup>, Ca<sup>2+</sup>, Cl<sup>−</sup> иондары;</li><li>тағамдағы және ортадағы улы иондар (нитраттар);</li><li>ферменттер мен субстраттар (ацетилхолин, холинэстераза);</li><li>әлсіз электролиттердің иондану константасы, комплекстердің тұрақсыздық константасы.</li></ul>`},
{n:8,short:'Шыны электроды',h:'Шыны электроды — H⁺ концентрациясын анықтайтын анықтауыш электрод',body:`
<span class="fx">Ag | AgCl | HCl (0,1 моль/л) | шыны | H<sup>+</sup> (зерттелетін ерітінді)</span>
<p>Ұшында диаметрі 10–15 мм жұқа арнайы шыны шары (мембрана) бар түтікше. Ішінде pH-ы тұрақты HCl ерітіндісі және көмекші хлоркүміс электроды. Шыны бетінде ион алмасу жүреді: H<sup>+</sup>(ер-ді) + Na<sup>+</sup>(шыны) ⇄ H<sup>+</sup>(шыны) + Na<sup>+</sup>(ер-ді).</p>
<span class="fx">φ<sub>ш</sub> = φ°<sub>ш</sub> + 0,059·lg a(H<sup>+</sup>) = φ°<sub>ш</sub> − 0,059·pH</span>
<p>Артықшылығы: тотықтырғыш, тотықсыздандырғыш, ақуыздар, боялған ерітінділер өлшеуге кедергі жасамайды; биологиялық сұйықтықтардың pH-ын өлшеудегі негізгі электрод. pH өлшеу жұбы: шыны (анықтауыш) + хлоркүміс (салыстырушы).</p>`},
{n:9,short:'Потенциометрлік титрлеу',h:'Потенциометрлік титрлеу. Медициналық-биологиялық зерттеулерде қолданылуы',body:`
<p><b>Потенциометрия</b> — гальваникалық элемент ЭҚК-ін өлшеуге негізделген әдіс (құралы — pH-метр, ионометр). Осы принципке ЭКГ, ЭМГ, ЭЭГ негізделген.</p>
<p><b>Потенциометрлік титрлеу</b> — титрлеу барысында ЭҚК-ті (pH) өлшеп, эквиваленттік нүктені анықтау әдісі.</p>
<ul><li><b>Интегралдық қисық</b> E (pH) — V(титрант): эквиваленттік нүкте — қисықтың иілу нүктесі (секірме).</li><li><b>Дифференциалдық қисық</b> ΔE/ΔV — V: эквиваленттік нүкте — максимум.</li></ul>
<p>Анықталады: қышқылдар мен негіздер (бейтараптау), тотықтырғыштар мен тотықсыздандырғыштар, галогенид иондары (тұндыру), т.б. (комплекс түзу).</p>
<span class="fx">E = φ<sub>хк</sub> − φ<sub>ш</sub> <small>қышқылдық-негіздік титрлеу: шыны + хлоркүміс электродтары</small></span>
<h3>Артықшылықтары</h3>
<ul><li>боялған, лайлы, тұнбасы бар ерітінділерді титрлеуге болады;</li><li>бірнеше компонентті қатар анықтайды;</li><li>сезімталдығы жоғары, субъективті көз қатесі жоқ, автоматтандыруға болады.</li></ul>
<p>Кемшіліктері: күрделі аппаратура, санақ көп, кейде потенциал баяу орнығады.</p>`}
]};

</script>

const TAB_ICO={notes:'<path d="M2 4.5A1.5 1.5 0 0 1 3.5 3H9a3 3 0 0 1 3 3v14a2.5 2.5 0 0 0-2.5-2.5H3.5A1.5 1.5 0 0 1 2 16z"/><path d="M22 4.5A1.5 1.5 0 0 0 20.5 3H15a3 3 0 0 0-3 3v14a2.5 2.5 0 0 1 2.5-2.5h6a1.5 1.5 0 0 0 1.5-1.5z"/>',cards:'<rect x="7" y="3" width="14" height="16" rx="2.5"/><path d="M4 7v11.5A2.5 2.5 0 0 0 6.5 21H15"/>',test:'<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="m8 9 1.5 1.5L12.5 7.5M8 15.5l1.5 1.5 3-3M15 9h1.5M15 15.5h1.5"/>',prob:'<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 6.5h7M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/>'};
const TABS=[['notes','Конспект'],['cards','Флэш-карталар'],['test','Тест'],['prob','Есептер']];
function renderModule(id,tab,sub){
  const app=$('#app');app.innerHTML='';app.append(topbar());
  const t=TOPICS.find(x=>x.id===id),m=MODS[id];
  const main=h('main',{class:'wrap'});app.append(main);
  if(!t||!m){main.append(h('div',{class:'empty',style:'margin-top:30px'},h('b',{},'Бұл тақырып әзірге дайын емес'),h('a',{href:'#home'},'Басты бетке оралу')));return}
  const no=TOPICS.indexOf(t)+1;
  main.append(h('div',{class:'mhead'},h('a',{class:'back-link',href:'#home'},'← Барлық тақырыптар'),h('div',{class:'eyebrow'},no+'-тақырып'),h('h1',{},t.title)));
  const tabs=h('div',{class:'tabs',role:'tablist'});
  TABS.forEach(([k,label],i)=>tabs.append(h('button',{class:'tab',role:'tab','aria-selected':String(k===tab),onclick:()=>{location.hash=id+'_'+k}},h('i',{html:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+TAB_ICO[k]+'</svg>'}),label)));
  const panel=h('section',{class:'panel'});
  main.append(tabs,panel);
  const next=(k,label)=>h('div',{class:'next-step'},h('a',{class:'btn blue',href:'#'+id+'_'+k},label+' →'));
  if(tab==='notes'){renderNotes(panel,m);panel.append(next('cards','Флэш-карталарға өту'))}
  else if(tab==='cards'){renderCards(panel,m.cards,'cards_'+id);panel.append(next('test','Тестке өту'))}
  else if(tab==='test'){renderTests(panel,m,id,sub)}
  else{renderProblems(panel,m);}
  window.scrollTo({top:0})}

const LABPLOT=(svg,o)=>{ /* o:{xmax,ymax,xl,yl,series:[{f,cls}],pt:{x,y},hl:[y],vl:[x],xt,yt} */
  const W=340,H=210,L=46,R=10,T=24,Bm=30,pw=W-L-R,ph=H-T-Bm;
  const X=x=>L+x/o.xmax*pw,Y=y=>T+ph-Math.max(0,Math.min(y,o.ymax*1.05))/o.ymax*ph;
  let g=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" class="lp-bg"/>`;
  for(let k=0;k<=4;k++){const xv=o.xmax*k/4,yv=o.ymax*k/4;
    g+=`<line x1="${X(xv)}" y1="${T}" x2="${X(xv)}" y2="${T+ph}" class="lp-grid"/><line x1="${L}" y1="${Y(yv)}" x2="${L+pw}" y2="${Y(yv)}" class="lp-grid"/>`;
    g+=`<text x="${X(xv)}" y="${T+ph+13}" class="lp-tk" text-anchor="middle">${(o.xt||(v=>+v.toFixed(2)))(xv)}</text><text x="${L-5}" y="${Y(yv)+3}" class="lp-tk" text-anchor="end">${(o.yt||(v=>+v.toFixed(2)))(yv)}</text>`}
  g+=`<line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" class="lp-ax"/><line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" class="lp-ax"/>`;
  g+=`<text x="${L+pw}" y="${H-3}" class="lp-lb" text-anchor="end">${o.xl}</text><text x="4" y="14" class="lp-lb">${o.yl}</text>`;
  (o.hl||[]).forEach(y=>g+=`<line x1="${L}" y1="${Y(y)}" x2="${L+pw}" y2="${Y(y)}" class="lp-dash"/>`);
  (o.vl||[]).forEach(x=>g+=`<line x1="${X(x)}" y1="${T}" x2="${X(x)}" y2="${T+ph}" class="lp-dash2"/>`);
  o.series.forEach(s=>{let d='';for(let k=0;k<=120;k++){const x=(s.x0||0)+(o.xmax-(s.x0||0))*k/120,y=s.f(x);if(!isFinite(y)||y<-o.ymax*.02)continue;if(y>o.ymax*1.08)break;d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)}g+=`<path d="${d}" class="${s.cls}"/>`;
    if(s.lab){const x=o.xmax*.97;g+=`<text x="${X(x)}" y="${Y(s.f(x))-5}" class="lp-sl ${s.cls}-t" text-anchor="end">${s.lab}</text>`}});
  if(o.pt){g+=`<line x1="${X(o.pt.x)}" y1="${Y(o.pt.y)}" x2="${X(o.pt.x)}" y2="${T+ph}" class="lp-pl"/><line x1="${L}" y1="${Y(o.pt.y)}" x2="${X(o.pt.x)}" y2="${Y(o.pt.y)}" class="lp-pl"/><circle cx="${X(o.pt.x)}" cy="${Y(o.pt.y)}" r="5.5" class="lp-pt"/>`}
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=g};
const LABFMT=(v,d=3)=>{if(v===0)return'0';const e=Math.floor(Math.log10(Math.abs(v)));if(e>=-2&&e<4)return (+v.toFixed(d)).toString().replace('.',',');const m=v/10**e;return m.toFixed(2).replace('.',',')+'·10<sup>'+(e<0?'−'+(-e):e)+'</sup>'};
const LAB={
  shish(w){const v=k=>+w.querySelector(`[name=${k}]`).value,RT=8.314*v('T');
    const s0=72.8,Bp=v('B'),n=v('n'),C=v('C'),a=0.25/3.2**(n-3);
    const names={3:'пропанол',4:'бутанол',5:'пентанол',6:'гексанол',7:'гептанол',8:'октанол'};
    const sig=(c,aa)=>s0-Bp*Math.log(1+c/aa),gam=(c,aa)=>Bp*1e-3*c/(RT*(aa+c));
    const ser=[3,n].filter((x,i,ar)=>ar.indexOf(x)===i).map(k=>({f:c=>sig(c,0.25/3.2**(k-3)),cls:k===n?'lp-c1':'lp-c0',lab:names[k]}));
    LABPLOT(w.querySelector('.lp1'),{xmax:0.5,ymax:80,xl:'C, моль/л',yl:'σ, мН/м',series:ser,pt:{x:C,y:sig(C,a)},hl:[s0],xt:v=>v.toFixed(2).replace('.',','),yt:v=>Math.round(v)});
    const Gi=Bp*1e-3/RT;
    LABPLOT(w.querySelector('.lp2'),{xmax:0.5,ymax:Gi*1e6*1.1,xl:'C, моль/л',yl:'Г·10⁶',series:[{f:c=>gam(c,a)*1e6,cls:'lp-c1'}],pt:{x:C,y:gam(C,a)*1e6},hl:[Gi*1e6],xt:v=>v.toFixed(2).replace('.',','),yt:v=>v.toFixed(1).replace('.',',')});
    const g=Bp*1e-3/(a+C);
    w.querySelector('.lab-out').innerHTML=`<div><span>a (${names[n]})</span><b>${LABFMT(a)} моль/л</b></div><div><span>σ = σ₀ − B·ln(1 + C/a)</span><b>${LABFMT(sig(C,a),1)} мН/м</b></div><div><span>g = −dσ/dC = B/(a + C)</span><b>${LABFMT(g)} Дж·м/моль</b></div><div><span>Г = C·g/RT (Гиббс)</span><b>${LABFMT(gam(C,a))} моль/м²</b></div><div><span>Г∞ = B/RT</span><b>${LABFMT(Gi)} моль/м²</b></div><div><span>Бет толуы Г/Г∞</span><b>${Math.round(gam(C,a)/Gi*100)}%</b></div>`;
    w.querySelectorAll('[data-v]').forEach(e=>{const k=e.dataset.v,x=v(k);e.textContent=k==='n'?`C${x} (${names[x]})`:k==='C'?x.toFixed(3).replace('.',','):k==='T'?x+' К':x.toString().replace('.',',')})},
  lang(w){const v=k=>+w.querySelector(`[name=${k}]`).value;
    const Gi=v('Gi'),K=v('K'),C=v('C'),G=c=>Gi*c/(K+c),xm=Math.max(1,K*12);
    LABPLOT(w.querySelector('.lp1'),{xmax:xm,ymax:Gi*1.15,xl:'C, моль/л',yl:'Г·10³',series:[{f:G,cls:'lp-c1'},{f:c=>Gi*c/K,cls:'lp-c2',x0:0}],pt:{x:Math.min(C,xm),y:G(C)},hl:[Gi],vl:[K],xt:v=>(+v.toFixed(2)).toString().replace('.',','),yt:v=>v.toFixed(1).replace('.',',')});
    const th=G(C)/Gi,reg=C<0.1*K?'I — Генри аймағы (C ≪ K): Г ≈ Г∞·C/K, түзу':C>10*K?'III — қаныққан аймақ (C ≫ K): Г ≈ Г∞':'II — аралық аймақ: толық Ленгмюр теңдеуі';
    w.querySelector('.lab-out').innerHTML=`<div><span>Г = Г∞·C/(K + C)</span><b>${LABFMT(G(C)*1e-3)} моль/г</b></div><div><span>Бет толуы θ = Г/Г∞</span><b>${Math.round(th*100)}%</b></div><div><span>Генри түзуі Г∞·C/K</span><b>${LABFMT(Gi*C/K*1e-3)} моль/г</b></div><div class="wide"><span>Аймақ</span><b>${reg}</b></div>`;
    w.querySelectorAll('[data-v]').forEach(e=>{const x=v(e.dataset.v);e.textContent=x.toString().replace('.',',')})},
  freund(w){const v=k=>+w.querySelector(`[name=${k}]`).value;
    const K=v('K'),n1=v('n1'),C=v('C'),a=c=>K*c**n1;
    LABPLOT(w.querySelector('.lp1'),{xmax:1,ymax:Math.max(K*1.1,0.1),xl:'C, моль/л',yl:'a, моль/кг',series:[{f:a,cls:'lp-c1'}],pt:{x:C,y:a(C)},xt:v=>v.toFixed(2).replace('.',','),yt:v=>v.toFixed(2).replace('.',',')});
    const lk=Math.log10(K);
    LABPLOT(w.querySelector('.lp2'),{xmax:2,ymax:3,xl:'lg C',yl:'lg a',series:[{f:x=>lk+n1*(x-2)+2,cls:'lp-c1'}],pt:{x:Math.log10(C)+2,y:Math.log10(a(C))+2},xt:v=>(v-2).toFixed(1).replace('.',','),yt:v=>(v-2).toFixed(1).replace('.',',')});
    w.querySelector('.lab-out').innerHTML=`<div><span>a = K·C<sup>1/n</sup></span><b>${LABFMT(a(C))} моль/кг</b></div><div><span>lg a = lg K + (1/n)·lg C</span><b>${LABFMT(Math.log10(a(C)),2)}</b></div><div><span>Ординатадан кесінді lg K</span><b>${LABFMT(lk,2)}</b></div><div><span>Түзудің көлбеулігі 1/n</span><b>${n1.toString().replace('.',',')}</b></div>`;
    w.querySelectorAll('[data-v]').forEach(e=>{const x=v(e.dataset.v);e.textContent=x.toString().replace('.',',')})}
};
function initLabs(root){root.querySelectorAll('.lab').forEach(w=>{const f=LAB[w.dataset.lab];if(!f)return;w.addEventListener('input',()=>f(w));f(w)})}

function renderNotes(panel,m){
  panel.append(h('p',{class:'intro'},m.intro));
  const toc=h('nav',{class:'toc','aria-label':'Мазмұны'});
  m.notes.forEach((c,i)=>toc.append(h('button',{onclick:()=>document.getElementById('s'+i).scrollIntoView({behavior:'smooth'}),html:'<b>'+(i+1)+'-сұрақ.</b> '+c.short})));
  panel.append(toc);
  m.notes.forEach((c,i)=>panel.append(h('article',{class:'sec',id:'s'+i},h('div',{class:'qn'},(i+1)+'-сұрақ'),h('h2',{},c.h),h('div',{class:'prose',html:c.body}))));initLabs(panel)}

/* ---------- flashcards ---------- */
function renderCards(panel,all,key){
  if(!all.length){panel.append(h('div',{class:'empty'},h('b',{},'Флэш-карталар жақында қосылады'),'Әзірге конспектіні оқып шығыңыз.'));return}
  let filter='all',deck=[],pos=0,known=new Set(store.get(key,[])),onlyUnknown=false;
  const tb=h('div',{class:'toolbar'});
  const seg=h('div',{class:'seg',role:'group','aria-label':'Карта түрі'});
  [['all','Барлығы'],['theory','Теория'],['formula','Формулалар']].forEach(([k,l])=>seg.append(h('button',{'aria-pressed':String(k==='all'),onclick:e=>{filter=k;seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===e.currentTarget)));build(false)}},l)));
  const unk=h('button',{class:'iconbtn','aria-pressed':'false',onclick:()=>{onlyUnknown=!onlyUnknown;unk.setAttribute('aria-pressed',String(onlyUnknown));unk.textContent=onlyUnknown?'Барлық карталар':'Тек білмейтіндерім';build(false)}},'Тек білмейтіндерім');
  const mix=h('button',{class:'iconbtn',onclick:()=>build(true)},'Араластыру');
  const counter=h('span',{class:'counter'});
  tb.append(seg,unk,mix,h('div',{class:'sp'}),counter);
  const prog=h('div',{class:'bar-prog'},h('i',{style:'width:0'}));
  const stageEl=h('div');
  panel.append(tb,prog,stageEl);
  function build(sh){deck=all.map((c,i)=>({...c,i})).filter(c=>(filter==='all'||c.type===filter)&&(!onlyUnknown||!known.has(c.i)));if(sh)deck=shuffle(deck);pos=0;show()}
  function show(){
    stageEl.innerHTML='';
    counter.textContent=`Білемін: ${[...known].length} / ${all.length}`;
    prog.firstChild.style.width=(all.length?known.size/all.length*100:0)+'%';
    if(!deck.length){stageEl.append(h('div',{class:'empty'},h('b',{},'Барлық картаны білесіз'),'«Барлық карталар» батырмасын басып, қайта қайталауға болады.'));return}
    const c=deck[pos];
    const card=h('div',{class:'card',tabindex:'0',role:'button','aria-label':'Картаны аудару',onclick:()=>card.classList.toggle('flip'),onkeydown:e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();card.classList.toggle('flip')}}},
      h('div',{class:'card-in'},
        h('div',{class:'face front'},h('div',{class:'hint'},h('span',{},c.type==='formula'?'Формула':'Теория'),h('span',{},(pos+1)+' / '+deck.length)),h('div',{class:'term',html:c.q}),h('div',{class:'hint',style:'justify-content:center'},'Аудару үшін басыңыз')),
        h('div',{class:'face back'},h('div',{class:'hint'},h('span',{},'Жауап'),h('span',{},(pos+1)+' / '+deck.length)),h('div',{class:'ans',html:c.a}))));
    const go=d=>{pos=(pos+d+deck.length)%deck.length;show()};
    stageEl.append(card,h('div',{class:'cardnav'},
      h('button',{class:'btn ghost','aria-label':'Алдыңғы',onclick:()=>go(-1)},'←'),
      h('button',{class:'btn again',onclick:()=>{known.delete(c.i);store.set(key,[...known]);go(1)}},'Қайталау'),
      h('button',{class:'btn know',onclick:()=>{known.add(c.i);store.set(key,[...known]);if(onlyUnknown){deck.splice(pos,1);if(pos>=deck.length)pos=0;show()}else go(1)}},'Білемін'),
      h('button',{class:'btn ghost','aria-label':'Келесі',onclick:()=>go(1)},'→')))}
  build(false)}

  const sets=m.tests;

    g.append(card('Вариант бойынша тесттер','Тест тапсырылмайды: дайын жауаптары мен түсіндірмелері ашық тұрады.',(Object.values(sets.variants).filter(x=>x.length).length||4)+' вариант',id+'_test_var',false));
    if(sets.prac)g.append(card('ТӘЖІРИБЕЛІК ТАПСЫРМАЛАР','Сабақтағы тәжірибелік тапсырмалардың толық жауаптары мен есептердің шешуі.',sets.prac.length+' тапсырма',id+'_test_prac',false));
    if(sets.osojAns)g.append(card('ОСӨЖ ЖАУАПТАРЫ','ОСӨЖ тапсырмаларының дайын шешімдері: дәптердегі жауаптар мәтінге аударылып, тексерілген, қателері түзетілген.',sets.osojAns.length+' тапсырма',id+'_test_osojans',false));
    if(sets.osoj)g.append(card('ОСӨЖ ЖӘНЕ СӨЖ ТАПСЫРМАЛАРЫ','Оқытушының басшылығымен орындалатын өзіндік жұмыс (ОСӨЖ) және СӨЖ тапсырмаларының толық жауаптары.',sets.osoj.length+' тапсырма',id+'_test_osoj',false));
    if(sets.past)g.append(card('ӨТКЕН ЖЫЛҒЫ ТЕСТТЕР (ҚОСЫМША НҰСҚАЛАР)','Өткен жылғы нұсқалар: әр сұрақтың дұрыс жауабы және Карлова оқулығы бойынша толық талдауы.',sets.past.length+' нұсқа',id+'_test_past',false));
    if(sets.n2025)g.append(card('ҚОСЫМША НҰСҚАЛАР 2025','2025 жылғы қосымша варианттар: тест, теория және есептер дайын жауаптарымен.',Object.keys(sets.n2025).length+' вариант',id+'_test_n25',false));
    panel.append(g);return}

    const first=sub==='tims'?'view':'quiz';
    [['view','Жауаптарымен қарау'],['quiz','Тест тапсыру']].forEach(([k,l],i)=>seg.append(h('button',{'aria-pressed':String(k===first),onclick:e=>{seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===e.currentTarget)));area.innerHTML='';k==='quiz'?runQuiz(area,qs,sub==='bekitu'?id:null):renderReview(area,qs)}},l)));
    mode.append(h('h2',{style:'font-size:20px;font-weight:800;margin-right:auto'},title),seg);
    panel.append(mode,area);first==='view'?renderReview(area,qs):runQuiz(area,qs,sub==='bekitu'?id:null);return}

    panel.append(h('h2',{style:'font-size:20px;font-weight:800;margin-bottom:6px'},'ТӘЖІРИБЕЛІК ТАПСЫРМАЛАР'),h('p',{class:'muted',style:'margin:0 0 4px'},'Әр тапсырманың толық жауабы, кестелері және есептердің шешуі.'));

    const area=h('div');panel.append(area);renderReview(area,v.qs);return}
  if(sub==='n25'||/^n25v\d$/.test(sub)){
    const N=sets.n2025||{};const keys=Object.keys(N);

    const row=h('div',{class:'var-row'});

    panel.append(h('h2',{style:'font-size:20px;font-weight:800;margin-bottom:6px'},'Вариант бойынша тесттер'),h('p',{class:'muted',style:'margin:0 0 4px'},'Вариантты таңдаңыз. Дұрыс жауаптар белгіленіп, түсіндірмелері ашық тұрады.'));
    const row=h('div',{class:'var-row'});
    Object.keys(sets.variants).sort((a,b)=>parseFloat(a)-parseFloat(b)).forEach(n=>row.append(h('button',{class:'btn '+('v'+n===sub?'':'ghost'),onclick:()=>{location.hash=id+'_test_v'+n}},n+'-вариант')));
    panel.append(row);
    if(sub==='var')return;
    const qs=sets.variants[sub.slice(1)]||[];
    if(!qs.length){panel.append(h('div',{class:'empty'},h('b',{},sub.slice(1)+'-вариант әлі қосылмаған'),'Вариант сұрақтары жүктелген соң осы жерде дайын жауаптарымен ашылады.'));return}
    const area=h('div');panel.append(area);renderReview(area,qs);}}

function optRow(q,j,state,whyOpen){
  const ok=q.ans.includes(j);
  const b=h('button',{class:'opt'+(state==='correct'?' correct':state==='wrong'?' wrong':state==='sel'?' sel':state==='dim'?' dim':''),disabled:whyOpen||null},h('span',{class:'k'},LET[j]),h('span',{html:q.o[j]}));
  if(whyOpen&&q.w&&q.w[j])b.append(h('span',{class:'why',html:(ok?'✓ ':'✗ ')+q.w[j]}));
  return b}
function renderReview(area,qs){
  const list=h('div',{class:'review'});
  const box=(cls,lbl,html)=>h('div',{class:'abox '+cls},h('div',{class:'albl'},lbl),h('div',{class:'atxt',html}));
  qs.forEach((q,i)=>{
    const c=h('div',{class:'qcard'},h('div',{class:'qnum'},h('span',{},(i+1)+'-сұрақ'),q.o.length?(q.ans.length>1?h('span',{},'Бірнеше дұрыс жауап'):h('span',{},'Бір дұрыс жауап')):h('span',{},q.lbl?(q.tag||'Тапсырма'):'Есеп')),h('div',{class:'qtext',html:q.q.replace(/^\s*\d+\.\s*/,'')}));
    if(q.o.length){
      const o=h('div',{class:'opts'});q.o.forEach((_,j)=>o.append(optRow(q,j,q.ans.includes(j)?'correct':'dim',true)));c.append(o);
      c.append(box('ok',q.ans.length>1?'✓ Дұрыс жауаптар':'✓ Дұрыс жауап',q.ans.map(j=>'<span class="akey">'+LET[j]+'</span> '+q.o[j]).join('<br>')));
      if(q.e)c.append(box('why',q.eLbl||'Себебі',q.e));
    }else if(q.e){
      const m=q.e.match(/<br><b>Жауабы:\s*([\s\S]*?)<\/b>/);
      if(q.say){c.append(box('ok long',q.sayLbl||'🎓 Мұғалімге былай жауап беріңіз',q.say));c.append(box('why',q.eLbl||'Толық түсіндірме',q.e))}
      else if(q.lbl||!m){c.append(box('ok long','✓ Жауабы',q.e))}
      else{const steps=q.e.slice(0,m.index),rest=q.e.slice(m.index+m[0].length);
        c.append(box('why','Шешуі',steps));c.append(box('ok','✓ Жауабы',m[1]+(rest?'<div class="anote">'+rest.replace(/^<br>/,'')+'</div>':'')))}
    }
    list.append(c)});
  area.append(list)}
function runQuiz(area,qs,bestKey){
  let i=0,score=0;const order=qs.map((_,k)=>k);
  function show(){
    area.innerHTML='';
    if(i>=order.length){const pct=Math.round(score/order.length*100);if(bestKey){const b=store.get('best_'+bestKey,0);if(pct>b)store.set('best_'+bestKey,pct)}
      area.append(h('div',{class:'qcard result'},h('div',{class:'eyebrow'},'Нәтиже'),h('div',{class:'big'},pct+'%'),h('div',{class:'muted'},`${order.length} сұрақтың ${score}-не толық дұрыс жауап бердіңіз.`),
        h('div',{class:'row'},h('button',{class:'btn blue',onclick:()=>{i=0;score=0;show()}},'Қайта тапсыру'))));return}
    const q=qs[order[i]],multi=q.ans.length>1;let sel=new Set(),done=false;
    const c=h('div',{class:'qcard'});
    c.append(h('div',{class:'qnum'},h('span',{},(i+1)+' / '+order.length),h('span',{},'Ұпай: '+score)),h('div',{class:'qtext',html:q.q}));
    c.append(h('div',{class:'qmulti'},multi?'Бірнеше дұрыс жауап бар — барлығын белгілеп, «Тексеру» басыңыз':'Бір дұрыс жауап'));
    const o=h('div',{class:'opts'});c.append(o);
    const foot=h('div',{class:'qfoot'});c.append(foot);
    function paint(){o.innerHTML='';q.o.forEach((_,j)=>{let st='';if(done)st=q.ans.includes(j)?'correct':(sel.has(j)?'wrong':'');else if(sel.has(j))st='sel';
      const b=optRow(q,j,st,done);if(!done)b.addEventListener('click',()=>{if(multi){sel.has(j)?sel.delete(j):sel.add(j);paint()}else{sel=new Set([j]);check()}});o.append(b)});
      foot.innerHTML='';
      if(!done){if(multi)foot.append(h('span',{class:'muted',style:'font-size:13px'},'Белгіленді: '+sel.size),h('button',{class:'btn blue',disabled:sel.size?null:true,onclick:check},'Тексеру'))}
      else{foot.append(h('span',{style:'font-weight:700;color:var('+(right?'--ok':'--bad')+')'},right?'Дұрыс!':'Қате'),h('button',{class:'btn blue',onclick:()=>{i++;show()}},i+1<order.length?'Келесі сұрақ →':'Нәтижені көру'))}}
    let right=false;
    function check(){done=true;right=sel.size===q.ans.length&&q.ans.every(a=>sel.has(a));if(right)score++;paint();if(q.e)c.insertBefore(h('div',{class:'exp'},h('b',{},'Түсіндірме'),h('span',{html:q.e})),foot)}
    paint();area.append(c)}
  show()}

function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(',','.');if(!s)return NaN;return Number(s)}
function renderProblems(panel,m){
  if(!m.problems.length){panel.append(h('div',{class:'empty'},h('b',{},'Есептер жақында қосылады'),'Бұл тақырыптың есептері әлі жүктелмеген.'));return}
  panel.append(h('p',{class:'intro'},'Сол жақта — шығарылған мысал, оң жақта — өзіңіз шығаратын ұқсас есеп. Жауапты енгізіп, тексеріңіз; қиналсаңыз, шешімін ашыңыз.'));

        const ok=Math.abs(v-p.tr.ans)<=Math.max(p.tr.tol||0,Math.abs(p.tr.ans)*0.02);
        fb.append(h('div',{class:'fb '+(ok?'ok':'bad'),html:ok?'Дұрыс! Жауабы: '+p.tr.show:'Қате. Есептеуді қайта тексеріңіз немесе шешімін ашыңыз.'}))};
      tr=h('div',{class:'pcol'},h('div',{class:'lbl'},'Өзің шығар'),h('div',{class:'ptext',html:p.tr.q}),
        h('form',{class:'tryrow',onsubmit:e=>{e.preventDefault();check()}},h('label',{for:'p'+i,html:p.tr.pre}),inp,p.tr.unit?h('span',{class:'muted',html:p.tr.unit}):null,h('button',{class:'btn',type:'submit'},'Тексеру')),
        fb,h('details',{class:'sol'},h('summary',{},'Шешімін көру'),h('ol',{class:'steps'},...p.tr.s.map(s=>h('li',{html:s}))),h('div',{class:'ansline',html:'Жауабы: '+p.tr.show})));
    }else if(p.tr){
      tr=h('div',{class:'pcol'},h('div',{class:'lbl'},'Өзің шығар'),h('div',{class:'ptext',html:p.tr.q}),h('p',{class:'muted',style:'margin:0;font-size:14px'},'Дәптерге шығарып, сосын жауабыңызды тексеріңіз.'),
        h('details',{class:'sol'},h('summary',{},'Жауабын көру'),h('ol',{class:'steps'},...p.tr.s.map(s=>h('li',{html:s}))),h('div',{class:'ansline',html:'Жауабы: '+p.tr.show})));
    }
    list.append(h('article',{class:'prob'},h('header',{},h('div',{class:'no'},String(i+1)),h('div',{},h('h3',{},p.t),p.src?h('div',{class:'src'},p.src):null)),h('div',{class:'pbody',style:tr?null:'grid-template-columns:1fr'},ex,tr)))});
  panel.append(list)}

/* дифильді молекула: бас (шеңбер) + құйрық (сызық) */

{n:1,short:'Адсорбция, десорбция, хемосорбция',h:'Беттік құбылыстар: адсорбция, десорбция, беттік активтілік, адсорбциялық тепе-теңдік, хемосорбция',body:`

<p><b>Жылжымалы бөліну беті</b> — сұйық–газ (су–ауа) және сұйық–сұйық (су–май) шекаралары. Мұнда адсорбцияны тікелей өлшеу қиын, сондықтан оны <b>беттік керілудің өзгерісі</b> арқылы есептейді.</p>
<h3>Гиббс теңдеуі</h3>
<span class="fx">Г = −${F('C','RT')} · ${F('dσ','dC')} ≈ −${F('C','RT')} · ${F('σ'+B(2)+' − σ'+B(1),'C'+B(2)+' − C'+B(1))} = ${F('C · g','RT')}</span>
<ul><li>Г — адсорбция (артық беттік концентрация), моль/м${S(2)};</li><li>C — еріген заттың молярлық концентрациясы, моль/л;</li><li>R = 8,314 Дж/(моль·К), T — температура, К;</li><li>−dσ/dC = g — беттік активтілік.</li></ul>
<p><b>Теңдеудің мәні:</b> егер зат σ-ны төмендетсе (dσ/dC &lt; 0, g &gt; 0), онда Г &gt; 0 — зат бетке жиналады (<b>оң адсорбция</b>, БАЗ). Егер σ-ны жоғарылатса (dσ/dC &gt; 0), Г &lt; 0 — зат беттен ығысады (<b>теріс адсорбция</b>, БИЗ).</p>
<h3>Беттік қабатта БАЗ молекулаларының бағытталуы</h3>
<p>БАЗ молекуласы <b>дифильді</b>: полярлы гидрофильді «бас» (–OH, –COOH, –COO${S('−')}, –SO${B(3)}${S('−')}, –NH${B(2)}) және полярсыз гидрофобты көмірсутек «құйрық». Су–ауа шекарасында басы суға, құйрығы ауаға қарайды. Концентрация аз болғанда молекулалар бетте «жатып» орналасады, ал бет қаныққанда бір-біріне параллель, тік «тұрады» — <b>Ленгмюр тұрағы (частоколы)</b> түзіледі.</p>

<h3>Биологиялық мембраналар құрылымы</h3>
<p><b>Биологиялық мембрана</b> — жасушаны және оның органоидтарын қоршайтын, сұйық кристалдық күйдегі жұқа (≈ 7–10 нм) құрылым. Негізгі құрамы — <b>липидтер</b> (фосфолипидтер, сфингомиелин, холестерол), <b>ақуыздар</b> және көмірсулар (гликолипидтер, гликопротеидтер).</p>
<ul>
<li><b>Даниэль–Давсон моделі:</b> мембрана негізі — липидтердің <b>қос қабаты</b>: полярлы бастары сыртқа (суға), полярсыз құйрықтары ішке қарай бағытталған; екі жағынан ақуыз қабатымен жабылған.</li>
<li><b>Сұйық-мозаикалық модель (қазіргі):</b> ақуыздар липид қос қабатына асимметриялы түрде батырылған — сыртқы (перифериялық) және тесіп өтетін (интегралды) ақуыздар; олар ион арналары мен тасымалдаушылар түзеді; липидтер мен ақуыздар қабат бойымен жылжи алады.</li>

<li><b>II. Орташа концентрацияда</b> — изотерма қисық (теңдеудің толық түрі).</li>
<li><b>III. Үлкен концентрацияда</b> (C ≫ K): Г ≈ Г${B('∞')} — бет толық қаныққан, адсорбция концентрацияға тәуелсіз.</li></ul>
<p><b>Қолданылуы:</b> концентрацияның кең интервалында, жылжымалы (с/г, с/с) және жылжымайтын (қ/г, қ/с) бөліну беттерінде.</p>
<h3>Фрейндлих теңдеуі (эмпирикалық)</h3>
<span class="fx">a = ${F('x','m')} = K·C${S('1/n')} &nbsp;→&nbsp; lg a = lg K + ${F('1','n')}·lg C</span>
<p>Тұрақтыларды табу: lg a — lg C графигі түзу; ординатадан кесетін кесінді = lg K, түзудің көлбеу тангенсі = 1/n. Орташа концентрацияда, бөлме температурасында қолданылады.</p>
<div class="lab" data-lab="freund"><div class="lab-h">🧪 Зертхана: Фрейндлих теңдеуі</div><p class="lab-p">K мен 1/n өзгергенде қисық (сол жақта) және оның логарифмдік түзуі (оң жақта) қалай өзгеретінін бақылаңыз: түзудің көлбеулігі 1/n-ге, кесіндісі lg K-ға тең.</p><div class="lab-ins"><label class="lab-in"><span>K: <b data-v="K"></b></span><input type="range" name="K" min="0.1" max="2" step="0.05" value="1"></label><label class="lab-in"><span>1/n: <b data-v="n1"></b></span><input type="range" name="n1" min="0.1" max="1" step="0.05" value="0.5"></label><label class="lab-in"><span>C, моль/л: <b data-v="C"></b></span><input type="range" name="C" min="0.01" max="1" step="0.01" value="0.3"></label></div><div class="lab-plots"><svg class="lp1"></svg><svg class="lp2"></svg></div><div class="lab-out"></div></div><p><b>БЭТ теориясы (Брунауэр, Эммет, Теллер)</b> — полимолекулалы адсорбция: бірінші қабаттың үстіне келесі қабаттар түзіледі, изотерма S-тәрізді болады.</p>`},

{n:5,short:'Иондардың таңдамалы адсорбциясы',h:'Тұнба бетінде иондардың таңдамалы адсорбциясы. Адсорбцияға қабілеттілік ион зарядына тәуелді ме?',body:`
<p>Күшті электролиттер ерітіндіде толық иондалған, сондықтан олардың адсорбциясы <b>ион түрінде</b> жүреді (<b>ионды адсорбция</b>). Иондар негізінен полярлы адсорбенттерде — иондық кристалдардың (тұнбалардың) бетінде адсорбцияланады. Адсорбцияланған ион бетке заряд береді, оған қарама-қарсы зарядты иондар тартылып, <b>қос электр қабаты</b> түзіледі.</p>
<h3>Панет–Фаянс ережесі</h3>
<p>Кристалл бетінде алдымен оның <b>құрамына кіретін</b> немесе онымен изоморфты, яғни <b>кристалл торын жалғастырып, жетілдіре алатын</b> иондар адсорбцияланады. Бұл — <b>талғамды (таңдамалы) адсорбция</b>.</p>
${fig(['0 0 450 200',`<rect x="60" y="50" width="240" height="120" class="solid"/>
${Array.from({length:5},(_,r)=>Array.from({length:9},(_,c)=>{const x=80+c*25,y=68+r*22,ag=(r+c)%2===0;return `<circle cx="${x}" cy="${y}" r="8" class="${ag?'f-b':'f-o'}"/><text x="${x}" y="${y+3}" class="t4" text-anchor="middle">${ag?'Ag':'I'}</text>`}).join('')).join('')}
${Array.from({length:9},(_,c)=>`<g>${TR('0,-30;0,0;0,0;0,-30',4,-c*.35)}${AN('opacity','0;1;1;0',4,-c*.35)}<circle cx="${80+c*25}" cy="40" r="8" class="f-b"/><text x="${80+c*25}" y="43" class="t4" text-anchor="middle">Ag⁺</text></g>`).join('')}
${Array.from({length:6},(_,c)=>`<g>${TR(`0,0;${c%2?6:-6},3;0,0`,2+c*.2)}<circle cx="${95+c*36}" cy="14" r="7" class="f-r"/><text x="${95+c*36}" y="17" class="t4" text-anchor="middle">−</text></g>`).join('')}
<text x="310" y="44" class="t3">потенциал анықтаушы иондар</text><text x="310" y="18" class="t3">қарсы иондар (NO₃⁻)</text><text x="180" y="190" class="t3" text-anchor="middle">AgI кристалы (артық AgNO₃ ерітіндісінде)</text>`],'9-сурет. Панет–Фаянс ережесі: AgI бетінде торды жалғастыратын Ag⁺ иондары адсорбцияланады')}
${T(['Кристалл','Торды жетілдіретін иондар','Мысал'],[
['AgCl, AgI','Ag'+S('+')+', Cl'+S('−')+' (I'+S('−')+', Br'+S('−')+')','Артық AgNO'+B(3)+' → Ag'+S('+')+' адсорбцияланады (бет «+»); артық KI → I'+S('−')+' (бет «−»)'],
['BaSO'+B(4),'Ba'+S('2+')+', SO'+B(4)+S('2−'),'Артық BaCl'+B(2)+' → Ba'+S('2+')],
['Ca'+B(3)+'(PO'+B(4)+')'+B(2),'Ca'+S('2+')+', PO'+B(4)+S('3−')+' (HPO'+B(4)+S('2−')+')','Сүйек тінінде Ca'+S('2+')+' орнына Sr'+S('2+')+' (⁹⁰Sr) енуі — осы ереже бойынша']])}
<h3>Адсорбция ион зарядына тәуелді ме? — <u>Иә</u></h3>
<ul><li><b>Заряд</b> көп болған сайын адсорбция күштірек: Na${S('+')} &lt; Ca${S('2+')} &lt; Al${S('3+')} &lt; Th${S('4+')}.</li>
<li>Бірдей зарядты иондарда — <b>радиусы</b> үлкен (гидратталған радиусы кіші) ион күштірек адсорбцияланады. Бұл <b>лиотроптық қатарлар</b> (Гофмейстер қатарлары):</li></ul>
<span class="fx">Li${S('+')} &lt; Na${S('+')} &lt; K${S('+')} &lt; Rb${S('+')} &lt; Cs${S('+')} &nbsp;&nbsp;|&nbsp;&nbsp; Cl${S('−')} &lt; Br${S('−')} &lt; NO${B(3)}${S('−')} &lt; I${S('−')} &lt; CNS${S('−')}</span>
<p>Себебі: ион радиусы кіші болса, оның гидрат қабығы қалың (Li${S('+')} ең күшті гидратацияланады), ол бетке жақындай алмайды.</p>
<ul><li><b>Эквивалентті адсорбция</b> — бетте катиондар мен аниондар эквивалентті мөлшерде адсорбцияланады.</li><li><b>Ион алмасу адсорбциясы</b> — адсорбент пен ерітінді арасында бірдей зарядталған иондардың эквивалентті алмасуы (8-сұрақ).</li></ul>`},

{n:6,short:'Ерітіндіден адсорбция, Ребиндер',h:'Ерітіндіден адсорбцияның негізгі заңдылықтары. Дифильді молекулалардың полярлы және полярсыз адсорбенттердегі адсорбциясы',body:`
<p><b>Молекулалық адсорбция</b> — бейэлектролиттер немесе әлсіз электролиттер ерітінділерінен молекула түрінде жүретін адсорбция. Ерітіндіде адсорбентке еріген зат пен <b>еріткіш бәсекелеседі</b>, сондықтан адсорбция газдағыдан күрделірек.</p>
<span class="fx">Г = ${F('(C'+B(0)+' − C)·V','m')}</span>
<p>C${B(0)} — бастапқы концентрация, C — тепе-теңдік концентрация (моль/л), V — ерітінді көлемі (л), m — адсорбент массасы (кг).</p>
<h3>Ерітіндіден адсорбцияға әсер ететін факторлар</h3>
<ul><li>адсорбент пен адсорбаттың табиғаты (полярлығы);</li><li>еріткіштің табиғаты (адсорбат еріткіште жақсы ерісе, адсорбция аз);</li><li>адсорбат концентрациясы;</li><li>температура (артса, адсорбция кемиді);</li><li>адсорбенттің меншікті беті мен кеуектілігі.</li></ul>
<h3>Ребиндердің полярлықты теңестіру ережесі</h3>
<p>Адсорбция фазалардың <b>полярлығын теңестіру</b> бағытында жүреді және полярлықтардың айырмашылығы үлкен болған сайын күштірек болады. БАЗ екі фазаның арасында «көпір» болып орналасады: полярлы басы — полярлы фазаға, полярсыз құйрығы — полярсыз фазаға.</p>
${fig(['0 0 360 200',`<text x="90" y="14" class="t1" text-anchor="middle">а) полярлы адсорбент</text><text x="270" y="14" class="t1" text-anchor="middle">ә) полярсыз адсорбент</text>
<rect x="15" y="150" width="150" height="38" class="solid"/><text x="90" y="174" class="t3w" text-anchor="middle">силикагель (полярлы)</text><text x="90" y="40" class="t3" text-anchor="middle">еріткіш: бензол (полярсыз)</text>
${[30,50,70,90,110,130,150].map((x,i)=>`<g>${TR('0,-70;0,0;0,0;0,-70',5,-i*.5)}${AN('opacity','0;1;1;0',5,-i*.5)}${mol(x,143,-90,34)}</g>`).join('')}
<rect x="195" y="150" width="150" height="38" class="solid2"/><text x="270" y="174" class="t3w" text-anchor="middle">көмір (полярсыз)</text><text x="270" y="40" class="t3" text-anchor="middle">еріткіш: су (полярлы)</text>
${[210,230,250,270,290,310,330].map((x,i)=>`<g>${TR('0,-60;0,0;0,0;0,-60',5,-i*.5)}${AN('opacity','0;1;1;0',5,-i*.5)}${mol(x,110,90,34)}</g>`).join('')}`],'10-сурет. Ребиндер ережесі: а) басы адсорбентке, құйрығы еріткішке; ә) құйрығы адсорбентке, басы суға')}
${T(['Адсорбент','Еріткіш','БАЗ бағытталуы','Дюкло–Траубе ережесі'],[
['Полярлы (силикагель, глина)','Полярсыз (бензол, гексан)','Полярлы бас — адсорбентке, құйрық — еріткішке','<b>Кері</b> орындалады: тізбек ұзарған сайын адсорбция кемиді'],
['Полярсыз (көмір, графит)','Полярлы (су)','Құйрық — адсорбентке, полярлы бас — суға','<b>Тура</b> орындалады: тізбек ұзарған сайын адсорбция артады']])}
<p class="note">Сондықтан активтелген көмір сулы ортадан органикалық заттарды (токсиндер, алкалоидтар, бояғыштар) жақсы адсорбциялайды — энтеросорбцияның негізі.</p>`},

{n:7,short:'Мицеллалар',h:'Сулы ерітінділерде беттік активті заттар мицелласының құрылысы (гидрофильді мицеллалар)',body:`
<p>БАЗ концентрациясы аз болғанда молекулалар ерітіндіде жеке-жеке болады және бетке адсорбцияланады. Бет қаныққаннан кейін, белгілі бір концентрацияға жеткенде молекулалар өздігінен топтасып, <b>мицеллалар</b> түзеді. Бұл концентрация <b>мицелла түзілудің критикалық концентрациясы (МТКК, ККМ)</b> деп аталады.</p>
${fig(['0 0 420 210',`<rect x="5" y="5" width="410" height="200" class="liq"/>
<g>${RO('0 180 105;360 180 105',30)}${Array.from({length:18},(_,i)=>{const a=i*20*Math.PI/180,x=180+62*Math.cos(a),y=105+62*Math.sin(a);return `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(180+18*Math.cos(a)).toFixed(1)}" y2="${(105+18*Math.sin(a)).toFixed(1)}" class="tail"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" class="head"/>`}).join('')}
</g><circle cx="180" cy="105" r="22" class="core"><animate attributeName="r" values="22;24;22" dur="3s" repeatCount="indefinite"/></circle><text x="180" y="109" class="t3" text-anchor="middle">ядро</text>
<text x="20" y="25" class="t2">су</text>
<line x1="255" y1="60" x2="300" y2="35" class="lead"/><text x="300" y="30" class="t3">гидрофильді бас</text>
<line x1="200" y1="115" x2="300" y2="175" class="lead"/><text x="280" y="190" class="t3">гидрофобты құйрық</text>
<g>${TR('0,0;30,-20;10,-60;0,0',8)}${mol(40,170,-60,22)}</g><g>${TR('0,0;20,40;-10,20;0,0',7)}${mol(70,60,200,22)}</g><text x="20" y="200" class="t3">жеке молекулалар</text>`],'11-сурет. Сулы ортадағы БАЗ-дың сфералық (гидрофильді) мицелласы')}
<h3>Гидрофильді мицелланың құрылысы</h3>
<ul><li><b>Ядросы</b> — көмірсутек құйрықтарынан тұрады, ішінде сұйық көмірсутек сияқты (гидрофобты, полярсыз);</li>
<li><b>Сыртқы қабаты</b> — суға бағытталған полярлы гидрофильді топтар (–COO${S('−')}, –SO${B(3)}${S('−')}); олар гидратацияланады, иондық БАЗ-да қарсы иондармен қоршалады;</li>
<li>Мицелла сфералық (Гартли мицелласы), концентрация артқанда цилиндр, пластинка тәрізді болуы мүмкін;</li>
<li>Мицеллалар мен жеке молекулалар арасында <b>динамикалық тепе-теңдік</b> бар.</li></ul>
<p><b>Полярсыз еріткіште</b> керісінше — <b>кері (гидрофобты) мицеллалар</b>: полярлы бастар ішке, құйрықтар сыртқа бағытталады.</p>
<h3>Солюбилизация және медициналық мәні</h3>
<p><b>Солюбилизация</b> — суда ерімейтін заттардың (майлар, көмірсутектер, кейбір дәрілер) мицелла ядросына еніп, «еріп» кетуі. Мысалы:</p>
<ul><li><b>Өт қышқылдарының тұздары</b> ішекте майларды эмульгирлеп, мицелла түзіп, майлар мен майда еритін витаминдердің (A, D, E, K) сіңірілуін қамтамасыз етеді;</li><li>сабындар мен жуғыш заттардың тазартқыш әсері — кірдің мицеллаға енуі;</li><li>майда еритін дәрілердің сулы ерітінділерін алу.</li></ul>`},

{n:8,short:'Ион алмасу, иониттер',h:'Ион алмасу адсорбциясы және оның медицинада қолданылуы',body:`
<p><b>Ион алмасу адсорбциясы</b> — ерітінді мен адсорбент арасында бірдей зарядталған иондардың эквивалентті мөлшерде алмасу процесі. Адсорбент бір ионды сіңіріп, орнына ерітіндіге басқа ионды береді.</p>
<p><b>Иониттер</b> — құрамында иондарды алмастыруға қабілетті топтары бар, суда ерімейтін сорбенттер (табиғи: цеолиттер, глиналар; синтетикалық: ион алмастырғыш шайырлар).</p>
${T(['Ионит түрі','Белгілеу','Алмасатын ион','Иондық топтар'],[
['Катиониттер','R⁻H'+S('+')+' (R⁻Na'+S('+')+')','Катиондар','Күшті қышқылды: –SO'+B(3)+'H; әлсіз қышқылды: –COOH, –OH'],
['Аниониттер','R'+S('+')+'OH'+S('−')+' (R'+S('+')+'Cl'+S('−')+')','Аниондар','Күшті негізді: төрттік аммоний –N(CH'+B(3)+')'+B(3)+S('+')+'; әлсіз негізді: –NH'+B(2)+', =NH'],

<ul><li><b>Алмасу сыйымдылығы</b> — тепе-теңдік жағдайында 1 г құрғақ ионит сіңіретін ион мөлшері (ммоль/г).</li>
<li><b>Гидролиттік ион алмасу адсорбциясы</b> — адсорбент бейтарап тұздың бір ионын сіңіріп, орнына H${S('+')}  немесе OH${S('−')} беріп, ортаның pH-ын өзгертуі.</li>
<li><b>Регенерация</b> (қалпына келтіру): катиониттер — қышқыл ерітіндісімен, аниониттер — сілті ерітіндісімен өңделеді.</li></ul>

<line x1="200" y1="65" x2="225" y2="65" class="arr-a"/><text x="212" y="58" class="t4" text-anchor="middle">H⁺,Cl⁻</text>

<h3>Медицина мен фармацияда қолданылуы</h3>

{n:9,short:'Хроматография',h:'Хроматография. Әдістердің жіктелуі. Медицина мен санитарлық-гигиенада қолданылуы',body:`
<p><b>Хроматография</b> — заттар қоспасын бөлудің, талдаудың және физикалық-химиялық зерттеудің әдісі. Ол бөлінетін заттардың бір-біріне араласпайтын <b>екі фаза</b> арасында әр түрлі таралуына негізделген: бірі <b>қозғалмайтын</b> (сорбент), екіншісі <b>қозғалмалы</b> (элюент — сұйық немесе газ). Сорбция және десорбция процестері көп рет қайталанады, сондықтан аз ғана айырмашылығы бар заттар да бөлінеді. Әдісті 1903 жылы орыс ботанигі <b>М. С. Цвет</b> ашқан (хлорофилл пигменттерін бөлу).</p>

<h3>Хроматографиялық анықтаудың сатылары</h3>
<ol><li>сынама мен сорбентті дайындау (бағананы немесе жұқа қабатты);</li><li>сынаманы бағанаға, жұқа қабатқа немесе қағазға енгізу;</li><li>хроматографиялау (элюентпен жылжыту);</li><li>бөлінген заттар зоналарын детекциялау;</li><li>зоналардағы заттар мөлшерін сандық анықтау.</li></ol>
<h3>Жіктелуі</h3>
${T(['Белгісі','Түрлері','Негізі'],[
['<b>Бөлу механизмі</b>','Адсорбциялық','Заттардың адсорбциялық қасиеттеріндегі айырмашылық'],
['','Таралу (бөлу)','Компоненттердің қозғалмайтын және жылжымалы сұйық фазаларда ерігіштігінің айырмашылығы'],
['','Ион алмасу','Иондардың ион алмасу қабілетінің айырмашылығы'],
['','Молекулалы-елеуіш (гель-фильтрация)','Молекулалардың өлшеміндегі айырмашылық'],
['<b>Жүргізу техникасы</b>','Бағаналы, қағаздық, жұқа қабатты, капиллярлы','Сорбенттің орналасу түрі'],
['<b>Фазалар күйі</b>','Газдық (газ–сұйық, газ–қатты)','Қозғалмалы фаза — газ'],
['','Сұйықтық (сұйық–сұйық, сұйық–қатты, сұйық–гель)','Қозғалмалы фаза — сұйық']])}
<h3>Медициналық-биологиялық зерттеулерде қолданылуы</h3>
<ul><li>патологияларда биологиялық сұйықтардағы микрокомпоненттерді анықтау;</li><li>ақуыздарды, аминқышқылдарын, нуклеин қышқылдарын, гормондарды бөлу, тазарту және сандық анықтау;</li><li>стероидты гормондар мен олардың метаболиттерін газ-сұйықтық хроматографиямен (ГСХ) талдау;</li><li>қандағы алкоголь, есірткі, улы заттарды анықтау (сот-медициналық сараптама), допинг-бақылау;</li><li>дәрілік препараттардың тазалығы мен сапасын бақылау, оларды табиғи шикізаттан бөліп алу;</li><li><b>гемосорбция</b> — қан, лимфа, плазманы сорбент арқылы өткізіп, улы заттардан тазарту;</li><li>өкпеден шығатын ауадағы заттарды талдау (эфир, хлороформ, ацетон, этил спирті).</li></ul>
<h3>Санитарлық-гигиеналық мақсатта</h3>
<ul><li>ауа, су және топырақтағы ластаушы заттарды (пестицидтер, ауыр металдар, органикалық еріткіштер) анықтау;</li><li>тағамдағы консерванттарды, бояғыштарды, пестицид қалдықтарын бақылау;</li><li>суды деминералдау және тазалығын бақылау;</li><li>жұмыс орны ауасындағы зиянды заттардың концентрациясын бақылау.</li></ul>`}
];

<h3>4) Бөлшектердің өзара байланысы бойынша</h3>

<h3>Ағзадағы дисперсті жүйелер: қан</h3>
<p><b>Қан</b> — күрделі лиофилизденген дисперсті жүйе. Дисперсті орта — <b>плазма</b> (су 92%, ақуыздар мен метаболиттер 6%, иондар Na${S('+')}, K${S('+')}, Ca${S('2+')}, Mg${S('2+')}, Cl${S('−')} — 2%). Дисперсті фаза:</p>
<ul><li><b>микрогетерогенді фракция</b> — жасушалар: лейкоциттер (10–13)·10${S('−6')} м, эритроциттер (7,2–7,5)·10${S('−6')} м, тромбоциттер (2–5)·10${S('−6')} м;</li><li><b>коллоидты фракция</b> — липопротеиндер мен ақуыз мицеллалары, ақуыздармен қорғалған фосфаттар мен ураттар.</li></ul>
<p>Сонымен бір жүйеде үш деңгей бар: иондар (шын ерітінді), ақуыздар (коллоид), жасушалар (дөрекі дисперсті жүйе).</p>`},

/* 2 */
{n:2,short:'Алу әдістері, пептизация',h:'Коллоидты жүйелерді алудың диспергациялық және конденсациялық әдістерінің мәні. Пептизация',body:`
<p>Коллоидты бөлшек (1–100 нм) екі жолмен алынады: <b>ірі бөлшекті ұсақтау</b> (диспергация) немесе <b>молекулаларды біріктіру</b> (конденсация).</p>

<circle cx="45" cy="80" r="26" class="f-o"><animate attributeName="r" values="26;26;0;0;26" dur="5s" repeatCount="indefinite"/></circle>
${[[110,55],[130,80],[150,105],[120,105],[150,60],[170,85]].map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="7" class="f-o" opacity="0">${AN('opacity','0;0;1;1;0',5)}</circle>`).join('')}
<text x="90" y="80" class="t1" text-anchor="middle" style="fill:#F98613;font-size:20px">→</text>
<text x="95" y="140" class="t3" text-anchor="middle">энергия жұмсалады</text>
${[[220,50],[235,95],[250,70],[215,110],[245,120],[230,60]].map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" class="f-b">${TR(`0,0;${(330-p[0])*.0},0;${330-p[0]},${80-p[1]};${330-p[0]},${80-p[1]};0,0`,5,0)}${AN('opacity','1;1;1;0;1',5)}</circle>`).join('')}
<circle cx="330" cy="80" r="0" class="f-b"><animate attributeName="r" values="0;0;0;20;0" keyTimes="0;.3;.5;.8;1" dur="5s" repeatCount="indefinite"/></circle>
<text x="285" y="140" class="t3" text-anchor="middle">жаңа фаза түзіледі</text>`,'4-сурет. Коллоидты бөлшекке екі жолмен жетеміз: ұсақтау немесе біріктіру')}
<h3>Диспергациялық әдістер</h3>
<p>Затты коллоидты бөлшектердің өлшеміне дейін <b>ұсақтау</b>; сыртқы энергия жұмсауды қажет етеді.</p>
${T(['Әдіс','Мәні (қалай жүреді?)','Мысалы / қолданылуы'],[
['Механикалық','шарлы және коллоидты диірмендерде ұнтақтау, үгіту, шайқау','дәрілік ұнтақтар, бояулар, пасталар, суспензиялар'],
['Ультрадыбыстық','жиілігі &gt; 20 кГц тербелістер заттың бөлшектерін ыдыратады','дәрілік эмульсиялар, суспензиялар; ультрадыбыстық ингаляторлар (небулайзер) аэрозоль түзеді'],
['Электрлік (Бредиг әдісі)','суға батырылған металл электродтар арасында вольт доғасы: металл буланып, суда конденсацияланады','Au, Ag, Pt зольдері (диспергация + конденсация қатар жүреді)']])}
<h3>Конденсациялық әдістер</h3>
<p>Молекулалар мен иондардың коллоидты агрегаттарға бірігуі нәтижесінде <b>гомогенді ортада жаңа фазаның түзілуі</b>.</p>
<ul><li><b>Физикалық конденсация:</b> <i>еріткішті алмастыру</i> — күкірт, канифоль, холестериннің спирттегі ерітіндісін суға құяды → зат суда ерімейді → золь түзіледі; <i>бу конденсациясы</i> — сынап буын суық суға жібереді → сынап золі.</li><li><b>Химиялық конденсация</b> — нашар еритін зат түзетін кез келген реакция:</li></ul>
${T(['Реакция түрі','Теңдеуі','Золь'],[
['Гидролиз','FeCl'+B(3)+' + 3H'+B(2)+'O → Fe(OH)'+B(3)+' + 3HCl (қайнаған суда)','Fe(OH)'+B(3)],
['Тотықсыздану','2HAuCl'+B(4)+' + 3H'+B(2)+'O'+B(2)+' → 2Au + 8HCl + 3O'+B(2),'алтын'],
['Тотығу-тотықсыздану','2H'+B(2)+'S + SO'+B(2)+' → 3S + 2H'+B(2)+'O','күкірт'],
['Алмасу','AgNO'+B(3)+' + KI → AgI + KNO'+B(3),'AgI'],
['Комплекс түзу','күрделі иондардың ыдырауы','әртүрлі']])}
<p class="note"><b>Химиялық конденсацияның 3 шарты:</b> 1) реакция өнімі ортада ерімейді; 2) реагенттердің біреуі <b>артық</b> — ол стабилизатор болады (мицелланың ПАИ-ін береді); 3) ерітінділер <b>сұйылтылған</b> (әйтпесе тұнба түседі).</p>
<h3>Пептизация</h3>
<p><b>Пептизация</b> — пептизаторлардың (электролит, БАЗ, еріткіш) әсерінен жаңа түскен тұнбаның <b>золь күйіне өтуі</b>. Бұл — коагуляцияға кері процесс.</p>
${fig('0 0 380 150',`<rect x="20" y="100" width="100" height="30" rx="6" class="solid"/>
${Array.from({length:12},(_,i)=>`<circle cx="${30+(i%6)*16}" cy="${108+Math.floor(i/6)*14}" r="6" class="f-o"/>`).join('')}
<text x="70" y="146" class="t3" text-anchor="middle">Fe(OH)₃ тұнбасы</text>
<text x="160" y="90" class="t3a" text-anchor="middle">+ аз FeCl₃</text><text x="160" y="110" class="t1" text-anchor="middle" style="fill:#F98613;font-size:22px">→</text>
<rect x="200" y="20" width="170" height="120" rx="10" class="liq"/>
${Array.from({length:9},(_,i)=>{const x=220+(i%3)*55,y=45+Math.floor(i/3)*35;return `<g>${jig(i)}<circle cx="${x}" cy="${y}" r="7" class="f-o"/>${[0,1,2,3].map(k=>{const a=k*1.57;return `<text x="${(x+12*Math.cos(a)).toFixed(1)}" y="${(y+12*Math.sin(a)+3).toFixed(1)}" class="t3" style="font-size:9px;fill:#C93545;font-weight:900" text-anchor="middle">+</text>`}).join('')}</g>`}).join('')}
<text x="285" y="152" class="t3" text-anchor="middle">бөлшектер тебіледі → золь</text>`,'5-сурет. Адсорбциялық пептизация: Fe³⁺ адсорбцияланып, бөлшектерді бір аттас зарядтайды')}
${T(['Пептизация түрі','Мәні','Мысал'],[
['Адсорбциялық','тұнба бөлшектері электролиттің <b>таңдамалы ионын адсорбциялап</b>, бір аттас зарядталады да, бір-бірінен тебіледі','Fe(OH)'+B(3)+' тұнбасы + аз FeCl'+B(3)+' → Fe'+S('3+')+' адсорбцияланады → оң золь'],
['Химиялық (диссолюциялық)','пептизатор тұнбамен <b>әрекеттесіп</b>, стабилизатор-электролит түзеді','Fe(OH)'+B(3)+' + HCl → FeOCl + 2H'+B(2)+'O; FeOCl ⇄ FeO'+S('+')+' + Cl'+S('−')+' (FeO'+S('+')+' — ПАИ)']])}
<p class="note"><b>Медицинада:</b> пептизация тромб, бляшка және тастардың ұсақ бөлшектерге ыдырап, таралу процесін түсіндіреді; емдеуде атеросклероздық бляшкаларды, тромбтарды «ерітуге» бағытталған әсерлер осыған негізделген.</p>`},

{n:3,short:'Мицелла құрылысы',h:'Гидрофобты золь мицелласының құрылысы',body:`
<p><b>Мицелла</b> — лиофобты зольдің құрылымдық, электрлік бейтарап бірлігі: <b>қос электрлік қабатпен (ҚЭҚ) қоршалған</b> дисперсті фаза бөлшегі. <b>Интермицеллярлы сұйықтық</b> — мицеллаларды бөліп тұрған дисперсті орта.</p>
<h3>Мысал: AgNO${B(3)}-тің артық мөлшерінде алынған AgI золі</h3>
<span class="fx">AgNO${B(3)} (артық) + KI → AgI↓ + KNO${B(3)}</span>
${fig('0 0 430 300',`<rect x="0" y="0" width="430" height="300" rx="12" class="liq"/>
<circle cx="150" cy="150" r="125" fill="none" stroke="#16875A" stroke-dasharray="5 5"/><circle cx="150" cy="150" r="82" fill="#fff" fill-opacity=".55" stroke="#F98613" stroke-width="2"/>
<circle cx="150" cy="150" r="58" fill="none" stroke="#0038BD" stroke-width="2"/>
<circle cx="150" cy="150" r="36" class="solid"/><text x="150" y="146" class="t3w" text-anchor="middle">m[AgI]</text><text x="150" y="160" class="t4w" text-anchor="middle">агрегат</text>
<g>${RO('0 150 150;360 150 150',40)}${Array.from({length:10},(_,i)=>{const a=i/10*6.283;return ion((150+47*Math.cos(a)).toFixed(1),(150+47*Math.sin(a)).toFixed(1),'+','f-b')}).join('')}</g>
<g>${RO('360 150 150;0 150 150',50)}${Array.from({length:7},(_,i)=>{const a=i/7*6.283+.3;return ion((150+70*Math.cos(a)).toFixed(1),(150+70*Math.sin(a)).toFixed(1),'−','f-r')}).join('')}</g>
${[[40,60],[255,70],[260,230],[60,250],[150,282],[30,160],[270,150]].map((p,i)=>`<g>${TR(`0,0;${(i%2?8:-8)},${(i%3)*4-4};0,0`,2.5+i*.3)}${ion(p[0],p[1],'−','f-r')}</g>`).join('')}
<line x1="186" y1="140" x2="300" y2="40" class="lead"/><text x="302" y="40" class="t3">ядро</text>
<line x1="197" y1="150" x2="300" y2="80" class="lead"/><text x="302" y="80" class="t3b">nAg⁺ (ПАИ)</text>
<line x1="216" y1="170" x2="300" y2="120" class="lead"/><text x="302" y="120" class="t3a">(n−x)NO₃⁻</text><text x="302" y="133" class="t3" style="font-size:9px">адсорбц. қабат</text>

<text x="302" y="245" class="t3g">xNO₃⁻ диффуз.</text><text x="302" y="258" class="t3g">қабат</text>`,'6-сурет. AgI мицелласы: агрегат → ПАИ (Ag⁺) → адсорбциялық қабат → диффузиялық қабат')}
${T(['Мицелла бөлігі','Формуласы','Түсінік'],[
['Агрегат','m[AgI]','ерімейтін заттың микрокристалы'],
['Потенциал анықтаушы иондар (ПАИ)','nAg'+S('+'),'агрегат бетіне адсорбцияланып, оған заряд береді'],
['Ядро = агрегат + ПАИ','m[AgI]·nAg'+S('+'),'оң зарядталған'],
['Адсорбциялық қабаттың қарсы иондары','(n − x)NO'+B(3)+S('−'),'ядроға берік байланысқан'],
['Гранула (коллоидты бөлшек) = ядро + адсорбц. қабат','{m[AgI]·nAg'+S('+')+'·(n−x)NO'+B(3)+S('−')+'}'+S('x+'),'заряды +x — электрофорезде осы қозғалады'],
['Диффузиялық қабаттың қарсы иондары','xNO'+B(3)+S('−'),'тек электростатикалық күшпен, әлсіз ұсталады'],
['Мицелла = гранула + диффузиялық қабат','{m[AgI]·nAg'+S('+')+'·(n−x)NO'+B(3)+S('−')+'}'+S('x+')+'·xNO'+B(3)+S('−'),'жалпы электрлік бейтарап']])}
<h3>Мицелла формуласын құру алгоритмі (6 қадам)</h3>
<ol><li><b>Агрегатты</b> анықта — ерімейтін зат: m[AgI].</li><li><b>Артық реагентті</b> тап: AgNO${B(3)}.</li><li><b>ПАИ</b> — артық реагенттің агрегатпен <b>ортақ</b> ионы (Панет–Фаянс / слайдта «Песков–Фаянс» ережесі): nAg${S('+')}.</li><li><b>Қарсы иондар</b> — артық реагенттің екінші ионы: NO${B(3)}${S('−')}; (n − x) — адсорбциялық қабатта, x — диффузиялық қабатта.</li><li><b>Гранула заряды</b> = ПАИ заряды: x+.</li><li><b>Мицелла</b> жалпы электрлік бейтарап.</li></ol>
<p class="note"><b>Панет–Фаянс ережесі:</b> ядро бетіне агрегаттың кристалдық торын жетілдіре алатын (оған ортақ элементі бар) және ерітіндіде <b>артық</b> мөлшерде болатын ион адсорбцияланады.</p>
<h3>Әр түрлі зольдердің мицеллалары</h3>
${T(['Золь және жағдай','Мицелла формуласы','Гранула заряды','Электрофорезде'],[
['AgI, AgNO'+B(3)+' артық','{m[AgI]·nAg'+S('+')+'·(n−x)NO'+B(3)+S('−')+'}'+S('x+')+'·xNO'+B(3)+S('−'),'оң (+)','катодқа (−)'],
['AgI, KI артық','{m[AgI]·nI'+S('−')+'·(n−x)K'+S('+')+'}'+S('x−')+'·xK'+S('+'),'теріс (−)','анодқа (+)'],
['Fe(OH)'+B(3)+' (FeCl'+B(3)+' гидролизі)','{m[Fe(OH)'+B(3)+']·nFeO'+S('+')+'·(n−x)Cl'+S('−')+'}'+S('x+')+'·xCl'+S('−'),'оң (+)','катодқа (−)'],
['BaSO'+B(4)+', BaCl'+B(2)+' артық','{m[BaSO'+B(4)+']·nBa'+S('2+')+'·2(n−x)Cl'+S('−')+'}'+S('2x+')+'·2xCl'+S('−'),'оң (+)','катодқа (−)'],
['As'+B(2)+'S'+B(3)+', H'+B(2)+'S артық','{m[As'+B(2)+'S'+B(3)+']·nHS'+S('−')+'·(n−x)H'+S('+')+'}'+S('x−')+'·xH'+S('+'),'теріс (−)','анодқа (+)']])}
<p class="note"><b>Жиі қате:</b> гранула зарядын қарсы иондар бойынша емес, <b>ПАИ</b> бойынша анықтаймыз. KI артық болса — бәрі «айналады»: ПАИ = I${S('−')}, қарсы ион = K${S('+')}, гранула теріс.</p>
<h3>Қос электрлік қабат (ҚЭҚ) және потенциалдар</h3>
${fig('0 0 380 190',`<line x1="40" y1="20" x2="40" y2="170" class="ax"/><line x1="40" y1="170" x2="370" y2="170" class="ax"/>
<text x="6" y="26" class="t2">φ</text><text x="355" y="186" class="t2">x</text>
<rect x="40" y="20" width="40" height="150" fill="#9AA3B5" opacity=".35"/><text x="60" y="186" class="t3" text-anchor="middle">ядро</text>
<rect x="80" y="20" width="40" height="150" fill="#F98613" opacity=".15"/><text x="100" y="186" class="t3" text-anchor="middle">адс.</text>
<text x="230" y="186" class="t3" text-anchor="middle">диффузиялық қабат</text>

<h3>Коллоидты қорғау</h3>
<p><b>Коллоидты қорғау</b> — золь құрамына жоғары молекулалы қосылыстар (ЖМҚ: ақуыздар, полисахаридтер, пектиндер) енгізгенде, бөлшек бетінде адсорбциялық-сольваттық қабат түзіліп, зольдің агрегативті тұрақтылығының артуы.</p>

<p class="note"><b>Ағзада:</b> қан ақуыздары холестерин мен кальций тұздарының тамыр қабырғасында тұнуына, несеп және өт жолдарында тас түзілуіне кедергі жасайды. Қорғау әлсіресе → <b>атеросклероз</b>, <b>бүйрек және өт тастары</b>.</p>`},

P('3. Пропанол, бутанол және гексанол ерітінділерінің беттік керілу изотермаларын салыңыз. Су–ауа және су–бензол шекарасында БАЗ молекулалары қалай бағытталады?',

P('4. Концентрациясы 1 М натрий стеараты, сірке қышқылы, қант және натрий сульфаты ерітінділерін беттік керілудің артуы бойынша орналастырыңыз. Қайсысы беттік активті зат?',

P('5. Күшті электролиттердің адсорбциясы қандай ерекшеліктермен сипатталады? Эквивалентті және ион алмасу адсорбциясы. Панет–Фаянс ережесі.',
'Күшті электролиттер ерітіндіде толық иондарға ыдырайды, сондықтан олардың адсорбциясы <b>ион түрінде</b> жүреді. Иондар негізінен полярлы адсорбенттерде, яғни иондық кристалдардың бетінде адсорбцияланады. Адсорбцияланған ион бетке заряд береді, оған қарсы иондар тартылып, <b>қос электр қабаты</b> түзіледі. Иондардың адсорбциясы олардың зарядына, радиусына және гидратациясына тәуелді. <b>Эквивалентті адсорбцияда</b> катиондар мен аниондар бетке эквивалентті мөлшерде жиналады, ал <b>ион алмасу адсорбциясында</b> адсорбент бір ионды сіңіріп, орнына ерітіндіге сол зарядты басқа ионды береді. <b>Панет–Фаянс ережесі:</b> кристалл бетінде алдымен оның құрамына кіретін немесе кристалл торын жалғастыра алатын иондар адсорбцияланады.',
'<b>Молекулалық адсорбциядан айырмашылығы:</b>'+T(['','Молекулалық адсорбция','Ионды адсорбция'],[
['Кімдерге тән','Бейэлектролиттер, әлсіз электролиттер','Күшті электролиттер'],['Не адсорбцияланады','Бүтін молекула','Жеке ион (катион не анион)'],
['Адсорбент','Көбіне полярсыз (көмір)','Полярлы (иондық кристалдар)'],['Нәтижесі','Бет зарядталмайды','Бет зарядталады, қос электр қабаты түзіледі']])+

P('6. Қандай иондар (а) күміс хлоридінің, (б) кальций фосфатының кристалл торын жетілдіре алады?',
'Панет–Фаянс ережесі бойынша торды тек кристалдың өз құрамындағы немесе оларға изоморфты иондар жалғастыра алады.<br><b>(а) AgCl</b> үшін — <b>Ag'+S('+')+' және Cl'+S('−')+'</b> иондары (сондай-ақ изоморфты Br'+S('−')+', I'+S('−')+'). Ерітіндіде AgNO'+B(3)+' артық болса, Ag'+S('+')+' адсорбцияланып, бет оң зарядталады; KCl артық болса, Cl'+S('−')+' адсорбцияланып, бет теріс зарядталады.<br><b>(б) Ca'+B(3)+'(PO'+B(4)+')'+B(2)+'</b> үшін — <b>Ca'+S('2+')+' және PO'+B(4)+S('3−')+'</b> иондары (pH-қа байланысты HPO'+B(4)+S('2−')+').',

P('7. Пропион және май қышқылдарының беттік керілу мәндері берілген. Беттік активтілігін есептеп, салыстырыңыз.',

<h3>3) Басқа жіктелу тәсілдері</h3>
<ul><li><b>Биологиялық қызметі бойынша:</b> құрылыс элементтері (органогендер, Ca, P, F — сүйек пен тіс); электролиттер (Na${S('+')}, K${S('+')}, Cl${S('−')}, Ca${S('2+')}, Mg${S('2+')} — осмостық қысым, жүйке импульсі); биокатализаторлар мен реттегіштер (d-элементтер: Fe, Cu, Zn, Mn, Co, Mo — ферменттердің белсенді орталығы).</li>
<li><b>Периодтық жүйедегі орны бойынша:</b> s-элементтер (H, Na, K, Mg, Ca), p-элементтер (C, N, O, P, S, F, Cl, Br, I, Se), d-элементтер (Fe, Cu, Zn, Mn, Co, Mo, Cr) — толығырақ 2-сұрақта.</li>
<li><b>Ағзаға қажеттілігі бойынша:</b> өмірге қажетті (эссенциалды) — жетіспесе ауру туындайды; шартты қажетті (мысалы, Ni, Si, B); қоспа элементтер — қоршаған ортадан түседі (Pb, Hg, Cd, Al), көбі улы.</li></ul>
<h3>4) «Өмір металдары»</h3>
<p><b>Өмір металдары</b> — биополимерлердің құрылымы мен қызметін қажетті деңгейде ұстайтын он металл: <b>Na, K, Ca, Mg</b> (s-элементтер) және <b>Zn, Fe, Mn, Cu, Co, Mo</b> (d-элементтер). s-металдар — негізінен электролиттер, d-металдар — ферменттер мен ақуыздардың белсенді орталығы (гемоглобиндегі Fe, B${B(12)}-дегі Co, карбоангидразадағы Zn).</p>
<h3>Негізгі ұғымдар</h3>
<ul><li><b>Элементтер топографиясы</b> — элементтің ағзадағы органдар, жасушалар және биосұйықтықтар бойынша таралуы (I — қалқанша безде, Ca — сүйекте, Fe — эритроциттерде).</li>
<li><b>Химиялық гомеостаз</b> — биогенді элементтер концентрациясының оңтайлы деңгейін тұрақты ұстау. Жетіспеушілік те, артықшылық та ауруға әкеледі.</li>
<li><b>Синергизм</b> — бір элемент екіншісінің белсенділігін күшейтеді; <b>антагонизм</b> — әлсіретеді (5-сұрақта).</li>
<li><b>Эндемиялық аурулар</b> — белгілі бір аймақтың топырағы мен суындағы элемент мөлшерінің ауытқуынан болатын аурулар (5-сұрақта).</li></ul>
