/* Layout: a lab notebook in deep ink-blue — one column app shell, topics as a numbered course list, formulas set on pale-blue "plates". */
:root{
  --navy:#0038BD; --blue:#0038BD; --blue-2:#0038BD; --blue-soft:#EBF0FB; --ink:#171717; --ink-2:#737373; --line:#E5E5E5;
  --bg:#F7F8FC; --surface:#FFFFFF; --ok:#16875A; --ok-soft:#E1F4EA; --bad:#C93545; --bad-soft:#FBE8EA; --warn:#F98613;
  --accent:#F98613; --accent-soft:#FEF1E3; --accent-ink:#B45A00;
  --on-navy:#FFFFFF; --hero-1:#0038BD; --hero-2:#0038BD;
  --f:"Nunito",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(23,23,23,.05),0 8px 24px rgba(23,23,23,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-2)}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
h1,h2,h3{text-wrap:balance;line-height:1.18;margin:0}
.muted{color:var(--ink-2)}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-2);font-weight:700}
sub,sup{font-size:.72em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .2em;line-height:1.25}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em}
.fr>span:last-child{padding:0 .25em}
.fx{display:block;overflow-x:auto;background:var(--blue-soft);border-radius:12px;padding:12px 16px;margin:10px 0;font-weight:600;font-size:16px;white-space:nowrap}
.fx small{font-weight:500;color:var(--ink-2);margin-left:10px;font-size:13px;white-space:normal}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;letter-spacing:.01em}
.brand img{width:34px;height:34px;border-radius:9px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink-2);letter-spacing:0}
.bar .sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 18px;font-size:16px;font-weight:800;touch-action:manipulation;text-decoration:none;color:var(--ink)}
.iconbtn:hover{border-color:var(--blue-2)}
.iconbtn[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue-2)}

/* gate */
.gate{min-height:100%;display:grid;place-items:center;padding:48px 16px;background:var(--bg)}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px 26px;box-shadow:var(--shadow);text-align:center;display:grid;gap:18px}
.gate-card img.logo{width:72px;height:72px;border-radius:18px;margin:0 auto}
.gate-card h1{font-size:28px;font-weight:800}
.gate-card form{display:grid;gap:10px}
.code-in{width:100%;min-height:56px;font-size:20px;letter-spacing:.18em;text-align:center;text-transform:uppercase;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.code-in:focus{outline:none;border-color:var(--blue-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:52px;padding:12px 22px;font-weight:800;background:var(--blue);color:var(--on-navy);text-decoration:none;font-size:16.5px;touch-action:manipulation}
.btn:hover{filter:brightness(1.12)}
.btn.blue{background:var(--blue-2);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue-2)}
.btn[disabled]{opacity:.45;cursor:default}
.err{color:var(--bad);font-size:14px;min-height:20px}

/* home */
.hero{margin-block:24px 18px;border-radius:24px;padding:clamp(24px,5vw,44px);background:var(--blue);color:#fff;display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:center;overflow:hidden;position:relative}
.hero h1{font-size:clamp(30px,5.4vw,50px);font-weight:800;letter-spacing:-.015em}
.hero h1 em{font-style:normal;color:#FFC48A}
.hero p{font-size:16.5px;max-width:50ch;margin:12px 0 0;color:#E3EAFF}
.hero .eyebrow{color:#CFDCFF}
.hero-tag{display:inline-flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-tag span{font-size:13px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 11px;color:#E4ECFF;font-variant-numeric:tabular-nums}
.hero svg{width:100%;max-width:240px;justify-self:center}
.tg{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-block:4px 28px}
.tg .tgi{width:44px;height:44px;border-radius:50%;background:var(--blue-2);display:grid;place-items:center;flex:none}
.tg .tgt{flex:1;min-width:200px}
.tg b{display:block;font-size:16px}
.tg span{color:var(--ink-2);font-size:14px}
.secthead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:6px 12px}
.secthead h2{font-size:22px;font-weight:800}
.mods{display:grid;gap:10px;margin:0 0 48px;padding:0;list-style:none}
.mod{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.mod .no{width:46px;height:46px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.mod .t{min-width:0}
.mod .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.mod .t .sub{font-size:13.5px;color:var(--ink-2)}
.mod .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.chip.on{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.mod.soon .no{background:var(--bg);color:var(--ink-2);border:1px solid var(--line)}
.mod.soon .t b{color:var(--ink-2)}
.soon-tag{font-size:13px;color:var(--ink-2);white-space:nowrap}
footer{border-top:1px solid var(--line);padding-block:22px 40px;color:var(--ink-2);font-size:12.5px}

/* module */
.mhead{padding-block:22px 4px;display:grid;gap:6px}
.mhead h1{font-size:clamp(24px,4.2vw,36px);font-weight:800}
.back-link{display:inline-flex;align-items:center;min-height:44px;font-size:15.5px;font-weight:700;text-decoration:none;color:var(--ink-2)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:14px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);z-index:10;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 20px 8px 10px;font-weight:800;font-size:16.5px;touch-action:manipulation}
.tab i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab[aria-selected="true"] i{background:#fff;color:var(--blue)}
.panel{padding-block:8px 60px}
.next-step{display:flex;justify-content:flex-end;margin-top:28px}

/* notes */
.intro{font-size:16px;max-width:70ch;margin:4px 0 16px;color:var(--ink-2)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.toc button{min-height:44px;font-size:14.5px;font-weight:700;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px}
.toc button:hover{border-color:var(--blue-2)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px clamp(16px,3vw,30px);margin-bottom:14px;scroll-margin-top:130px}
.sec .qn{font-size:12px;font-weight:800;color:var(--blue-2);letter-spacing:.1em;text-transform:uppercase}
.sec>h2{font-size:19px;font-weight:800;margin:4px 0 12px}
.prose{max-width:74ch;min-width:0}
.prose p{margin:0 0 11px}
.prose h3{font-size:15.5px;font-weight:800;margin:16px 0 8px;color:var(--blue)}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin:4px 0}
.prose li::marker{color:var(--blue-2);font-weight:700}
.prose .note{margin:12px 0;padding:12px 16px;border-radius:12px;background:var(--blue-soft)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:8px 0 12px}
table.tt{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
.tt th,.tt td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tt th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--bg)}
.tt tr:last-child td{border-bottom:0}
.tt td.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* flashcards */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:3px}
.seg button{border:0;background:transparent;border-radius:11px;min-height:46px;padding:8px 18px;font-size:16px;font-weight:800;color:var(--ink-2);touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.toolbar .sp{flex:1}
.counter{font-variant-numeric:tabular-nums;color:var(--accent-ink);font-size:15px;font-weight:800}
.card{position:relative;perspective:1600px;cursor:pointer;height:clamp(340px,52vh,460px)}
.card-in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;box-shadow:var(--shadow);padding:22px clamp(18px,4vw,36px);display:flex;flex-direction:column;gap:10px;overflow:auto}
.face.front{background:var(--blue);color:#fff}
.face.back{background:var(--surface);border:1px solid var(--line);transform:rotateY(180deg)}
.face .hint{font-size:12.5px;display:flex;justify-content:space-between;gap:10px;font-weight:600;opacity:.75}
.face.front .term{flex:1;display:grid;place-items:center;text-align:center;font-size:clamp(22px,3.8vw,32px);font-weight:800;line-height:1.25}
.face.back .ans{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:16px}
.face.back .ans b.h{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-2)}
.cardnav{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;margin-top:14px}
.cardnav .btn{padding:12px 16px;min-height:56px}
.know{background:var(--ok-soft)!important;color:var(--ok)!important}
.again{background:var(--bad-soft)!important;color:var(--bad)!important}
.bar-prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* tests */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pickc{display:grid;gap:8px;align-content:start;text-align:left;min-height:120px;touch-action:manipulation;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.pickc:hover:not([disabled]){border-color:var(--blue-2)}
.pickc b{font-size:16px;font-weight:800}
.pickc span{font-size:13.5px;color:var(--ink-2)}
.pickc .chip{justify-self:start}
.pickc[disabled]{opacity:.6;cursor:default}
.var-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.var-row button{min-width:130px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px clamp(16px,3.4vw,30px);box-shadow:var(--shadow)}
.qnum{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:8px}
.qtext{font-size:clamp(17px,2.4vw,20px);font-weight:700;line-height:1.4;margin-bottom:6px}
.qmulti{font-size:13.5px;font-weight:800;color:var(--accent-ink);margin-bottom:12px}
.opts{display:grid;gap:9px}
.opt{display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:center;text-align:left;min-height:64px;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 16px;font-size:16.5px;font-weight:600;touch-action:manipulation}
.opt:hover:not([disabled]){border-color:var(--blue-2)}
.opt .k{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-weight:900;font-size:15.5px}
.opt .why{grid-column:2;font-size:14.5px;font-weight:500;color:var(--ink-2);margin-top:6px;line-height:1.5}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--blue-2);background:var(--blue-soft)}
.opt.sel .k{background:var(--blue-2);color:#fff;border-color:var(--blue-2)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.exp{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--blue-soft)}
.exp b{display:block;margin-bottom:4px}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.result{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:20px}
.result .big{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.review{display:grid;gap:14px}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2);background:var(--surface);border:1.5px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* problems */
.plist{display:grid;gap:14px}
.prob{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.prob>header{display:flex;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.prob>header .no{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.prob>header h3{font-size:16px;font-weight:800}
.prob>header .src{font-size:12px;color:var(--ink-2);font-weight:600}
.pbody{display:grid;grid-template-columns:1fr 1fr;min-width:0}
.pcol{padding:18px 20px;min-width:0}
.pcol+.pcol{border-left:1px solid var(--line);background:color-mix(in srgb,var(--blue-soft) 45%,var(--surface))}
.pcol .lbl{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--blue-2);margin-bottom:8px}
.pcol .ptext{font-weight:600;margin-bottom:10px}
.steps{margin:0;padding-left:22px;display:grid;gap:5px}
.steps li::marker{color:var(--blue-2);font-weight:800}
.ansline{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.tryrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.tryrow label{font-weight:700}
.tryrow input{width:150px;min-height:52px;font-size:17px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.tryrow input:focus{outline:none;border-color:var(--blue-2)}
.fb{font-size:14px;padding:9px 12px;border-radius:10px;margin-top:10px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
details.sol{margin-top:10px}
details.sol summary{cursor:pointer;font-weight:800;color:var(--blue);font-size:16px;padding:12px 0;min-height:44px}

.loading{padding:60px 0;text-align:center;color:var(--ink-2)}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .hero svg{display:none}
  .mod{grid-template-columns:40px 1fr;gap:12px}
  .mod .no{width:40px;height:40px}
  .mod .open,.mod .soon-tag{grid-column:2;justify-self:start}
  .pbody{grid-template-columns:1fr}
  .pcol+.pcol{border-left:0;border-top:1px solid var(--line)}
  .cardnav{grid-template-columns:auto 1fr 1fr auto}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.abox{border-radius:14px;padding:14px 16px;margin-top:12px;font-size:16px;line-height:1.6}
.abox .albl{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.abox.ok{background:var(--ok-soft);border:1.5px solid var(--ok)}
.abox.ok .albl{color:var(--ok)}
.abox.ok .atxt{font-weight:700;color:var(--ink)}
.abox.ok.long .atxt{font-weight:500}
.abox.ok.long .atxt b{font-weight:800}
.abox.why{background:var(--blue-soft);border:1.5px solid transparent}

.abox .akey{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--ok);color:#fff;font-size:14px;font-weight:900;margin-right:6px}
.abox .anote{font-weight:500;color:var(--ink-2);font-size:14.5px;margin-top:6px}
.opt.dim{opacity:.6}
.qnum span:first-child{font-weight:900;color:var(--blue);text-transform:none}
</style>

intro:'Конспект тақырыптың 16 негізгі сұрағына нақты жауап ретінде құрылған (оқулық: Веренцова т.б., 4-тақырып, 60–70 беттер).',

{n:16,short:'Электролиттік диссоциация',h:'Электролиттік диссоциация. Аррениус теориясы. Күшті және әлсіз электролиттер',body:`
<p><b>Электролиттер</b> — суда ерігенде немесе балқығанда иондарға ыдырайтын және электр тогын өткізетін заттар (қышқылдар, негіздер, тұздар).</p>
<p><b>Электролиттік диссоциация</b> — заттың полярлы еріткіш молекулаларымен әрекеттесуі нәтижесінде иондарға ыдырауы: NaCl → Na<sup>+</sup> + Cl<sup>−</sup>.</p>
<h3>Аррениус теориясының негізгі қағидалары</h3>
<ol><li>Электролиттер ерітіндіде оң (катион) және теріс (анион) иондарға ыдырайды.</li><li>Ток өткенде катиондар катодқа, аниондар анодқа қарай қозғалады.</li><li>Диссоциация — қайтымды процесс: молекулалар иондарға ыдырайды, иондар қайта қосылады.</li><li>Қышқыл — суда H<sup>+</sup> түзетін, негіз — OH<sup>−</sup> түзетін электролит.</li></ol>
<h3>Диссоциацияның себептері</h3>
<ul><li>иондардың сольватациясы (гидратациясы) кезінде бөлінетін энергия байланысты үзеді;</li><li>судың диэлектрлік өтімділігі жоғары болғандықтан иондардың тартылысы әлсірейді;</li><li>диссоциация кезінде жүйе энтропиясы артады.</li></ul>
<h3>Күшті және әлсіз электролиттер</h3>
<div class="tbl-wrap"><table class="tt"><thead><tr><th>Түрі</th><th>α</th><th>Мысалдар</th></tr></thead><tbody>
<tr><td>Күшті</td><td class="num">α &gt; 0,3</td><td>HCl, H<sub>2</sub>SO<sub>4</sub>, HNO<sub>3</sub>, KOH, NaOH, NaCl, KNO<sub>3</sub></td></tr>
<tr><td>Орташа</td><td class="num">0,03 &lt; α &lt; 0,3</td><td>H<sub>3</sub>PO<sub>4</sub>, H<sub>2</sub>SO<sub>3</sub>, HF, H<sub>2</sub>C<sub>2</sub>O<sub>4</sub></td></tr>
<tr><td>Әлсіз</td><td class="num">α &lt; 0,03</td><td>CH<sub>3</sub>COOH, H<sub>2</sub>CO<sub>3</sub>, HCN, H<sub>2</sub>S, NH<sub>4</sub>OH</td></tr></tbody></table></div>`},
{n:17,short:'Активтілік, иондық күш',h:'Күшті электролит ерітінділерінің ерекшеліктері. Активтілік. Активтілік коэффициенті. Иондық күш',body:`
<p>Күшті электролит толық ыдырайды, бірақ ерітіндіде иондар көп болғандықтан олар бір-бірін тартып, әр ионның айналасында қарсы зарядты «иондық атмосфера» түзіледі. Сондықтан реакцияға нақты қатысатын иондар саны жалпы концентрациядан аз болып көрінеді.</p>
<p><b>Активтілік (a)</b> — электролиттің реакцияға нақты қатысатын иондарының «тиімді» концентрациясы, моль/л:</p>
<span class="fx">a(X) = f(X) · C(X)</span>
<p><b>Активтілік коэффициенті (f)</b> — нақты концентрациядан активтіліктің қаншалықты ауытқитынын көрсетеді (өлшемсіз, f ≤ 1). Сұйылтылған ерітіндіде f → 1, яғни a ≈ C.</p>
<p><b>Ерітіндінің иондық күші (I)</b> — барлық иондардың әрекеттесу күшін сипаттайды: әр ион концентрациясын оның зарядының квадратына көбейтіп қосындының жартысын аламыз.</p>
<span class="fx">I = ½ ΣC<sub>i</sub> · z<sub>i</sub><sup>2</sup></span>
<p class="note">Иондық күш артқан сайын f азаяды. Мысалы, қан плазмасының иондық күші ≈ 0,15 моль/л.</p>`},
{n:18,short:'α, K, Оствальд заңы',h:'Иондану дәрежесі және константасы. Оствальдтың сұйылту заңы',body:`
<p><b>Иондану (диссоциациялану) дәрежесі α</b> — иондарға ыдыраған молекулалар санының (n) ерітуге алынған молекулалардың жалпы санына (N) қатынасы. Бірлік бөлігімен немесе пайызбен беріледі.</p>
<span class="fx">α = ${F('n','N')}</span>
<p>α-ға әсер ететін факторлар: байланыстың полярлығы, еріткіштің диэлектрлік өтімділігі, концентрация (сұйылтқанда α өседі), температура (қыздырғанда α өседі).</p>
<p><b>Иондану константасы K</b> — әлсіз электролиттің ыдырау қабілетін көрсетеді. HA ⇄ H<sup>+</sup> + A<sup>−</sup> үшін:</p>
<span class="fx">K = ${F('[H<sup>+</sup>]·[A<sup>−</sup>]','[HA]')}</span>
<p>K концентрацияға тәуелсіз, тек табиғат пен температураға тәуелді. K неғұрлым үлкен — электролит соғұрлым күшті.</p>
<h3>Оствальдтың сұйылту заңы</h3>
<span class="fx">K = ${F('Cα<sup>2</sup>','1 − α')} ; α ≪ 1 болса K = Cα<sup>2</sup> , α = √(K / C)</span>
<p>Заңның мағынасы: әлсіз электролит ерітіндісін сұйылтқанда (C кемігенде) оның диссоциациялану дәрежесі артады.</p>`},
{n:19,short:'Бренстед–Лоури, Льюис',h:'Бренстед–Лоуридің протолиттік теориясы. Льюистің электрондық теориясы',body:`
<h3>Протолиттік теория (Бренстед–Лоури)</h3>
<ul><li><b>Қышқыл</b> — протон (H<sup>+</sup>) беретін молекула немесе ион, протон доноры: HCl, H<sub>2</sub>SO<sub>4</sub>, H<sub>2</sub>O, NH<sub>4</sub><sup>+</sup>, HSO<sub>4</sub><sup>−</sup>, H<sub>3</sub>O<sup>+</sup>.</li>
<li><b>Негіз</b> — протон қосып алатын бөлшек, протон акцепторы: NH<sub>3</sub>, OH<sup>−</sup>, Cl<sup>−</sup>, CH<sub>3</sub>COO<sup>−</sup>, CO<sub>3</sub><sup>2−</sup>.</li>
<li><b>Амфолит</b> — әрі беретін, әрі қабылдайтын бөлшек: H<sub>2</sub>O, HCO<sub>3</sub><sup>−</sup>, HSO<sub>3</sub><sup>−</sup>, H<sub>2</sub>PO<sub>4</sub><sup>−</sup>, аминқышқылдары, ақуыздар.</li></ul>
<p>Қышқыл протон бергенде өзіне <b>түйіндес негіз</b> түзеді: қышқыл ⇄ H<sup>+</sup> + түйіндес негіз. Мысалы, NH<sub>4</sub><sup>+</sup>/NH<sub>3</sub>, H<sub>2</sub>CO<sub>3</sub>/HCO<sub>3</sub><sup>−</sup>, CH<sub>3</sub>COOH/CH<sub>3</sub>COO<sup>−</sup>. Мұндай жұптар <b>протолиттік жұптар</b> деп аталады.</p>
<h3>Электрондық теория (Льюис)</h3>
<ul><li><b>Қышқыл</b> — электрон жұбын қабылдайтын бөлшек (электрон акцепторы): H<sup>+</sup>, NH<sub>4</sub><sup>+</sup>, BF<sub>3</sub>, металл катиондары.</li><li><b>Негіз</b> — электрон жұбын беретін бөлшек (электрон доноры): NH<sub>3</sub>, OH<sup>−</sup>, Cl<sup>−</sup>, CH<sub>3</sub>COO<sup>−</sup>.</li></ul>`},
{n:20,short:'Судың иондық көбейтіндісі, pH',h:'Судың иондық көбейтіндісі. Сутектік көрсеткіш pH ортаның қышқылдығының сипаттамасы ретінде',body:`
<p>Су өте аз мөлшерде иондарға ыдырайды: H<sub>2</sub>O ⇄ H<sup>+</sup> + OH<sup>−</sup>. Берілген температурада [H<sup>+</sup>] мен [OH<sup>−</sup>] көбейтіндісі тұрақты:</p>
<span class="fx">K<sub>H₂O</sub> = [H<sup>+</sup>]·[OH<sup>−</sup>] = 1·10<sup>−14</sup> <small>(25 °C)</small></span>
<p><b>pH</b> — бос сутек иондары концентрациясының теріс таңбамен алынған ондық логарифмі; <b>pOH</b> — гидроксид-иондары үшін дәл солай.</p>
<span class="fx">pH = −lg[H<sup>+</sup>] ; pOH = −lg[OH<sup>−</sup>] ; pH + pOH = 14</span>
<div class="tbl-wrap"><table class="tt"><thead><tr><th>Орта</th><th>[H<sup>+</sup>], моль/л</th><th>[OH<sup>−</sup>], моль/л</th><th>pH</th><th>pOH</th></tr></thead><tbody>
<tr><td>Бейтарап</td><td class="num">10<sup>−7</sup></td><td class="num">10<sup>−7</sup></td><td class="num">7</td><td class="num">7</td></tr>
<tr><td>Қышқылдық</td><td class="num">&gt; 10<sup>−7</sup></td><td class="num">&lt; 10<sup>−7</sup></td><td class="num">&lt; 7</td><td class="num">&gt; 7</td></tr>
<tr><td>Сілтілік</td><td class="num">&lt; 10<sup>−7</sup></td><td class="num">&gt; 10<sup>−7</sup></td><td class="num">&gt; 7</td><td class="num">&lt; 7</td></tr></tbody></table></div>
<p class="note">pH 1 бірлікке өзгерсе, [H<sup>+</sup>] 10 есе өзгереді. Кері есептеу: [H<sup>+</sup>] = 10<sup>−pH</sup>.</p>`},
{n:21,short:'Ағзадағы электролиттер, pH',h:'Тірі ағзадағы электролиттер. Сұйықтықтардың pH мәндері. Қышқылдық-негіздік гомеостаз',body:`
<p>Ағза сұйықтықтарында негізгі электролиттер: катиондар Na<sup>+</sup>, K<sup>+</sup>, Ca<sup>2+</sup>, Mg<sup>2+</sup>; аниондар Cl<sup>−</sup>, HCO<sub>3</sub><sup>−</sup>, HPO<sub>4</sub><sup>2−</sup>/H<sub>2</sub>PO<sub>4</sub><sup>−</sup>, ақуыз аниондары. Олар осмостық қысымды, жүйке импульсін, бұлшықет жиырылуын және pH-ты қамтамасыз етеді.</p>
<div class="tbl-wrap"><table class="tt"><thead><tr><th>Биологиялық сұйықтық</th><th>pH</th></tr></thead><tbody>
<tr><td>Таза асқазан сөлі</td><td class="num">0,9–1,1</td></tr><tr><td>Зәр</td><td class="num">4,8–7,5</td></tr><tr><td>Өттің қалтасы</td><td class="num">5,4–6,9</td></tr><tr><td>Тері (жасушааралық сұйықтық)</td><td class="num">6,2–7,5</td></tr><tr><td>Сілекей</td><td class="num">6,35–6,85</td></tr><tr><td>Сүт</td><td class="num">6,6–6,9</td></tr><tr><td>Аш ішек сөлі</td><td class="num">7,0–8,0</td></tr><tr><td><b>Қан іркіті</b></td><td class="num"><b>7,40 ± 0,05</b></td></tr><tr><td>Жұлын сұйықтығы</td><td class="num">7,40 ± 0,5</td></tr><tr><td>Көз жасы</td><td class="num">7,4 ± 0,1</td></tr><tr><td>Өт жолы</td><td class="num">7,4–8,5</td></tr><tr><td>Ұйқы безі сөлі</td><td class="num">7,5–8,0</td></tr></tbody></table></div>
<p><b>Неге pH тұрақты болуы керек:</b> ферменттер тек белгілі pH-та белсенді, гемоглобиннің оттегін байланыстыруы, мембрана өткізгіштігі, ақуыз құрылымы pH-қа тәуелді. Қан pH-ы 7,35–7,45 шегінен шықса — ацидоз немесе алкалоз; 6,8-ден төмен немесе 7,8-ден жоғары мәндер өмірмен үйлеспейді.</p>
<p><b>Протолиттік гомеостаз</b> — буферлік жүйелердің, өкпенің және бүйректің жұмысы арқасында биологиялық сұйықтықтар pH-ының тұрақты сақталуы.</p>`},
{n:22,short:'Активті, потенциалды, жалпы',h:'Активті, потенциалды және жалпы қышқылдық',body:`
<ul><li><b>Жалпы қышқылдық</b> — ерітіндідегі бос және байланысқан күйдегі барлық сутек катиондарының концентрациясы (титрлеу арқылы анықталады).</li>
<li><b>Активті қышқылдық</b> — ерітіндідегі тек <b>бос</b> H<sup>+</sup> иондарының концентрациясы. pH тек активті қышқылдық бойынша есептеледі.</li>
<li><b>Потенциалды қышқылдық</b> — ыдырамаған молекулалар немесе әлсіз қышқыл иондары түріндегі сутек катиондары.</li></ul>
<span class="fx">Потенциалды = Жалпы − Активті</span>
<p class="note">Мысал: асқазан сөлінің активті қышқылдығы 0,04 моль/л болса, pH = −lg 0,04 = 1,40.</p>`},
{n:23,short:'[H⁺] және [OH⁻] есептеу',h:'Күшті және әлсіз қышқылдар мен негіздерде H⁺ және OH⁻ концентрациясын есептеу',body:`
<div class="tbl-wrap"><table class="tt"><thead><tr><th>Ерітінді</th><th>Формула</th></tr></thead><tbody>
<tr><td>Бір негізді күшті қышқыл (HCl, HNO<sub>3</sub>)</td><td>[H<sup>+</sup>] = C<sub>a</sub></td></tr>
<tr><td>Бір негізді әлсіз қышқыл (CH<sub>3</sub>COOH)</td><td>[H<sup>+</sup>] = α·C<sub>a</sub> ; [H<sup>+</sup>] = √(K<sub>a</sub>·C<sub>a</sub>)</td></tr>
<tr><td>Бір қышқылды күшті негіз (NaOH, KOH)</td><td>[OH<sup>−</sup>] = C<sub>b</sub></td></tr>
<tr><td>Бір қышқылды әлсіз негіз (NH<sub>4</sub>OH)</td><td>[OH<sup>−</sup>] = α·C<sub>b</sub> ; [OH<sup>−</sup>] = √(K<sub>b</sub>·C<sub>b</sub>)</td></tr></tbody></table></div>
<p>C<sub>a</sub>, C<sub>b</sub> — қышқыл, негіз концентрациясы (моль/л); α — иондану дәрежесі; K<sub>a</sub>, K<sub>b</sub> — иондану константалары. Бір шаманы тапқан соң екіншісі: [H<sup>+</sup>] = 10<sup>−14</sup> / [OH<sup>−</sup>].</p>
<p class="note">Мысал: 0,1 М CH<sub>3</sub>COOH, α = 0,01 → [H<sup>+</sup>] = 0,01·0,1 = 10<sup>−3</sup> → pH = 3.</p>`},
{n:24,short:'Буферлік жүйе',h:'Буферлік жүйе. Анықтамасы, жіктелуі, құрамы',body:`
<p><b>Протолиттік буферлік жүйе</b> — сұйылтқанда, аздаған күшті қышқыл немесе күшті негіз қосқанда pH-ын тұрақты сақтайтын ерітінді. Басты сипаттамалары: <b>pH</b> және <b>буферлік сыйымдылық</b>.</p>
<ul><li><b>Қышқылдық буфер</b> — әлсіз қышқыл + оның күшті негізбен түзген тұзы.</li><li><b>Негіздік (сілтілік) буфер</b> — әлсіз негіз + оның күшті қышқылмен түзген тұзы.</li></ul>
<div class="tbl-wrap"><table class="tt"><thead><tr><th>Түрі</th><th>Аталуы</th><th>Құрамы</th></tr></thead><tbody>
<tr><td>Қышқылдық</td><td>Ацетатты</td><td>CH<sub>3</sub>COOH / CH<sub>3</sub>COONa</td></tr>
<tr><td>Қышқылдық</td><td>Гидрокарбонатты</td><td>H<sub>2</sub>CO<sub>3</sub> / NaHCO<sub>3</sub></td></tr>
<tr><td>Қышқылдық</td><td>Фосфатты</td><td>NaH<sub>2</sub>PO<sub>4</sub> / Na<sub>2</sub>HPO<sub>4</sub></td></tr>
<tr><td>Қышқылдық</td><td>Ақуызды</td><td>PtCOOH / PtCOONa</td></tr>
<tr><td>Негіздік</td><td>Аммиакты</td><td>NH<sub>4</sub>OH / NH<sub>4</sub>Cl</td></tr></tbody></table></div>`},
{n:25,short:'Гендерсон–Гассельбах',h:'Буферлік ерітінділердің pH-н есептеу (Гендерсон–Гассельбах теңдеуі)',body:`
<p>Қышқылдық буферде [H<sup>+</sup>] = K<sub>a</sub>·${F('C<sub>a</sub>·V<sub>a</sub>','C<sub>s</sub>·V<sub>s</sub>')}, логарифмдесек:</p>
<span class="fx">pH = pK<sub>a</sub> − lg ${F('C<sub>a</sub>·V<sub>a</sub>','C<sub>s</sub>·V<sub>s</sub>')} <small>қышқылдық буфер</small></span>
<span class="fx">pH = 14 − pK<sub>b</sub> + lg ${F('C<sub>b</sub>·V<sub>b</sub>','C<sub>s</sub>·V<sub>s</sub>')} <small>сілтілік буфер</small></span>
<p>C<sub>a</sub> (C<sub>b</sub>), V<sub>a</sub> (V<sub>b</sub>) — қышқылдың (негіздің) концентрациясы мен көлемі; C<sub>s</sub>, V<sub>s</sub> — тұздікі; pK<sub>a</sub> = −lg K<sub>a</sub>, pK<sub>b</sub> = −lg K<sub>b</sub>.</p>
<p class="note">Қорытынды: буфердің pH-ы компоненттердің <b>қатынасына</b> тәуелді. Сұйылтқанда екеуі бірдей азаяды, қатынас өзгермейді — pH іс жүзінде тұрақты. Қатынас 1 болса, pH = pK<sub>a</sub>.</p>`},
{n:26,short:'Буферлердің әсер ету механизмі',h:'Фосфатты, гидрокарбонатты, ақуызды және гемоглобинді буферлердің әсер ету механизмі',body:`
<p>Жалпы принцип: буфер күшті қышқылды немесе күшті негізді <b>әлсіз электролитке</b> айналдырады. Қышқылды буфердің негіздік компоненті, сілтіні қышқылдық компоненті байланыстырады.</p>
<div class="tbl-wrap"><table class="tt"><thead><tr><th>Жүйе</th><th>H<sup>+</sup> түскенде</th><th>OH<sup>−</sup> түскенде</th></tr></thead><tbody>
<tr><td>Ацетатты</td><td>CH<sub>3</sub>COO<sup>−</sup> + H<sup>+</sup> → CH<sub>3</sub>COOH</td><td>CH<sub>3</sub>COOH + OH<sup>−</sup> → CH<sub>3</sub>COO<sup>−</sup> + H<sub>2</sub>O</td></tr>
<tr><td>Аммиакты</td><td>NH<sub>4</sub>OH + H<sup>+</sup> → NH<sub>4</sub><sup>+</sup> + H<sub>2</sub>O</td><td>NH<sub>4</sub><sup>+</sup> + OH<sup>−</sup> → NH<sub>4</sub>OH</td></tr>
<tr><td>Гидрокарбонатты</td><td>HCO<sub>3</sub><sup>−</sup> + H<sup>+</sup> → H<sub>2</sub>CO<sub>3</sub> → CO<sub>2</sub>↑ + H<sub>2</sub>O</td><td>H<sub>2</sub>CO<sub>3</sub> + OH<sup>−</sup> → HCO<sub>3</sub><sup>−</sup> + H<sub>2</sub>O</td></tr>
<tr><td>Фосфатты</td><td>HPO<sub>4</sub><sup>2−</sup> + H<sup>+</sup> → H<sub>2</sub>PO<sub>4</sub><sup>−</sup></td><td>H<sub>2</sub>PO<sub>4</sub><sup>−</sup> + OH<sup>−</sup> → HPO<sub>4</sub><sup>2−</sup> + H<sub>2</sub>O</td></tr>
<tr><td>Ақуызды</td><td>PtCOO<sup>−</sup> + H<sup>+</sup> → PtCOOH</td><td>PtCOOH + OH<sup>−</sup> → PtCOO<sup>−</sup> + H<sub>2</sub>O</td></tr>
<tr><td>Гемоглобинді</td><td>Hb<sup>−</sup> + H<sup>+</sup> → HHb ; HbO<sub>2</sub><sup>−</sup> + H<sup>+</sup> → HHbO<sub>2</sub></td><td>HHb + OH<sup>−</sup> → Hb<sup>−</sup> + H<sub>2</sub>O ; HHbO<sub>2</sub> + OH<sup>−</sup> → HbO<sub>2</sub><sup>−</sup> + H<sub>2</sub>O</td></tr></tbody></table></div>
<p>Гемоглобин оттегімен байланысады: HHb + O<sub>2</sub> ⇄ HHbO<sub>2</sub>. Оксигемоглобин (HHbO<sub>2</sub>) гемоглобиннен күштірек қышқыл, сондықтан өкпеде H<sup>+</sup> бөлінеді, ал тіндерде оттегін бергенде H<sup>+</sup> байланысады.</p>`},
{n:27,short:'Буферлік сыйымдылық',h:'Буферлік сыйымдылық. Оған әсер ететін факторлар',body:`
<p><b>Буферлік сыйымдылық (B)</b> — 1 л буферлік ерітіндінің pH-ын 1 бірлікке өзгерту үшін қосылатын күшті қышқылдың немесе күшті негіздің мол-эквивалентінің саны. Ол буфердің күшті қышқыл не негізге «қарсы тұру қабілетін» көрсетеді. Өлшем бірлігі: моль/(л·бірл.pH) немесе ммоль/л.</p>
<h3>Әсер ететін факторлар</h3>
<ul><li><b>компоненттердің концентрациясы</b> — неғұрлым көп болса, сыйымдылық соғұрлым үлкен (сұйылтқанда B азаяды);</li><li><b>компоненттердің өзара қатынасы</b> — қатынас 1:1 болғанда B максималды.</li></ul>
<span class="fx">B максималды: қышқылдық буферде pH = pK<sub>a</sub>, ${F('C<sub>a</sub>V<sub>a</sub>','C<sub>s</sub>V<sub>s</sub>')} = 1 ; сілтілік буферде pOH = pK<sub>b</sub></span>`},
{n:28,short:'B<sub>a</sub> және B<sub>b</sub> анықтау',h:'Буферлік сыйымдылықты қышқыл және негіз бойынша анықтау',body:`
<span class="fx">B<sub>a</sub> = ${F('C<sub>a</sub>·V<sub>a</sub>','V<sub>буф</sub>·ΔpH')} <small>қышқыл бойынша</small></span>
<span class="fx">B<sub>b</sub> = ${F('C<sub>b</sub>·V<sub>b</sub>','V<sub>буф</sub>·ΔpH')} <small>негіз бойынша</small></span>
<p>C<sub>a</sub> (C<sub>b</sub>) — қосылған күшті қышқыл (сілті) эквивалентінің молярлық концентрациясы; V<sub>a</sub> (V<sub>b</sub>) — оның көлемі, мл; V<sub>буф</sub> — буферлік ерітінді көлемі, мл; ΔpH — pH өзгерісі. Нәтижені ммоль/л-мен алу үшін 1000-ға көбейтеміз.</p>
<p class="note">Мысал: 10 мл буферге 0,52 мл 1 М NaOH қосқанда pH 1-ге өзгерді: B<sub>b</sub> = 1·0,52 / (10·1) = 0,052 моль/(л·бірл.pH).</p>`},
{n:29,short:'Қанның буферлік жүйелері',h:'Қанның буферлік жүйелері, биологиялық рөлі, қуатын салыстыру',body:`
<p>Қанда төрт буферлік жүйе жұмыс істейді. Плазмада ең қуаттысы — гидрокарбонатты, эритроциттерде — гемоглобинді.</p>
<div class="tbl-wrap"><table class="tt"><thead><tr><th>Буферлік жүйе</th><th>Үлесі, %</th></tr></thead><tbody>
<tr><td><b>Плазмадағы жүйелер</b></td><td class="num"><b>43</b></td></tr>
<tr><td>— гидрокарбонатты H<sub>2</sub>CO<sub>3</sub> / HCO<sub>3</sub><sup>−</sup></td><td class="num">35</td></tr>
<tr><td>— ақуызды PtCOOH / PtCOO<sup>−</sup></td><td class="num">7</td></tr>
<tr><td>— фосфатты H<sub>2</sub>PO<sub>4</sub><sup>−</sup> / HPO<sub>4</sub><sup>2−</sup></td><td class="num">1</td></tr>
<tr><td><b>Эритроциттердегі жүйелер</b></td><td class="num"><b>57</b></td></tr>
<tr><td>— гемоглобинді HHb / Hb<sup>−</sup></td><td class="num">35</td></tr>
<tr><td>— гидрокарбонатты</td><td class="num">18</td></tr>
<tr><td>— фосфатты</td><td class="num">4</td></tr></tbody></table></div>
<ul><li><b>Гидрокарбонатты</b> — қанның сілтілік резервін құрайды; артық қышқыл CO<sub>2</sub> түрінде өкпе арқылы, артық HCO<sub>3</sub><sup>−</sup> бүйрек арқылы шығарылады — ең жылдам реттеледі.</li><li><b>Гемоглобинді</b> — ең қуатты; O<sub>2</sub> мен CO<sub>2</sub> тасымалын pH реттеумен байланыстырады.</li><li><b>Фосфатты</b> — жасуша ішінде және зәрде маңызды; бүйрек артық H<sup>+</sup>-ты H<sub>2</sub>PO<sub>4</sub><sup>−</sup> түрінде шығарады.</li><li><b>Ақуызды</b> — ақуыздар амфолит, –COOH және –NH<sub>2</sub> топтары H<sup>+</sup> мен OH<sup>−</sup> байланыстырады.</li></ul>`},
{n:30,short:'Ацидоз, алкалоз',h:'Ацидоз. Алкалоз. Пайда болу себептері және оларды жою әдістері',body:`
<p><b>Ацидоз</b> — қышқылдық-негіздік тепе-теңдіктің H<sup>+</sup> өсуіне (pH кемуіне) және сілтілік резервтің кемуіне қарай ығысуы. <b>Алкалоз</b> — H<sup>+</sup> кемуіне (pH өсуіне) және сілтілік резервтің артуына қарай ығысуы.</p>
<div class="tbl-wrap"><table class="tt"><thead><tr><th>Бұзылыс</th><th>Көрсеткіштер</th><th>Себебі</th><th>Емдеу</th></tr></thead><tbody>
<tr><td><b>Метаболиттік ацидоз</b></td><td>B<sub>a</sub>↓, pH↓, p(CO<sub>2</sub>)↓, HCO<sub>3</sub><sup>−</sup>↓</td><td>тіндерге оттегі жетіспеуі, бүйрек қызметінің бұзылуы, диарея, диабет</td><td>NaHCO<sub>3</sub>, натрий лактаты, трисамин ерітінділері</td></tr>
<tr><td><b>Респираторлық ацидоз</b></td><td>B<sub>a</sub>↓, pH↓, p(CO<sub>2</sub>)↑, HCO<sub>3</sub><sup>−</sup>↑</td><td>тыныс алу мүшелерінің аурулары (бронхит, пневмония), тыныс орталығының қабынуы</td><td>NaHCO<sub>3</sub>, натрий лактаты, трисамин</td></tr>
<tr><td><b>Метаболиттік алкалоз</b></td><td>B<sub>a</sub>↑, pH↑, p(CO<sub>2</sub>)↑, HCO<sub>3</sub><sup>−</sup>↑</td><td>құсу (HCl жоғалуы), іш қату, сілтілік тағам</td><td>аскорбин қышқылының ерітіндісі</td></tr>
<tr><td><b>Респираторлық алкалоз</b></td><td>B<sub>a</sub>↑, pH↑, p(CO<sub>2</sub>)↓, HCO<sub>3</sub><sup>−</sup>↓</td><td>ауаның аздық етуі (биіктік), өкпенің шамадан тыс жұмысы (гипервентиляция)</td><td>аскорбин қышқылының ерітіндісі</td></tr></tbody></table></div>
<p class="note">Есте сақтау: «метаболиттік» — себеп зат алмасуда (HCO<sub>3</sub><sup>−</sup> өзгереді), «респираторлық» — себеп тыныс алуда (CO<sub>2</sub> өзгереді).</p>`},
{n:31,short:'Метаболиттік көрсеткіштер',h:'Қанның қышқылдық-негіздік жағдайын сипаттайтын метаболиттік көрсеткіштер',body:`
<ul><li>жалпы қанның және плазманың pH-ы (қалыпты 7,40 ± 0,05);</li><li>көмірқышқыл газының парциалды қысымы p(CO<sub>2</sub>);</li><li>плазмадағы гидрокарбонат мөлшері C(HCO<sub>3</sub><sup>−</sup>);</li><li>қышқыл бойынша буферлік сыйымдылық (B<sub>a</sub>);</li><li>плазмадағы буферлік негіздердің мөлшері (BB);</li><li>буферлік негіздердің артық мөлшері немесе жетіспеушілігі (BE).</li></ul>
<p><b>Қанның сілтілік резерві</b> — 100 мл плазмадағы гидрокарбонат түрінде химиялық байланысқан CO<sub>2</sub> көлемі (мл). Көлемдік %-пен өлшенеді; қалыпты жағдайда 50–70 көлемдік % (25–30 ммоль/л).</p>`}

MODS.t01={...EMPTY(),intro:'Конспект тақырыптың 8 негізгі сұрағына жауап ретінде құрылған (оқулық: 6-тақырып, 90–107 беттер).',notes:[
{n:1,short:'Атом моделі, квант сандары',h:'Атомның кванттық-механикалық моделі. Квант сандары',body:`
<p><b>Атом</b> — элементтің химиялық қасиеттерін тасымалдайтын ең кіші электрбейтарап бөлшек. Құрамы: оң зарядталған <b>ядро</b> (протондар + нейтрондар) және оны айнала қозғалатын <b>электрондар</b>.</p>
<ul><li><b>Протон</b> — оң зарядты тұрақты бөлшек (¹H ядросы). <b>Нейтрон</b> — массасы протонға тең, зарядсыз бөлшек.</li><li><b>Ядро заряды</b> = протондар саны Z. <b>Массалық сан</b> A = Z + N.</li><li><b>Электрон</b> — протоннан 1836 есе жеңіл, корпускулалық және толқындық қасиеті бар теріс бөлшек.</li><li><b>Атомдық орбиталь</b> — электронның болу ықтималдығы ең жоғары кеңістік бөлігі.</li></ul>
${T(['Квант саны','Нені сипаттайды','Мәндері'],[
['n — бас','электрон энергиясы, ядродан қашықтығы, энергетикалық деңгей','1, 2 … 7 (K, L, M, N, O, P, Q)'],
['l — орбитальдық','орбиталь пішіні, деңгейше','0 … (n−1): s=0, p=1, d=2, f=3'],
['m — магниттік','орбитальдың кеңістіктегі бағыты','−l … 0 … +l; саны 2l + 1 (s—1, p—3, d—5, f—7)'],
['s — спиндік','электронның өз осінен айналуы','+½ және −½']])}
<p>Деңгейшедегі электрондардың ең көп саны: s<sup>2</sup>, p<sup>6</sup>, d<sup>10</sup>, f<sup>14</sup>. Деңгейдегі ең көп саны: <b>N = 2n<sup>2</sup></b> (K—2, L—8, M—18, N—32).</p>`},
{n:2,short:'Толтыру ережелері',h:'Атомның электрондық қабатын толтыру ережелері',body:`
<ol><li><b>Паули принципі</b> — атомда төрт квант саны бірдей екі электрон болмайды. Сондықтан бір орбитальда спиндері қарама-қарсы ең көбі 2 электрон.</li>
<li><b>Клечковский ережесі</b> (энергия минимумы) — алдымен (n + l) қосындысы аз деңгейше толады; қосынды тең болса, n кішісі бұрын толады.<br>4s: 4+0 = 4, 3d: 3+2 = 5 → алдымен 4s, сосын 3d. 5s (5) → 4d (6).</li>
<li><b>Хунд ережесі</b> — деңгейше ішінде спиндердің қосындысы максималды болуы керек: орбитальдар алдымен бір-бір электронмен, сосын екінші электронмен толады.</li></ol>
<p class="note">Толу реті: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p …</p>`},
{n:3,short:'Классификациясы',h:'Биогенді элементтер. Биогенді элементтердің классификациясы',body:`

<p><b>Органогендер</b> (C, H, O, N, P, S) — тіршіліктің негізі, ағзадағы мөлшері 97,4%: O — 62%, C — 21,15%, H — 10%, N — 3,1%, P — 0,95%, S — 0,16%. Олардан су, көмірсулар, липидтер, ақуыздар, нуклеин қышқылдары, гормондар, дәрумендер, АТФ түзіледі.</p>
${T(['Топ','Ағзадағы мөлшері','Мысалдар'],[

<ul><li><b>Синергизм</b> — бір элемент екіншісінің белсенділігін күшейтеді (Cu<sup>2+</sup> мен Fe<sup>2+</sup>).</li><li><b>Антагонизм</b> — әлсіретеді (Co<sup>2+</sup> мен Fe<sup>2+</sup>, Zn<sup>2+</sup> мен Ca<sup>2+</sup>).</li><li><b>Топография</b> — элементтердің мүшелер мен ұлпалар бойынша таралуы.</li><li><b>Химиялық гомеостаз</b> — биогенді элементтер концентрациясының оңтайлы балансын сақтау.</li></ul>`},
{n:4,short:'Атом құрылысының ерекшеліктері',h:'Биогенді элементтер атомдарының құрылысының ерекшеліктері',body:`

['p-элементтер','IIIA–VIIA топтар','ns<sup>2</sup>np<sup>1–5</sup>; валенттік электрондар саны = топ нөмірі = жоғары тотығу дәрежесі','C, N, O, P, S, F, Cl, Br, I'],
['d-элементтер','үлкен периодтар, қосымша топшалар','алдыңғы (n−1)d қабаты толады, сыртында 1–2 s-электрон','Cr 3d<sup>5</sup>4s<sup>1</sup>, Mn 3d<sup>5</sup>4s<sup>2</sup>, Fe 3d<sup>6</sup>4s<sup>2</sup>, Co 3d<sup>7</sup>4s<sup>2</sup>, Cu 3d<sup>10</sup>4s<sup>1</sup>, Zn 3d<sup>10</sup>4s<sup>2</sup>, Mo 4d<sup>5</sup>5s<sup>1</sup>']])}

{n:5,short:'s-, p-, d-элементтердің рөлі',h:'Биогенді s-, p-, d-элементтер, олардың биологиялық рөлі және медицинада қолданылуы',body:`

['Na<sup>+</sup>','0,08%','осмостық және қышқылдық-негіздік гомеостаз, су алмасу, нерв импульсі, тамыр тонусы','бұлшықет әлсіздігі, тартылу, жүрек-тамыр бұзылысы'],

['Mg<sup>2+</sup>','0,027%','300-ден астам ферментті белсендіреді, жүрек және нерв жүйесі, өт бөлу, липид пен көмірсу алмасуы','жетіспесе — жүрек ырғағы, қозғыштық; артық — ұйықтататын әсер'],

['Se','10<sup>−5</sup>–10<sup>−7</sup>%','глутатионпероксидаза — жасушаны пероксидтерден қорғау, сынапқа қарсы','көп дозада улы']])}
<h3>Медицинада қолданылуы (мысалдар)</h3>
<ul><li>NaCl 0,9% — плазма алмастырғыш; NaCl 10% — гипертонды таңғыш.</li><li>Антисептиктер: H<sub>3</sub>BO<sub>3</sub>, I<sub>2</sub> 5% спирттік ерітінді, Люголь ерітіндісі, H<sub>2</sub>O<sub>2</sub> 3%, KMnO<sub>4</sub>, AgNO<sub>3</sub>, ZnO.</li><li>Антацидтер: CaCO<sub>3</sub>, MgO, NaHCO<sub>3</sub>, Al(OH)<sub>3</sub>, алмагель.</li><li>Іш жүргізетін: Na<sub>2</sub>SO<sub>4</sub>·10H<sub>2</sub>O, MgSO<sub>4</sub>·7H<sub>2</sub>O; седативті: NaBr, KBr; тироксин синтезі: KI, NaI.</li><li>Рентгеноконтраст: BaSO<sub>4</sub>; детоксикация: Na<sub>2</sub>S<sub>2</sub>O<sub>3</sub>; энтеросорбент: белсендірілген көмір.</li></ul>`},
{n:6,short:'«Өмір металдары»',h:'«Өмір металдары» және олардың қосылыстарының тірі ағзадағы рөлі',body:`
<p><b>Өмір металдары</b> — биополимерлердің құрылымы мен функционалдық белсенділігін сақтауға қажет он элемент: <b>Na, K, Ca, Mg, Fe, Zn, Cu, Mn, Co, Mo</b>.</p>
<ul><li><b>Na, K</b> — мембраналық потенциал, осмостық қысым, Na<sup>+</sup>/K<sup>+</sup>-сорғы.</li><li><b>Ca, Mg</b> — сүйек, бұлшықет жиырылуы, фермент активаторлары (Mg — АТФ-пен комплекс).</li><li><b>Fe</b> — гемоглобин (O<sub>2</sub> тасу), цитохромдар (электрон тасу), каталаза.</li><li><b>Cu</b> — цитохромоксидаза, супероксиддисмутаза; Fe-мен синергист.</li><li><b>Zn</b> — карбоангидраза, инсулин; <b>Co</b> — B<sub>12</sub> витамині; <b>Mn</b> — аргиназа, пируваткарбоксилаза; <b>Mo</b> — ксантиноксидаза.</li></ul>
<p class="note">d-металдар (Fe, Cu, Zn, Co, Mn, Mo) ақуыздармен комплекс түзіп, металлоферменттердің белсенді орталығы болады.</p>`},
{n:7,short:'Эндемиялық аурулар',h:'Эндемиялық аурулар: себептері, белгілері және алдын алу',body:`
<p><b>Эндемиялық аурулар</b> — белгілі бір географиялық аймақтың топырағында, суында бір элементтің қалыптан тыс аз немесе көп болуынан туындайтын аурулар.</p>
${T(['Ауру','Себебі','Белгілері','Алдын алу'],[
['Эндемиялық зоб, кретинизм','суда, тағамда йод тапшылығы','қалқанша бездің ұлғаюы; балада бой мен ақыл-ой дамуының тежелуі; микседема','йодталған тұз, KI, теңіз өнімдері'],
['Флюороз','суда фтордың артық болуы','тіс эмальінде дақтар, сүйек деформациясы','суды фторсыздандыру'],
['Кариес','фтор тапшылығы','тіс эмалінің бұзылуы','фторлы тіс пастасы, суды фторлау'],
['Молибденді подагра','топырақта Mo артық','несеп қышқылы тұздарының буындарда жиналуы','тамақтану режимі'],
['Темір тапшылықты анемия','Fe тапшылығы','әлсіздік, бозарғандық','темір препараттары']])}`},
{n:8,short:'Экологиялық факторлар',h:'Адам денсаулығына экологиялық факторлардың әсері',body:`
<ul><li><b>Ауыр металдар</b> (Hg<sup>2+</sup>, Pb<sup>2+</sup>, Cd<sup>2+</sup>, As<sup>3+</sup>) ферменттердің –SH топтарымен байланысып, оларды тежейді; бүйрек, бауыр, нерв жүйесі зақымданады.</li>
<li><b>Радиоактивті изотоптар</b>: <sup>90</sup>Sr Ca-ның орнына сүйекте жиналып, лейкемия мен сүйек ісігін тудырады.</li>
<li><b>Cr(VI) қосылыстары</b> — жалпы интоксикация, бауыр мен бүйрек зақымдануы, қатерлі ісік.</li>
<li><b>Ni</b> (кәсіби улану) — ринит, улы пневмония, өкпе обыры.</li>
<li><b>Нитраттар</b>, ауа мен судың ластануы — метгемоглобинемия, тыныс алу аурулары.</li>
<li>Аэрозольдер: көмір шаңы — антракоз, SiO<sub>2</sub> — силикоз, асбест — асбестоз.</li></ul>
<p class="note">Улануда антидоттар қолданылады: унитиол, ЭДТА (комплексондар) ауыр металдарды берік комплекске байланыстырып, ағзадан шығарады.</p>`}

/* ===== 2. Химиялық термодинамика (оқулық, 1-тақырып, 10–19 б.) ===== */
MODS.t02={...EMPTY(),intro:'Конспект тақырыптың 15 негізгі сұрағына жауап ретінде құрылған (оқулық: 1-тақырып, 10–19 беттер).',notes:[
{n:1,short:'Жүйе және жіктелуі',h:'Термодинамикалық жүйе. Фазалар санына және қоршаған ортамен байланысына қарай жіктелуі',body:`
<p><b>Химиялық термодинамика</b> — химиялық энергияның басқа түрлерге (жылу, электр, механикалық) айналу заңдылықтарын зерттейді. <b>Термодинамикалық жүйе</b> — қоршаған ортадан шын немесе шартты түрде бөлінген денелер жиынтығы.</p>
${T(['Жүйе','Энергия алмасу','Масса алмасу','Мысал'],[
['Оқшауланған','жоқ','жоқ','термостағы мұз, бүкіл Әлем'],
['Жабық','бар','жоқ','ампуладағы дәрі, суыған тас, Жер шары'],
['Ашық','бар','бар','жасуша, адам, өсімдік, беті ашық ыдыстағы ерітінді']])}
<p><b>Фаза</b> — бөліну бетімен шектелген, барлық нүктесінде құрамы мен қасиеті бірдей бөлік.</p>
<ul><li><b>Гомогенді жүйе</b> — бір фазалы: газдар қоспасы, NaCl ерітіндісі.</li><li><b>Гетерогенді жүйе</b> — екі не одан көп фазалы: мұз–су, тұнбасы бар қаныққан ерітінді.</li></ul>`},
{n:2,short:'Жүйе күйлері',h:'Тепе-теңдік, стационарлы және ауыспалы күйлер',body:`
<ul><li><b>Тепе-теңдік күй</b> — жүйе қасиеттері уақыт бойынша кез келген нүктеде тұрақты, энергия мен зат алмасу жоқ.</li>
<li><b>Стационарлы күй</b> — қоршаған ортамен <b>үздіксіз</b> зат пен энергия алмасу арқасында қасиеттер уақыт бойынша тұрақты (тірі ағза).</li>
<li><b>Ауыспалы күй</b> — жүйе қасиеттері уақыт өте өзгереді.</li></ul>`},
{n:3,short:'Параметрлер, күй функциялары',h:'Негізгі, интенсивті және экстенсивті параметрлер. Күй функциялары',body:`
<p><b>Термодинамикалық параметрлер</b> — жүйе күйін сипаттайтын шамалар: m, n, T, p, V, C, ρ, U, H, S, G т.б.</p>
${T(['Түрі','Анықтамасы','Мысалдар'],[
['Негізгі','тікелей өлшенеді','m, V, T, C, p'],
['Экстенсивті','жүйе өлшеміне (зат мөлшеріне) тәуелді, қосылады','m, V, n, H, G'],
['Интенсивті','жүйе өлшеміне тәуелсіз','T, C, ρ, p']])}
<p><b>Күй функциялары</b> (U, H, S, G) — тікелей өлшенбейді, басқа параметрлер арқылы есептеледі. Олардың өзгерісі тек бастапқы және соңғы күйге тәуелді, жүру жолына тәуелсіз: ΔX = X<sub>2</sub> − X<sub>1</sub>.</p>`},
{n:4,short:'Процесс түрлері',h:'Термодинамикалық процесс. Жіктелуі',body:`
<p><b>Термодинамикалық процесс</b> — жүйенің бір күйден екіншісіне өтуі кезіндегі кем дегенде бір параметрдің өзгерісі.</p>
${T(['Процесс','Тұрақты шама'],[['Изотермиялық','T = const'],['Изобаралық','p = const'],['Изохоралық','V = const'],['Изобаралық-изотермиялық','p, T = const (тірі ағзадағы процестер)'],['Изохоралық-изотермиялық','V, T = const']])}
<p>Сондай-ақ процестер <b>қайтымды</b> (жүйе әр сәтте тепе-теңдікте) және <b>қайтымсыз</b>, <b>өздігінен жүретін</b> және өздігінен жүрмейтін болып бөлінеді.</p>`},
{n:5,short:'Бірінші бастама',h:'Термодинамиканың бірінші бастамасы. Изобаралық және изохоралық процестердегі жылу',body:`
<ul><li>Энергия жоқтан пайда болмайды және жоғалмайды, тек эквивалентті мөлшерде бір түрден екіншісіне ауысады.</li><li>Оқшауланған жүйеде ішкі энергия тұрақты: ΔU = 0.</li><li>Жүйеге берілген жылу ішкі энергияны арттыруға және жұмыс істеуге жұмсалады.</li></ul>
<span class="fx">Q = ΔU + A ; Q<sub>V</sub> = ΔU (изохоралық) ; Q<sub>p</sub> = ΔH (изобаралық)</span>
<ul><li><b>Ішкі энергия U</b> — жүйе бөлшектерінің барлық қозғалыс және әрекеттесу энергиясының қосындысы (бүкіл жүйенің кинетикалық және кеңістіктегі орнының потенциалдық энергиясы кірмейді).</li><li><b>Жұмыс A</b> — бөлшектердің бағытталған қозғалысының энергиясы; <b>жылу Q</b> — ретсіз қозғалысының энергиясы.</li><li><b>Энтальпия H</b> — изобаралы-изотермиялық жағдайдағы жүйе энергиясы: <b>H = U + pV</b>.</li></ul>`},
{n:6,short:'Термохимия, энтальпия',h:'Термохимия. Химиялық реакцияның энтальпиясы. Термохимиялық теңдеулер',body:`
<p><b>Термохимия</b> — химиялық реакциялардың жылу эффектілерін зерттейді. Жылу эффектісі <b>калориметрмен</b> өлшенеді.</p>
<p><b>Реакция энтальпиясы ΔH<sub>r</sub></b> — изобаралы-изотермиялық жағдайда реакцияда бөлінетін немесе сіңірілетін жылу.</p>
${T(['Процесс','Белгілері'],[['Экзотермиялық (жылу бөледі)','ΔH &lt; 0, Q &gt; 0'],['Эндотермиялық (жылу сіңіреді)','ΔH &gt; 0, Q &lt; 0']])}
<p><b>Термохимиялық теңдеу</b> — жылу эффектісі көрсетілген теңдеу:</p>
<span class="fx">H<sub>2</sub>(г) + ½O<sub>2</sub>(г) = H<sub>2</sub>O(с); ΔH<sub>r</sub> = −285,8 кДж</span>
<p class="note">Термохимиялық теңдеуде заттардың агрегаттық күйі міндетті түрде көрсетіледі, бөлшек коэффициенттер рұқсат етіледі.</p>`},
{n:7,short:'Түзілу, жану, еру жылуы',h:'Стандартты түзілу және ыдырау жылуы. Жану, еру және бейтараптау жылуы',body:`
<ul><li><b>Стандартты түзілу энтальпиясы ΔH°<sub>f</sub></b> — стандартты жағдайда жай заттардан 1 моль күрделі зат түзілгендегі жылу. Жай заттар үшін ΔH°<sub>f</sub> = 0.</li>
<li><b>Ыдырау энтальпиясы ΔH°<sub>d</sub></b> — 1 моль күрделі зат жай заттарға ыдырағандағы жылу.</li>
<li><b>Стандартты жағдай:</b> n = 1 моль, p = 101 325 Па, T = 298,15 К.</li>
<li><b>Жану энтальпиясы ΔH<sub>c</sub></b> — 1 моль зат оттекте жоғары оксидтерге дейін тотыққандағы жылу.</li>
<li><b>Еру жылуы</b> — 1 моль зат ерігендегі жылу: ΔH<sub>еру</sub> = ΔH<sub>1</sub> + ΔH<sub>2</sub> (ΔH<sub>1</sub> — кристалл торын бұзу, ΔH<sub>2</sub> &lt; 0 — сольватация).</li>
<li><b>Бейтараптау жылуы</b> — күшті қышқыл мен күшті негізден 1 моль су түзілгендегі жылу; табиғатына тәуелсіз: H<sup>+</sup> + OH<sup>−</sup> = H<sub>2</sub>O + 56,98 кДж (13,7 ккал).</li></ul>`},
{n:8,short:'Лавуазье–Лаплас заңы',h:'Лавуазье–Лаплас заңы',body:`
<p>Заттың түзілу жылуы оның теріс таңбамен алынған ыдырау жылуына тең.</p>
<span class="fx">ΔH<sub>d</sub> = −ΔH<sub>f</sub> ; ΔH<sub>d</sub> + ΔH<sub>f</sub> = 0</span>
<p>Мысал: H<sub>2</sub> + ½O<sub>2</sub> = H<sub>2</sub>O(г), ΔH<sub>f</sub> = −241,6 кДж; H<sub>2</sub>O(г) = H<sub>2</sub> + ½O<sub>2</sub>, ΔH<sub>d</sub> = +241,6 кДж.</p>`},
{n:9,short:'Гесс заңы',h:'Гесс заңы және одан туындайтын салдарлар',body:`
<p><b>Гесс заңы:</b> тұрақты қысымда не көлемде реакцияның жылу эффектісі оның жүру жолына және саты санына тәуелсіз, тек бастапқы заттар мен өнімдердің түрі мен күйіне тәуелді.</p>
<span class="fx">ΔH<sub>r</sub> = ΔH<sub>1</sub> + ΔH<sub>2</sub> = ΔH<sub>3</sub> + ΔH<sub>4</sub> + ΔH<sub>5</sub></span>
<p><b>1-салдар</b> (түзілу жылулары арқылы):</p>
<span class="fx">ΔH<sub>r</sub> = Σn<sub>i</sub>ΔH<sub>f</sub>(өнім) − Σn<sub>i</sub>ΔH<sub>f</sub>(бастапқы зат)</span>
<p><b>2-салдар</b> (жану жылулары арқылы):</p>
<span class="fx">ΔH<sub>r</sub> = Σn<sub>i</sub>ΔH<sub>c</sub>(бастапқы зат) − Σn<sub>i</sub>ΔH<sub>c</sub>(өнім)</span>
<p class="note">Маңызы: кестедегі мәндерден кез келген реакцияның, соның ішінде in vitro жүргізуге болмайтын биохимиялық реакцияның энтальпиясын есептеуге болады.</p>`},
{n:10,short:'Биохимиялық процестер энергетикасы',h:'Термохимиялық теңдеулердің химиялық және биохимиялық процестердің энергетикалық сипаттамасы ретінде қолданылуы',body:`
<p>Гесс заңы бойынша глюкозаның ағзада тотығуы (10 ферменттің қатысуымен, 12 саты) мен калориметрде жануының жылуы бірдей, себебі бастапқы заттар мен өнімдер бірдей:</p>
<span class="fx">C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6O<sub>2</sub> = 6CO<sub>2</sub> + 6H<sub>2</sub>O ; ΔH = −1273 кДж/моль <small>(оқулықтағы мән)</small></span>
<p class="note">Ескерту: анықтамалық деректер бойынша глюкозаның толық тотығу энтальпиясы ≈ −2800 кДж/моль; оқулықтағы −1273 кДж/моль — глюкозаның түзілу энтальпиясына жақын шама. Тестте оқулық мәні сұралуы мүмкін.</p>
<ul><li>Көмірсулар глюкозаға айналады; адам энергияның шамамен 60%-ын глюкозаның тотығуынан алады.</li><li>Реакция энтальпиясын табу үшін оның механизмін білу қажет емес.</li></ul>`},
{n:11,short:'Тағамның энергетикалық құндылығы',h:'Тағамдардың энергетикалық құндылығын есептеу принциптері',body:`
<p><b>Калориялық құндылық</b> — 1 г тағам толық тотыққанда бөлінетін энергия. Ағзада да, калориметрде де C → CO<sub>2</sub>, H → H<sub>2</sub>O, N → N<sub>2</sub> түзілетіндіктен, есептеуге жану энтальпиясы алынады (Гесс заңы). 1 кал = 4,18 Дж.</p>
${T(['Қоректік зат','Энергия','Тәуліктік қажеттілік'],[['Майлар','9,0–9,5 ккал/г (37,7–39,8 кДж/г)','60–70 г'],['Ақуыздар','4,0–4,1 ккал/г (16,5–17,2 кДж/г)','80–100 г'],['Көмірсулар','4,0–4,1 ккал/г (16,5–17,2 кДж/г)','300–500 г']])}
${T(['Жұмыс түрі','Тәуліктік энергия'],[['Қимылы аз','2000–2800 ккал'],['Жеңіл дене еңбегі (студенттер, дәрігерлер)','3000–3600 ккал'],['Ауыр жұмыс','4000–5000 ккал'],['Өте ауыр жұмыс (спортсмендер)','7000 ккал-ға дейін']])}
<p class="note">Мысал: 10 г май + 20 г ақуыз + 50 г көмірсу ≈ 10·9 + 20·4 + 50·4 = 370 ккал.</p>`},
{n:12,short:'Екінші бастама, энтропия',h:'Термодинамиканың екінші бастамасы. Энтропия',body:`
<ul><li><b>Өздігінен жүретін процесс</b> — сыртқы әсерсіз жүретін процесс.</li><li><b>Энтропия S</b> — жүйе ретсіздігінің сандық өлшемі (күй функциясы).</li></ul>
<span class="fx">S = k·lnW <small>Больцман теңдеуі; W — термодинамикалық ықтималдық (микрокүйлер саны)</small></span>
<p>Абсолют нөлде мінсіз кристалдың энтропиясы S<sub>0</sub> = 0. Энтропия артады: температура көтерілгенде және кристалл → сұйық → газ өткенде.</p>
<h3>Екінші бастаманың тұжырымдары</h3>
<ul><li>Жылу өздігінен суық денеден ыстыққа өтпейді.</li><li>Жүйе өздігінен ықтималдығы аз күйден ықтималдығы көп күйге өтеді.</li><li>Оқшауланған жүйеде өздігінен жүретін қайтымсыз процесте энтропия артады: ΔS &gt; 0.</li></ul>
<span class="fx">ΔS ≥ Q / T</span>`},
{n:13,short:'Гиббс энергиясы',h:'Гиббстің бос энергиясы — процестің өздігінен жүру критерийі. Энтальпиялық және энтропиялық факторлар',body:`
<p><b>Гиббс энергиясы (изобаралы-изотермиялық потенциал) G</b> — жүйенің атқара алатын максималды пайдалы жұмысына абсолют шамасы тең, таңбасы қарама-қарсы күй функциясы.</p>
<span class="fx">ΔG = ΔH − TΔS ; ΔG = −A<sub>max</sub></span>
<p>ΔH — <b>энтальпиялық фактор</b> (жүйенің энергиясын азайтуға ұмтылуы), TΔS — <b>энтропиялық фактор</b> (ретсіздікке ұмтылуы).</p>
${T(['ΔG','Қорытынды'],[['ΔG &lt; 0','процесс өздігінен жүреді (тиімді: ΔH &lt; 0, ΔS &gt; 0)'],['ΔG &gt; 0','өздігінен жүрмейді (ΔH &gt; 0, ΔS &lt; 0)'],['ΔG = 0','жүйе тепе-теңдікте']])}
<p><b>Экзергоникалық</b> процестер ΔG &lt; 0 — энергия бөліп, өздігінен жүреді (тағамдағы биополимерлердің ыдырауы). <b>Эндергоникалық</b> процестер ΔG &gt; 0 — энергия сіңіреді, өздігінен жүрмейді (АТФ, фосфокреатин синтезі).</p>
<p class="note">Назар аударыңыз: оқулықта (18–19 б.) экзергоникалық пен эндергоникалық атаулары орындарымен ауысып берілген. Жалпы қабылданған анықтама — жоғарыдағы.</p>`},
{n:14,short:'Тірі ағза — ашық жүйе',h:'Тірі ағза — термодинамикалық жүйе ретінде. Стационарлық күйдің сипаттамасы',body:`
<p><b>Биоэнергетика</b> — тірі ағзадағы энергия айналымын зерттейді. Тірі ағза:</p>
<ul><li>ортамен зат пен энергия алмасатын <b>ашық</b> жүйе;</li><li>көп фазалы <b>гетерогенді</b> жүйе;</li><li><b>стационарлы</b> күйде болады;</li><li>процестер изобаралы-изотермиялық (p, T = const) жағдайда жүреді.</li></ul>
${T(['Стационарлық күй (тірі ағза)','Тепе-теңдік күй (өлім)'],[
['ортамен үздіксіз зат және энергия алмасу','алмасу жоқ'],
['тұрақты градиенттер (концентрация, потенциал) бар','градиенттер жоқ'],
['энтропия тұрақты','энтропия максималды'],
['Гиббс энергиясы үнемі жұмсалады','Гиббс энергиясын жұмсау қажет емес'],
['жұмыс істеу қабілеті тұрақты, нөлге тең емес','жұмыс істей алмайды'],
['бір бағыттағы процестер жылдамырақ','тура және кері процестер жылдамдығы тең']])}
<p><b>Метаболизм</b> — ағзаға түскен қоректік заттарды сіңіріп, қажетіне жарату процесі.</p>`},
{n:15,short:'Пригожин принципі',h:'Пригожин принципі',body:`
<p>Стационарлық күйдегі ашық жүйеде қайтымсыз процестер кезінде энтропияның түзілу жылдамдығы берілген жағдайда ең аз оң мәнге ұмтылады.</p>
<span class="fx">ΔS<sub>i</sub> / Δτ → min (&gt; 0)</span>
<ul><li>адам ағзасына бірінші жуықтау ретінде қолданылады;</li><li>кинетикалық параметрлердің тұрақтылығын болжайды;</li><li>ағзаның алғашқы даму сатысында (өсу кезеңінде) орындалмайды.</li></ul>`}
]};

{n:1,short:'Реакция жылдамдығы',h:'Химиялық реакцияның жылдамдығы. Орташа және шынайы жылдамдық',body:`
<p><b>Химиялық кинетика</b> реакциялардың жылдамдығын, механизмін және жылдамдықтың факторларға тәуелділігін зерттейді. <b>Фармакокинетика</b> — дәрінің ағзаға енуін, таралуын, метаболизмін және шығарылуын зерттейді.</p>
<p><b>Реакция жылдамдығы</b> — бірлік уақыттағы әрекеттесуші зат не өнім концентрациясының өзгерісі (гомогенді реакцияда бірлік көлемде, гетерогендіде бірлік бетте).</p>
<span class="fx">w<sub>орт</sub> = ±${F('C<sub>2</sub> − C<sub>1</sub>','t<sub>2</sub> − t<sub>1</sub>')} = ±${F('ΔC','Δt')} ; w<sub>шын</sub> = ±${F('dC','dt')}</span>
<p>Өлшем бірлігі: моль·л<sup>−1</sup>·с<sup>−1</sup>. Ағзада процестер әр жылдамдықта жүреді: жүйке импульсі — бір сәтте, ас қорыту — сағаттар, қартаю — жылдар.</p>
<p><b>Жартылай ыдырау уақыты t<sub>½</sub></b> — заттың жартысы әрекеттесетін уақыт; бірінші ретті реакция үшін <b>t<sub>½</sub> = 0,69 / k</b>. Дәрігерге дәрінің мөлшері мен қабылдау жиілігін анықтауға көмектеседі.</p>`},
{n:2,short:'Массалар әрекеттесу заңы',h:'Массалар әрекеттесуші заңы',body:`
<p>Тұрақты температурада реакция жылдамдығы әрекеттесуші заттар концентрацияларының стехиометриялық коэффициенттер дәрежесіндегі көбейтіндісіне тура пропорционал.</p>
<span class="fx">aA + bB + cC → … : w = k · C<sub>A</sub><sup>a</sup> · C<sub>B</sub><sup>b</sup> · C<sub>C</sub><sup>c</sup></span>
<p><b>k</b> — жылдамдық константасы: барлық концентрация 1 моль/л болғандағы жылдамдық (меншікті жылдамдық). Ол заттың табиғаты мен температураға тәуелді, концентрацияға тәуелсіз.</p>
<p class="note">Гетерогенді реакцияда қатты заттың концентрациясы теңдеуге жазылмайды.</p>`},
{n:3,short:'Реакция реті',h:'Реакцияның реті. Түрлі ретті реакциялардың кинетикалық теңдеулері. Ретті анықтау',body:`
<p><b>Реакция реті</b> — кинетикалық теңдеудегі концентрацияның дәреже көрсеткіші; жалпы реті n = a + b + c. Формалды шама, тәжірибеде анықталады, кез келген мән (бүтін, бөлшек, нөл) қабылдай алады.</p>
${T(['Реті','Кинетикалық теңдеу','k бірлігі'],[
['0','w = k<sub>0</sub>; C = C<sub>0</sub> − k<sub>0</sub>t','моль·л<sup>−1</sup>·с<sup>−1</sup>'],
['1','w = k<sub>1</sub>C; ln(C<sub>0</sub>/C) = k<sub>1</sub>t; t<sub>½</sub> = 0,69/k','с<sup>−1</sup>'],
['2','w = k<sub>2</sub>C<sup>2</sup>; 1/C − 1/C<sub>0</sub> = k<sub>2</sub>t','л·моль<sup>−1</sup>·с<sup>−1</sup>'],
['3','w = k<sub>3</sub>C<sup>3</sup>','л<sup>2</sup>·моль<sup>−2</sup>·с<sup>−1</sup>']])}
<p><b>Ретті анықтау тәсілдері:</b> кинетикалық теңдеуді таңдау (қою) тәсілі, графиктік тәсіл, жартылай ыдырау уақыты бойынша.</p>`},
{n:4,short:'Молекулалығы',h:'Реакцияның молекулалығы',body:`
<p><b>Молекулалық (m)</b> — бір қарапайым (элементар) актіге қатысатын молекулалар саны. Физикалық мағынасы бар, тек 1, 2, 3 мәндерін қабылдайды.</p>
${T(['Түрі','Схема','Мысал'],[['Мономолекулалы','A → B (+C)','I<sub>2</sub> → 2I; Ca(HCO<sub>3</sub>)<sub>2</sub> → CaCO<sub>3</sub> + H<sub>2</sub>O + CO<sub>2</sub>'],['Бимолекулалы','A + B → C','H<sub>2</sub> + I<sub>2</sub> → 2HI; CO + Cl<sub>2</sub> → COCl<sub>2</sub>'],['Үшмолекулалы','3A → B','H + H + M → H<sub>2</sub> + M']])}
<p class="note">Айырмашылық: реттілік — формалды, тәжірибелік шама; молекулалық — механизмнің нақты сипаттамасы.</p>`},
{n:5,short:'Жылдамдыққа әсер ететін факторлар',h:'Реакция жылдамдығына әсер ететін факторлар',body:`
<ol><li><b>Заттардың табиғаты</b> — химиялық құрамы, бөлшек түрі (атом, ион, радикал), агрегаттық күйі.</li>
<li><b>Концентрация</b> — массалар әрекеттесу заңымен сипатталады.</li>
<li><b>Температура</b> — Вант-Гофф ережесі және Аррениус теңдеуі.</li>
<li><b>Катализатор</b> — реакцияға қатысып, жылдамдықты өзгертетін, бірақ соңында өзгермейтін зат.</li></ol>
<h3>Катализдің заңдылықтары</h3>
<ul><li>катализатор регенерацияланады, стехиометрияға әсер етпейді;</li><li>таңдамалы әсер етеді;</li><li><b>активтендіру энергиясын төмендетеді</b>;</li><li>тепе-теңдікті ығыстырмайды — тура және кері реакцияны бірдей жылдамдатады.</li></ul>
<p><b>Гомогенді катализ</b> — катализатор мен заттар бір фазада; <b>гетерогенді</b> — әр фазада. <b>Ингибиторлар</b> баяулатады, <b>промоторлар</b> катализатор белсенділігін арттырады, <b>каталитикалық улар</b> төмендетеді.</p>`},
{n:6,short:'Вант-Гофф ережесі',h:'Реакция жылдамдығының температураға тәуелділігі. Вант-Гофф ережесі',body:`
<p><b>Вант-Гофф ережесі:</b> температураны әр 10° көтергенде реакция жылдамдығы 2–4 есе артады.</p>
<span class="fx">${F('w<sub>T₂</sub>','w<sub>T₁</sub>')} = γ<sup>(T₂ − T₁)/10</sup> ; ${F('τ<sub>T₁</sub>','τ<sub>T₂</sub>')} = γ<sup>(T₂ − T₁)/10</sup></span>
<p>γ — температуралық коэффициент (2–4; ферментативтік реакцияларда 6–8).</p>
<p><b>Активтендіру энергиясы E<sub>a</sub></b> — молекуланы реакцияға қабілетті активті күйге келтіруге қажет ең аз қосымша энергия.</p>
<span class="fx">k = A·e<sup>−Ea/RT</sup> <small>Аррениус теңдеуі</small></span>
<span class="fx">E<sub>a</sub> = ${F('R·T<sub>1</sub>·T<sub>2</sub>','T<sub>2</sub> − T<sub>1</sub>')} · ln${F('k<sub>2</sub>','k<sub>1</sub>')}</span>
<p class="note">Медицинада: дәрінің жарамдылық мерзімі «жеделдетілген қартайту» әдісімен анықталады — препаратты жоғары температурада ұстап, нәтижені Вант-Гофф ережесі бойынша 298 К-ге қайта есептейді.</p>`},
{n:7,short:'Кинетикалық жіктелім',h:'Реакциялардың кинетикалық жіктелімі',body:`

['Тізбекті','радикалдар арқылы қайталанатын сатылар: басталу, өсу, үзілу','H<sub>2</sub> + Cl<sub>2</sub> (hν)']])}`},
{n:8,short:'Ферментативті катализ',h:'Ферментативті катализ. Ерекшеліктері. Михаэлис–Ментен теңдеуі',body:`
<p><b>Ферменттер (энзимдер)</b> — ақуыз табиғатты биологиялық катализаторлар. <b>Субстрат</b> — фермент әсер ететін зат.</p>
<h3>Ерекшеліктері</h3>
<ul><li>өте жоғары белсенділік: карбоангидраза минутына 36 млн, каталаза 12 млн субстрат молекуласын өңдейді;</li><li>жоғары таңдамалылық (субстратқа және реакцияға);</li><li>температура мен pH-қа сезімталдық; адамда температуралық оптимум 310–313 К, γ = 6–8.</li></ul>
<span class="fx">E + S ⇄ ES → P + E</span>
<span class="fx">w = w<sub>max</sub> · ${F('[S]','K<sub>m</sub> + [S]')} ; K<sub>m</sub> = ${F('k<sub>−1</sub> + k<sub>2</sub>','k<sub>1</sub>')}</span>
<p>K<sub>m</sub> — Михаэлис константасы; w = ½w<sub>max</sub> болғанда [S] = K<sub>m</sub>.</p>
<ul><li><b>Активаторлар:</b> Mg<sup>2+</sup>, Mn<sup>2+</sup>, Zn<sup>2+</sup>, Co<sup>2+</sup>, K<sup>+</sup>, Cl<sup>−</sup>.</li><li><b>Ингибиторлар:</b> ауыр металдар (Hg<sup>2+</sup>, Pb<sup>2+</sup>, Cd<sup>2+</sup>), As<sup>3+</sup>. Қайтымды ингибицияны антидот немесе субстрат артықшылығымен жоюға болады; қайтымсызда ингибитор белсенді орталықты бұғаттайды.</li></ul>`},
{n:9,short:'Химиялық тепе-теңдік',h:'Химиялық тепе-теңдік. Тепе-теңдік константасы',body:`
<p><b>Химиялық тепе-теңдік</b> — тура реакция жылдамдығы кері реакция жылдамдығына тең болатын қайтымды процесс күйі. Бұл кездегі концентрациялар — тепе-теңдік концентрациялары.</p>
<span class="fx">nA + mB ⇄ pC + qD : K = ${F('[C]<sup>p</sup>·[D]<sup>q</sup>','[A]<sup>n</sup>·[B]<sup>m</sup>')}</span>
<p>K &gt; 1 — тепе-теңдік өнімдер жағына ығысқан; K &lt; 1 — бастапқы заттар жағына. K температураға тәуелді, концентрация мен катализаторға тәуелсіз.</p>`},
{n:10,short:'Ле-Шателье принципі',h:'Ле-Шателье принципі. Концентрация, температура, қысымның әсері',body:`
<p><b>Ле-Шателье принципі:</b> тепе-теңдіктегі жүйеге сырттан әсер етсе, тепе-теңдік сол әсерді әлсірететін жаққа ығысады.</p>
${T(['Әсер','Тепе-теңдік қайда ығысады'],[
['Бастапқы зат концентрациясын арттыру','тура бағытқа (өнімдер жағына)'],
['Өнім концентрациясын арттыру','кері бағытқа'],
['Қысымды арттыру (газдар)','газ молі аз жаққа (көлем кішірейетін)'],
['Қысымды төмендету','газ молі көп жаққа'],
['Газ мольдері тең','қысым әсер етпейді'],
['Температураны арттыру','эндотермиялық (ΔH &gt; 0) жаққа'],
['Температураны төмендету','экзотермиялық (ΔH &lt; 0) жаққа'],
['Катализатор','ығыстырмайды, тек тепе-теңдіктің орнауын тездетеді']])}
<p><b>Адаптивті қайта құру принципі</b> — тірі жүйе сыртқы әсерді әлсірету бағытында қайта құрылады (Ле-Шателье принципінің тірі табиғаттағы баламасы, гомеостазды сақтайды).</p>`}
