/* ===== 4. Ерітінділер (оқулық, 3-тақырып, 43–53 б.) ===== */
MODS.t04={...EMPTY(),intro:'Конспект тақырыптың 13 негізгі сұрағына жауап ретінде құрылған (оқулық: 3-тақырып, 43–53 беттер).',notes:[
{n:1,short:'Ерітінді, еріткіш',h:'Ерітінді. Еріткіш. Еріген зат',body:`
<p><b>Ерітінді</b> — екі не одан көп компоненттен тұратын, құрамы ауыспалы, термодинамикалық тұрақты гомогенді жүйе. Компоненттері: еріткіш және еріген зат.</p>
<ul><li><b>Еріткіш</b> — ерітінді түзілгенде агрегаттық күйін өзгертпейтін компонент; күйлері бірдей болса — мөлшері көбі.</li><li><b>Еріген зат</b> ерітіндіде молекула не ион түрінде (бөлшек өлшемі 10<sup>−10</sup>–10<sup>−9</sup> м).</li></ul>`},
{n:2,short:'Су — еріткіш',h:'Су еріткіш ретінде. Сулы ерітінділердің тіршіліктегі маңызы',body:`
<ul><li>Адам ағзасының 60%-ы су; оның 42%-ы жасуша ішінде, қалғаны жасушадан тыс.</li><li>Тәуліктік қажеттілік: ересекке 35 г/кг, сәбиге 100–130 г/кг. 20% су жоғалтса — өлім.</li><li>Су қоректік заттарды тасиды, зат алмасуға қатысады, осмос, ісіну, онкотикалық қысымды қамтамасыз етеді.</li></ul>
<h3>Судың еріткіш ретіндегі қасиеттері</h3>
<ul><li>жылусыйымдылығы, жылуөткізгіштігі, булану жылуы жоғары — дене температурасын тұрақтандырады;</li><li>диэлектрлік өтімділігі жоғары (ε ≈ 81) — электролиттер диссоциацияланады;</li><li>амфолит (протон доноры әрі акцепторы) — гидролиз, гидратация, қышқылдық-негіздік гомеостазға қатысады;</li><li>электрон доноры әрі акцепторы — тотығу-тотықсыздану процестеріне қатысады.</li></ul>`},
{n:3,short:'Жіктелуі',h:'Ерітінділердің жіктелуі',body:`
<h3>Еріген зат мөлшері бойынша</h3>
<ul><li><b>Қанықпаған</b> — затты әлі ерітуге қабілетті.</li><li><b>Қаныққан</b> — тұнбамен динамикалық тепе-теңдікте: еру жылдамдығы = кристалдану жылдамдығы.</li><li><b>Аса қаныққан</b> — концентрациясы қаныққаннан жоғары, термодинамикалық тұрақсыз.</li></ul>
<h3>Диссоциациялануы бойынша</h3>
<ul><li><b>Бейэлектролит ерітінділері</b> — ток өткізбейді, зат молекула түрінде: глюкоза, сахароза, H<sub>2</sub>O<sub>2</sub>.</li><li><b>Электролит ерітінділері</b> — ток өткізеді, зат иондарға ыдырайды: NaCl, MgSO<sub>4</sub>, NaHCO<sub>3</sub>, KMnO<sub>4</sub>.</li></ul>`},
{n:4,short:'Еру термодинамикасы',h:'Еру процесінің термодинамикасы',body:`
<p>Еру өздігінен жүреді, егер <b>ΔG = ΔH − TΔS &lt; 0</b>; ерітінді қаныққанда ΔG = 0.</p>
<ul><li>кристалл торының бұзылуы — ΔH &gt; 0;</li><li>заттың көлем бойынша таралуы — ΔH &gt; 0, ΔS &gt; 0;</li><li>гидратация (сольватация) — көбіне ΔH &lt; 0.</li></ul>
<p>Сондықтан еру жылуы оң да, теріс те болуы мүмкін (H<sub>2</sub>SO<sub>4</sub> ерігенде жылу бөлінеді, NH<sub>4</sub>NO<sub>3</sub> ерігенде сіңіріледі).</p>
<p><b>Газдар еруінде</b> ретсіздік азаяды (ΔS &lt; 0), сондықтан температура төмендегенде газ ерігіштігі артады.</p>
<p><b>Идеал ерітінді</b> — түзілгенде көлем мен жылу өзгермейді: ΔV = 0, ΔH = 0.</p>`},
{n:5,short:'Генри, Дальтон, Сеченов',h:'Газдардың сұйықтықта еруі. Генри, Сеченов және Дальтон заңдары',body:`
<p>Газ ерігіштігі газдың және еріткіштің табиғатына, температура мен қысымға тәуелді. Жақсы еритін: HCl, NH<sub>3</sub>, CO<sub>2</sub>; нашар: N<sub>2</sub>, O<sub>2</sub>.</p>
<p><b>Генри заңы:</b> тұрақты температурада газ ерігіштігі оның сұйықтық үстіндегі қысымына тура пропорционал.</p>
<span class="fx">C = K<sub>Г</sub> · p</span>
<p><b>Дальтон заңы:</b> газ қоспасындағы әр компонент өзінің парциалды қысымына пропорционал ериді.</p>
<p><b>Сеченов заңы:</b> суға электролит қосқанда газ ерігіштігі төмендейді (газдардың «тұздануы»).</p>
<span class="fx">S = S<sub>0</sub>·e<sup>−kC</sup> ; ln(S<sub>0</sub>/S) = kC<sub>э</sub></span>
<p class="note">Генри мен Дальтон заңдарына сумен әрекеттесетін, жақсы еритін газдар (CO<sub>2</sub>, SO<sub>2</sub>, NH<sub>3</sub>) бағынбайды. Медицинада: кессон ауруы (қысым кенет төмендегенде қандағы N<sub>2</sub> көпіршіктер түзеді).</p>`},
{n:6,short:'Концентрация түрлері',h:'Ерітінділер құрамын өрнектеу тәсілдері',body:`
${T(['Шама','Формула','Бірлігі'],[
['Массалық үлес ω',`ω = ${F('m(x)','m(ер-ді)')}·100% = ${F('m(x)','V·ρ')}·100%`,'%, бірлік үлес'],
['Мольдік үлес χ',`χ = ${F('n','n + N')}`,'бірлік үлес, %'],
['Молярлық концентрация C (М)',`C = ${F('n','V')} = ${F('m','M·V')}`,'моль/л'],
['Эквиваленттің молярлық концентрациясы Cэ (н)',`C<sub>э</sub> = ${F('m','f<sub>э</sub>·M·V')}`,'моль/л'],
['Моляльдық концентрация b',`b = ${F('n','m(еріткіш)')}`,'моль/кг'],
['Титр T',`T = ${F('m(x)','V')}`,'г/мл']])}
<p><b>Эквиваленттік фактор</b> f<sub>э</sub> = 1/z: қышқылда z — негіздігі, негізде — қышқылдығы, тұзда — металл атомы саны × валенттілігі, тотығу-тотықсыздануда — берілген не қабылданған электрон саны. M<sub>э</sub> = f<sub>э</sub>·M.</p>
<p class="note">Мысал: H<sub>2</sub>SO<sub>4</sub> үшін f<sub>э</sub> = ½, M<sub>э</sub> = 98/2 = 49 г/моль; 1 М H<sub>2</sub>SO<sub>4</sub> = 2 н.</p>`},
{n:7,short:'Диффузия',h:'Диффузия. Тіршілік процесіндегі рөлі',body:`
<p><b>Диффузия</b> — концентрация градиенті әсерінен бөлшектердің өздігінен тасымалданып, концентрацияның бүкіл көлемде теңесуі.</p>
<p>Жылдамдығына әсер етеді: концентрация градиенті, температура, ортаның тұтқырлығы, бөлшек өлшемі.</p>
<ul><li>қоректік заттар мен зат алмасу өнімдерінің тасымалы;</li><li>биохимиялық процестердің ең баяу (лимиттеуші) сатысы бола алады;</li><li>дәрілік заттарды ұлпалар мен мүшелерге жеткізу.</li></ul>`},
{n:8,short:'Коллигативтік қасиеттер',h:'Сұйылтылған бейэлектролит ерітінділерінің коллигативтік қасиеттері',body:`
<p><b>Коллигативтік қасиеттер</b> — еріген заттың табиғатына емес, тек бөлшектер <b>санына</b> тәуелді қасиеттер:</p>
<ol><li>ерітінді үстіндегі еріткіштің қаныққан бу қысымының төмендеуі;</li><li>қайнау температурасының жоғарылауы;</li><li>қату температурасының төмендеуі;</li><li>осмос және осмостық қысым.</li></ol>
<p><b>Идеал ерітінді</b> — бейэлектролиттердің сұйылтылған ерітіндісі, бөлшектер өзара әрекеттеспейді. <b>Жартылай өткізгіш мембрана</b> еріткіш молекулаларын өткізеді, еріген затты өткізбейді.</p>`},
{n:9,short:'Рауль заңы',h:'Раульдің бірінші заңы және одан туындайтын салдарлар',body:`
<p><b>Рауль заңы:</b> бейэлектролит ерітіндісі үстіндегі қаныққан бу қысымының салыстырмалы төмендеуі еріген заттың мольдік үлесіне тең.</p>
<span class="fx">${F('p<sub>0</sub> − p','p<sub>0</sub>')} = χ = ${F('n','n + N')}</span>
<p><b>1-салдар:</b> қату температурасының төмендеуі моляльдыққа пропорционал — <b>ΔT<sub>қату</sub> = K·b</b> (K — криоскопиялық тұрақты).</p>
<p><b>2-салдар:</b> қайнау температурасының жоғарылауы — <b>ΔT<sub>қайнау</sub> = E·b</b> (E — эбуллиоскопиялық тұрақты).</p>
${T(['Еріткіш','K, К·кг/моль','E, К·кг/моль'],[['Су','1,86','0,52'],['Бензол','5,1','2,57'],['Диэтил эфирі','1,73','2,02'],['Этил спирті','—','1,16']])}`},
{n:10,short:'Осмос, Вант-Гофф заңы',h:'Осмос. Осмостық қысым. Вант-Гофф заңы. Осмомолярлық',body:`
<p><b>Осмос</b> — еріткіш молекулаларының жартылай өткізгіш мембрана арқылы сұйылтылған ерітіндіден концентрлі ерітіндіге қарай өздігінен өтуі. <b>Осмостық қысым π</b> — осмосты тоқтату үшін қажет қысым.</p>
<p><b>Вант-Гофф заңы:</b> сұйылтылған ерітіндінің осмостық қысымы молярлық концентрацияға тура пропорционал.</p>
<span class="fx">π = C·R·T <small>бейэлектролит; R = 8,314 Дж/(моль·К)</small></span>
<span class="fx">π = i·C·R·T <small>электролит</small></span>
<p><b>Осмомолярлық</b> — мембранадан өтпейтін бөлшектердің активті концентрациясы: C<sub>осм</sub> = i·C (моль/л); күрделі ерітінді үшін C<sub>осм</sub> = π / RT. Осмомоляльдық — моль/кг.</p>
<p class="note">Адам қанының осмостық қысымы 37 °C-та ≈ 780 кПа (7,7 атм); осмомолярлығы ≈ 0,29–0,30 осмоль/л.</p>`},
{n:11,short:'Криоскопия, эбуллиоскопия',h:'Криоскопия, эбуллиоскопия, осмометрия',body:`
${T(['Коллигативтік қасиет','Өлшеу әдісі'],[['Δp/p<sub>0</sub>','тонометрия'],['ΔT<sub>қайнау</sub>','эбуллиоскопия (эбулиометрия)'],['ΔT<sub>қату</sub>','криоскопия (криометрия)'],['π','осмометрия']])}
<p>Бұл әдістермен еріген заттың молярлық массасын, изотондық коэффициентті және биологиялық сұйықтықтардың осмомолярлығын анықтайды:</p>
<span class="fx">M = ${F('K·m(x)·1000','ΔT<sub>қату</sub>·m(еріткіш)')}</span>
<p class="note">Медицинада қан мен зәрдің осмомолярлығы криоскопиялық осмометрмен анықталады (қан плазмасы −0,56 °C-та қатады).</p>`},
{n:12,short:'Изотондық коэффициент',h:'Электролит ерітінділерінің коллигативтік қасиеттерінің ерекшеліктері. Изотондық коэффициент',body:`
<p>Электролит иондарға ыдырағандықтан бөлшектер саны артады, коллигативтік қасиеттері есептелгеннен жоғары болады. Оны <b>изотондық коэффициент i</b> (Вант-Гофф коэффициенті) ескереді:</p>
<span class="fx">i = ${F('N<sub>i</sub>','N<sub>0</sub>')} ; i = 1 + α(n − 1)</span>
<ul><li>бейэлектролит үшін i = 1;</li><li>ассоциацияланатын заттар (коллоидтар) үшін i &lt; 1;</li><li>электролит үшін i &gt; 1 (NaCl толық ыдыраса i = 2, CaCl<sub>2</sub> — 3).</li></ul>
<span class="fx">Δp/p<sub>0</sub> = iχ ; ΔT<sub>қату</sub> = iKb ; ΔT<sub>қайнау</sub> = iEb ; π = iCRT</span>`},
{n:13,short:'Осмостың биологиялық рөлі',h:'Биологиялық жүйелердегі осмостың рөлі. Онкотикалық қысым. Гемолиз. Плазмолиз',body:`
${T(['Ерітінді','Анықтамасы','Жасушаға әсері'],[
['Изотонды','осмостық қысымы қанмен бірдей (0,9% NaCl = 0,15 моль/л, 5% глюкоза)','өзгермейді'],
['Гипотонды','осмостық қысымы төмен','су жасушаға кіреді → ісінеді, жарылады: <b>гемолиз</b>'],
['Гипертонды','осмостық қысымы жоғары','су жасушадан шығады → жиырылады: <b>плазмолиз</b>']])}
<ul><li><b>Онкотикалық қысым</b> — ақуыздар (ЖМЗ) тудыратын қысым бөлігі (≈ 3–4 кПа); суды қан тамырында ұстайды, жетіспесе ісіну пайда болады.</li><li><b>Тургор</b> — жасуша пішіні мен серпімділігін сақтайтын қысым.</li><li><b>Деплазмолиз</b> — жиырылған жасуша изотонды ерітіндіде бастапқы күйіне келеді.</li></ul>
<h3>Медицинада</h3>
<ul><li>изотонды ерітінділер — тамырға егу;</li><li>Na<sub>2</sub>SO<sub>4</sub>·10H<sub>2</sub>O, MgSO<sub>4</sub>·7H<sub>2</sub>O — іш жүргізетін (гипертонды әсер);</li><li>10% NaCl-ға батырылған гипертонды таңғыш — іріңді жараны тазарту;</li><li>гипертонды ерітінділер — глаукомада, ісінуде тамырға;</li><li>осмостық қысымды өлшеу — нефрозды бақылау.</li></ul>`}
]};

/* ===== 6. Беттік құбылыстар (оқулық, 8-тақырып, 127–138 б.) ===== */
MODS.t06={...EMPTY(),intro:'Конспект тақырыптың 6 негізгі сұрағына жауап ретінде құрылған (оқулық: 8-тақырып, 127–138 беттер).',notes:[
{n:1,short:'Беттік құбылыстар, адсорбция',h:'Беттік құбылыстар. Адсорбция. Негізгі түсініктер',body:`
<p><b>Беттік құбылыстар</b> — фазалар бөліну бетінде жүретін, беттік қабаттың ерекше құрамы мен құрылысына байланысты процестер.</p>
<ul><li><b>Меншікті бет</b> S<sub>мен</sub> = S<sub>қос</sub> / V — бөлшек ұсақтаған сайын артады.</li><li><b>Беттік керілу σ</b> — бет бірлігін түзуге жұмсалатын жұмыс (Дж/м<sup>2</sup>) немесе бетті қысқартуға ұмтылатын күш (Н/м). Беттік энергия E<sub>s</sub> = σ·S.</li><li><b>Беттік активтілік g</b> = −dσ/dC — заттың беттік керілуді өзгерту қабілеті.</li></ul>
<ul><li><b>Адсорбция</b> — еріген зат концентрациясының фазалар бөліну бетінде өздігінен өзгеруі; <b>десорбция</b> — кері процесс.</li><li><b>Адсорбент</b> — бетінде адсорбция жүретін зат; <b>адсорбтив (адсорбат)</b> — адсорбцияланатын зат.</li><li><b>Оң адсорбция</b> — бетте концентрация артады; <b>теріс</b> — кемиді.</li><li><b>Адсорбциялық тепе-теңдік</b> — адсорбция мен десорбция жылдамдықтары тең.</li></ul>`},
{n:2,short:'Гиббс теңдеуі',h:'Фазалардың жылжымалы бөліну бетіндегі адсорбция. Гиббс теңдеуі',body:`
<p>Сұйық–газ, сұйық–сұйық шекарасындағы адсорбция беттік керілудің өзгерісімен анықталады.</p>
<span class="fx">Г = −${F('C','RT')}·${F('dσ','dC')} ≈ −${F('C','RT')}·${F('σ<sub>2</sub> − σ<sub>1</sub>','C<sub>2</sub> − C<sub>1</sub>')}</span>
<p>Г — адсорбция (моль/м<sup>2</sup>); dσ/dC &lt; 0 болса Г &gt; 0 (оң адсорбция). <b>Адсорбция изотермасы</b> — тұрақты T-да Г-ның C-ға тәуелділігі; <b>беттік керілу изотермасы</b> — σ-ның C-ға тәуелділігі.</p>`},
{n:3,short:'БАЗ, мембраналар',h:'Беттік-активті заттар. Молекулалардың бағытталуы. Биологиялық мембраналардың құрылымы',body:`
${T(['Зат түрі','σ ерітінді','g','Г','Мысалдар'],[
['Беттік-активті (БАЗ)','&lt; σ<sub>0</sub>','&gt; 0','&gt; 0','спирттер, май қышқылдары, сабындар, ақуыздар, өт қышқылдары'],
['Беттік-инактивті (БИЗ)','&gt; σ<sub>0</sub>','&lt; 0','&lt; 0','бейорганикалық қышқылдар, негіздер, тұздар, глицерин, аминқышқылдары'],
['Беттік-активті емес','= σ<sub>0</sub>','0','0','қант, глюкоза']])}
<p>БАЗ молекуласы <b>дифильді</b>: полярлы гидрофильді «бас» (–COOH, –OH, –SO<sub>3</sub>H) және полярсыз гидрофобты көмірсутек «құйрық». Су бетінде бас суға, құйрық ауаға бағытталады.</p>
<p><b>Дюкло–Траубе ережесі:</b> гомологтық қатарда тізбекті бір –CH<sub>2</sub>– тобына ұзартқанда беттік активтілік 3–3,5 есе артады.</p>
<h3>Биологиялық мембраналар</h3>
<ul><li>негізі — <b>фосфолипидтердің қос қабаты</b>: полярлы бастары сыртқа, гидрофобты құйрықтары ішке қараған; ақуыздар мен холестерин кіреді;</li><li>Даниэлли–Давсон моделі: липид қос қабаты екі жағынан ақуыз қабатымен жабылған;</li><li>сұйық-мозаикалық модель: интегралды ақуыздар қос қабатты тесіп өтеді, иондық каналдар түзеді, ақуыздар асимметриялы орналасқан;</li><li>функциясы: жасушаны бөліп тұрады, таңдамалы өткізгіштік, рецепторлар арқылы сигнал қабылдау.</li></ul>`},
{n:4,short:'Лэнгмюр, Фрейндлих',h:'Жылжымайтын бөліну бетіндегі адсорбция. Лэнгмюр және Фрейндлих теңдеулері',body:`
<ul><li><b>Абсорбция</b> — заттың сорбенттің бүкіл көлеміне сіңуі; <b>капиллярлық конденсация</b> — кеуекте газдың сұйыққа айналуы; <b>сорбция</b> — бәрінің жиынтығы.</li><li>Қатты адсорбенттер: кеуексіз (оксидтер, тұздар) және кеуекті (белсендірілген көмір, силикагель).</li></ul>
${T(['','Физикалық адсорбция','Хемосорбция'],[['Күштер','ван-дер-ваальс','химиялық байланыс'],['Қайтымдылық','қайтымды','көбіне қайтымсыз'],['Таңдамалылық','жоқ','бар'],['Температура артқанда','әлсірейді','күшейеді']])}
<h3>Лэнгмюр теориясы</h3>
<p>Адсорбция тек белсенді орталықтарда жүреді, әр орталық бір молекуланы ұстайды (мономолекулалы қабат), орталықтар бірдей, адсорбцияланған молекулалар өзара әрекеттеспейді.</p>
<span class="fx">Г = Г<sub>∞</sub>·${F('C','K + C')}</span>
<p>Аз концентрацияда Г ≈ Г<sub>∞</sub>C/K (сызықтық), үлкен концентрацияда Г → Г<sub>∞</sub> (шекті адсорбция).</p>
<h3>Фрейндлих теңдеуі (эмпирикалық)</h3>
<span class="fx">${F('x','m')} = K·C<sup>1/n</sup> ; lg${F('x','m')} = lgK + ${F('1','n')}lgC</span>
<p>lg(x/m)–lgC графигінде түзу: ординатадан қиған кесінді = lgK, көлбеулік = 1/n. Орташа концентрацияда қолданылады.</p>
<p class="note">БЭТ теориясы — полимолекулалы адсорбция, изотерма S-тәрізді.</p>`},
{n:5,short:'Ерітіндіден адсорбция, ион алмасу',h:'Ерітіндіден адсорбцияның заңдылықтары. Ион алмасу адсорбциясы. Медицинада қолданылуы',body:`
<span class="fx">Г = ${F('(C<sub>0</sub> − C)·V','m')} <small>моль/кг</small></span>
<p>Әсер ететін факторлар: адсорбат, адсорбент және еріткіш табиғаты, концентрация, температура, меншікті бет.</p>
<p><b>Ребиндер ережесі:</b> адсорбция фазалар полярлығын теңестіру бағытында жүреді (полярлы адсорбент полярсыз еріткіштен полярлы затты жақсы адсорбциялайды).</p>
<p><b>Панет–Фаянс ережесі:</b> адсорбент бетінде алдымен оның кристалл торын толықтыра алатын (құрамына кіретін) иондар адсорбцияланады.</p>
<h3>Ион алмасу адсорбциясы</h3>
<ul><li><b>Иониттер</b> — иондарды алмастыра алатын сорбенттер: <b>катиониттер</b> R–H<sup>+</sup> (катион алмасады), <b>аниониттер</b> R–OH<sup>−</sup> (анион алмасады), амфотерлі иониттер.</li><li><b>Алмасу сыйымдылығы</b> — 1 г құрғақ ионит сіңіретін ион мөлшері (ммоль).</li><li>Регенерация: катионит — қышқылмен, анионит — сілтімен.</li></ul>
<p>Медицинада: су, антибиотик, ақуыз, витаминдерді тазарту; қанның ұюын болдырмау (Ca<sup>2+</sup>-ді байланыстыру); уланғанда токсиндерді байланыстыру; иондық балансты реттеу. Суды тұзсыздандыру: катионит → анионит.</p>`},
{n:6,short:'Хроматография',h:'Анализдің хроматографиялық әдісінің негізі. Биология және медицинада қолданылуы',body:`
<p><b>Хроматография</b> — заттарды қозғалмайтын (сорбент) және қозғалмалы (элюент — сұйық не газ) фазалар арасында әр түрлі таралуына негізделген бөлу әдісі; сорбция мен десорбция көп рет қайталанады.</p>
${T(['Жіктеу белгісі','Түрлері'],[
['Бөлу механизмі','адсорбциялық, таралу, ион алмасу, молекулалы-елеуіш (гель-фильтрация — өлшем бойынша)'],
['Техникасы','бағаналы, қағаздық, жұқа қабатты, капиллярлы'],
['Фазалар күйі','газдық (газ–сұйық, газ–қатты), сұйықтық']])}
<p><b>Сатылары:</b> сынама мен сорбентті дайындау → сынаманы енгізу → хроматографиялау → детекциялау → сандық анықтау.</p>
<h3>Медицинада</h3>
<ul><li>биосұйықтардағы микрокомпоненттер, допинг-бақылау, қандағы алкоголь мен есірткі;</li><li>ақуыз, аминқышқылдары, нуклеин қышқылдары, гормондарды бөлу және тазарту;</li><li>дәрілердің тазалығы мен сапасын анықтау;</li><li>гемосорбция — қан, лимфа, плазманы сорбенттен өткізіп, улы заттардан тазарту.</li></ul>`}
]};

/* ===== 7. Дисперсті жүйелер (оқулық, 9-тақырып, 144–163 б.) ===== */
MODS.t07={...EMPTY(),intro:'Конспект тақырыптың 8 негізгі сұрағына жауап ретінде құрылған (оқулық: 9-тақырып, 144–163 беттер).',notes:[
{n:1,short:'Негізгі түсініктер',h:'Дисперсті жүйелер. Негізгі түсініктер',body:`
<p><b>Дисперсті жүйе</b> — дисперсті фаза мен дисперстік ортадан тұратын жүйе.</p>
<ul><li><b>Дисперсті фаза</b> — ұсақталған күйде біркелкі таралған зат (қатты бөлшектер, тамшылар, көпіршіктер).</li><li><b>Дисперстік орта</b> — фаза таралған біртекті зат.</li><li><b>Дисперстілік</b> D = 1/a (a — бөлшектің көлденең өлшемі), м<sup>−1</sup>.</li></ul>
<p><b>Ағзада:</b> қан — дисперстік ортасы плазма (92% су, 6% ақуыз және метаболиттер, 2% иондар), фазасы — эритроциттер (7,2–7,5 мкм), лейкоциттер (10–13 мкм), тромбоциттер (2–5 мкм) және коллоидты бөлшектер. Сондай-ақ лимфа, ми сұйықтығы, зәр, цитоплазма.</p>
<p class="note">ЭТЖ (эритроциттердің тұну жылдамдығы) — қанның седиментациялық тұрақтылығын көрсетеді; норма 10–12 мм/сағ-тан аспайды.</p>`},
{n:2,short:'Жіктелуі, алу әдістері',h:'Дисперсті жүйелердің классификациясы. Коллоидты ерітінділерді алу әдістері',body:`
<h3>Дисперстілік дәрежесі бойынша</h3>
${T(['Жүйе','Бөлшек өлшемі','Қасиеттері','Мысал'],[
['Шын ерітінді','&lt; 1 нм (10<sup>−9</sup> м)','гомогенді, тұрақты, мөлдір, мембранадан өтеді','тұз, қант ерітіндісі'],
['Коллоидты (золь)','1–100 нм','ультрагетерогенді, салыстырмалы тұрақты, Тиндаль эффектісі, қағаз сүзгіден өтеді, мембранадан өтпейді','ақуыз, қан'],
['Дөрекі дисперсті','&gt; 100 нм (10<sup>−7</sup> м)','гетерогенді, тұрақсыз, лай, микроскоппен көрінеді','сүт, тұман, акварель']])}
<h3>Агрегаттық күйі бойынша (фаза/орта)</h3>
<p>Г/Г — флуктуациялар; С/Г — тұман; Қ/Г — түтін, шаң (аэрозольдер); Г/С — көбік; С/С — эмульсия; Қ/С — суспензия, золь; Г/Қ — қатты көбік (пемза); С/Қ — гель; Қ/Қ — қатты ерітінділер (қорытпалар).</p>
<h3>Фаза мен ортаның әрекеттесуі бойынша</h3>
<ul><li><b>Лиофильді</b> — фаза еріткішпен күшті әрекеттеседі, сольват қабаты бар, өздігінен түзіледі (ΔG &lt; 0), тұрақты: желатин, ақуыз, крахмал.</li><li><b>Лиофобты</b> — әрекеттесу әлсіз, өздігінен түзілмейді (ΔG &gt; 0), тұрақсыз: Ag, Au зольдері, AgI, As<sub>2</sub>S<sub>3</sub>.</li></ul>
<h3>Алу әдістері</h3>
<ul><li><b>Диспергациялық</b> — ұсақтау: механикалық, ультрадыбыстық, электрлік.</li><li><b>Конденсациялық</b> — молекулаларды біріктіру: физикалық (еріткішті алмастыру, бу конденсациясы), химиялық (гидролиз, тотықсыздану, алмасу реакциялары).</li><li><b>Пептизация</b> — жаңа тұнбаны пептизатор әсерімен зольге айналдыру.</li></ul>
<p>Химиялық конденсация шарттары: өнімнің ерімеуі, тұрақтандырғыш (бір реагенттің артығы), сұйылтылған ерітінділер.</p>`},
{n:3,short:'Мицелла құрылысы',h:'Мицелла құрылысы',body:`
<p><b>Мицелла</b> — қос электрлік қабатпен қоршалған, электрбейтарап коллоидты бөлшек. Мысал: AgNO<sub>3</sub> артық болғанда (AgNO<sub>3</sub> + KI) түзілген AgI золі:</p>
<span class="fx">{ m[AgI] · nAg<sup>+</sup> · (n − x)NO<sub>3</sub><sup>−</sup> }<sup>x+</sup> · xNO<sub>3</sub><sup>−</sup></span>
${T(['Бөлігі','Құрамы'],[
['Агрегат','m[AgI]'],
['Потенциал анықтаушы иондар','nAg<sup>+</sup> (Панет–Фаянс ережесі: торды толықтыратын, артық алынған ион)'],
['Ядро','агрегат + потенциал анықтаушы иондар'],
['Адсорбциялық қабаттың қарсы иондары','(n − x)NO<sub>3</sub><sup>−</sup>'],
['Гранула (коллоидты бөлшек)','ядро + адсорбциялық қабат; заряды x+'],
['Диффузиялық қабат','xNO<sub>3</sub><sup>−</sup>'],
['Мицелла','гранула + диффузиялық қабат (бейтарап)']])}
<p class="note">KI артық болса: {m[AgI]·nI<sup>−</sup>·(n − x)K<sup>+</sup>}<sup>x−</sup>·xK<sup>+</sup> — гранула теріс зарядталады.</p>`},
{n:4,short:'Қасиеттері',h:'Дисперсті жүйелердің молекулалық-кинетикалық, электрокинетикалық, оптикалық қасиеттері',body:`
<h3>Молекулалық-кинетикалық</h3>
<ul><li><b>Броундық қозғалыс</b> — еріткіш молекулаларының соқтығысынан бөлшектердің ретсіз қозғалысы.</li><li><b>Диффузия</b>, <b>осмостық қысым</b> (π = νRT/N<sub>A</sub>, ν — бөлшектік концентрация; шын ерітіндіге қарағанда өте аз), <b>седиментация</b> — ауырлық күшімен шөгу.</li></ul>
<h3>Оптикалық</h3>
<ul><li>Коллоидтар жарықты <b>шашыратады</b>: <b>Тиндаль конусы</b> (жарқыраған конус) және <b>опалесценция</b>.</li></ul>
<span class="fx">I = I<sub>0</sub>·K·${F('νV<sup>2</sup>','λ<sup>4</sup>')} <small>Рэлей теңдеуі</small></span>
<p>Шашырау бөлшектер санына және көлемінің квадратына тура, толқын ұзындығының 4-дәрежесіне кері пропорционал — қысқа толқынды (көк) жарық көп шашырайды.</p>
<h3>Электрокинетикалық</h3>
<ul><li>Бөлшек бетіндегі <b>қос электрлік қабатпен (ҚЭҚ)</b> байланысты: потенциал анықтаушы иондар, адсорбциялық және диффузиялық қабат қарсы иондары.</li><li><b>φ-потенциал</b> (электротермодинамикалық) — ядро бетіндегі потенциал.</li><li><b>ζ-потенциал</b> (дзета, электрокинетикалық) — адсорбциялық және диффузиялық қабаттар арасындағы ығысу шекарасындағы потенциал. Золь тұрақтылығын және электрокинетикалық құбылыстар қарқынын анықтайды.</li><li><b>Изоэлектрлік күй</b> — ζ = 0. <b>Қайта зарядталу</b> — электролит әсерінен ζ таңбасының өзгеруі.</li></ul>`},
{n:5,short:'Тазарту: диализ',h:'Коллоидты ерітінділерді тазарту: диализ, электродиализ, ультрафильтрация. Диализдің медицинада қолданылуы',body:`
<ul><li><b>Диализ</b> — төмен молекулалы заттарды өткізіп, коллоид бөлшектерін ұстайтын жартылай өткізгіш мембрана арқылы тазарту.</li><li><b>Электродиализ</b> — тұрақты ток әсерімен жеделдетілген диализ.</li><li><b>Ультрафильтрация</b> — мембрананың екі жағындағы қысым айырымы әсерімен жүретін диализ.</li><li><b>Компенсациялық диализ (вивидиализ)</b> — диализденетін ерітіндіде қанда сақталуы керек заттар қандағыдай концентрацияда болады; тек «зиянды» заттар шығады.</li></ul>
<p class="note"><b>«Жасанды бүйрек»</b> аппараты компенсациялық вивидиффузия принципімен жұмыс істейді: бүйрек жеткіліксіздігінде, уланғанда, ауыр күйікте қанды зат алмасу өнімдерінен (мочевина, креатинин) тазартады.</p>
<p>Ультрафильтрация: су, ақуыз, вирус, витаминдерді тазарту, вирустар өлшемін анықтау.</p>`},
{n:6,short:'Электрофорез, электроосмос',h:'Электрофорез. Электроосмос. Медицинада қолданылуы',body:`
<ul><li><b>Электрофорез</b> — сыртқы электр өрісінде зарядталған коллоид бөлшектерінің (гранулалардың) қарама-қарсы зарядты электродқа қозғалуы.</li><li><b>Электроосмос</b> — электр өрісінде дисперстік ортаның қозғалмайтын фазаға (кеуекті мембранаға) қатысты қозғалуы.</li></ul>
<h3>Медицинада</h3>
<ul><li>ақуыздарды, аминқышқылдарын фракцияларға бөлу (қан сарысуы ақуыздарының электрофореграммасы — диагностика);</li><li><b>ионофорез</b> — дәріні тері арқылы ток көмегімен енгізу;</li><li>дәрілерді (антибиотик, витамин) тазарту және тазалығын анықтау;</li><li>ферменттер, вирустар, қан жасушаларының электрохимиялық қасиеттерін зерттеу.</li></ul>`},
{n:7,short:'Тұрақтылық, коагуляция',h:'Коллоидты жүйелердің тұрақтылығы және коагуляциясы. Коллоидты қорғау',body:`
<ul><li><b>Седиментациялық (кинетикалық) тұрақтылық</b> — ауырлық күшіне қарсы бөлшектердің біркелкі таралуын сақтау.</li><li><b>Агрегативтік тұрақтылық</b> — бөлшектердің бірікпей, өлшемін сақтауы.</li></ul>
<p>Тұрақтылық факторлары: электростатикалық (ҚЭҚ, ζ-потенциал), адсорбциялық-сольваттық, энтропиялық, гидродинамикалық.</p>
<p><b>Коагуляция</b> — коллоид бөлшектерінің ірі агрегаттарға бірігуі: <b>жасырын</b> (көзге көрінбейді) → <b>айқын</b> (лайлану, тұнба, түс өзгерісі). Себептері: электролит қосу, температура, механикалық әсер, сәулелену, электр және магнит өрісі.</p>
<p><b>Шульце–Гарди ережесі:</b> коагуляцияны таңбасы гранула зарядына қарама-қарсы ион (ион-коагулянт) тудырады; заряды үлкен болған сайын коагуляциялау қабілеті жоғары (шамамен z<sup>6</sup>-ға пропорционал).</p>
<span class="fx">C<sub>т</sub> = ${F('C<sub>эл</sub>·V<sub>эл</sub>','V<sub>золь</sub> + V<sub>эл</sub>')} ; КҚ = ${F('1','C<sub>т</sub>')}</span>
<p>C<sub>т</sub> — коагуляция табалдырығы (моль/л), КҚ — коагуляциялау қабілеті. Лиотропты қатар: Ba<sup>2+</sup> &gt; Sr<sup>2+</sup> &gt; Ca<sup>2+</sup> &gt; Mg<sup>2+</sup>; Cs<sup>+</sup> &gt; Rb<sup>+</sup> &gt; K<sup>+</sup> &gt; Na<sup>+</sup> &gt; Li<sup>+</sup>.</p>
<ul><li>концентрациялық (индифферентті электролит) және нейтрализациялық коагуляция;</li><li>электролиттер қоспасы: аддитивтілік, синергизм, антагонизм; өзара коагуляция — қарама-қарсы зарядты зольдер.</li></ul>
<p><b>Коллоидты қорғау</b> — ЖМЗ (ақуыз, полисахарид) бөлшектерді адсорбциялық-сольват қабатпен қаптап, тұрақтылығын арттыруы. Сандық өлшемі — «алтын», «күміс», «темір» саны. Аз ЖМЗ керісінше тұрақтылықты азайтады — <b>сенсибилизация</b>.</p>
<p class="note">Ағзада ақуыздар холестерин мен кальций тұздарының тамыр қабырғасына, тастың бүйрек пен өт жолдарына тұнуына кедергі жасайды. Коагуляцияға ұқсас процестер: қанның ұюы, тас түзілуі, атеросклероз.</p>`},
{n:8,short:'Аэрозоль, суспензия, эмульсия',h:'Дөрекі дисперсті жүйелер: аэрозольдер, суспензиялар, эмульсиялар. Медицинада қолданылуы',body:`
<p>Бөлшек өлшемі 10<sup>−7</sup>–10<sup>−4</sup> м, фаза бөлу беті үлкен, термодинамикалық тұрақсыз, тұрақтандырғышпен тұрақтанады.</p>
<h3>Аэрозольдер (орта — газ)</h3>
<p>Тұман (сұйық фаза), түтін, шаң (қатты), смог (аралас). Жарықты шашыратады, броундық қозғалыс пен седиментация жылдам, ҚЭҚ жоқ.</p>
<ul><li>Медицинада: ингаляциялық, стерильдеуші, жараға арналған, желімдеуші аэрозольдер.</li><li>Аурулар: көмір шаңы — антракоз, SiO<sub>2</sub> — силикоз, асбест — асбестоз; тозаң — аллергия; бактериялық аэрозольдер — туберкулез, грипп; күйе — онкологиялық аурулар.</li></ul>
<h3>Суспензиялар (Қ/С)</h3>
<p>Броундық қозғалыс, диффузия, осмос жоқ; седиментация жылдам. Мысалдар: лай су, ас қорытудағы тағам, дәрілік және косметикалық суспензиялар.</p>
<h3>Эмульсиялар (С/С)</h3>
<ul><li><b>Тура (I текті)</b> — май/су (сүт, ішке қабылданатын дәрілік эмульсиялар).</li><li><b>Кері (II текті)</b> — су/май (сыртқа қолданылатын кремдер, маргарин).</li><li><b>Эмульгаторлар</b> тұрақтандырады: гидрофильді — тура, гидрофобты — кері эмульсияларды. <b>Коалесценция</b> — тамшылардың бірігуі.</li></ul>
<p class="note">Ас қорытуда майлар өт қышқылдарының (эмульгатор) көмегімен ішекте эмульгирленіп, сіңіріледі.</p>`}
]};

/* ===== 8. Тотығу-тотықсыздану, электрод потенциалдары (оқулық, 7-тақырып, 114–122 б.) ===== */
MODS.t08={...EMPTY(),intro:'Конспект тақырыптың 9 негізгі сұрағына жауап ретінде құрылған (оқулық: 7-тақырып, 114–122 беттер).',notes:[
{n:1,short:'Электрод, Нернст теңдеуі',h:'Электрод. Электродты потенциал. Пайда болу механизмі. Нернст теңдеуі',body:`
<p><b>Электрод (жартылай элемент)</b> — электрондық өткізгіш (металл) пен иондық өткізгіш (электролит) түйіскен, шекарада қос электрлік қабат (ҚЭҚ) түзілетін жүйе.</p>
<p><b>Пайда болу механизмі:</b> металды өз тұзының ерітіндісіне батырғанда металл катиондары ерітіндіге өтеді (пластинка теріс зарядталады — белсенді металдар, мысалы Zn) немесе ерітіндіден металға тұнады (пластинка оң зарядталады — Cu, Ag). Шекарада ҚЭҚ түзіліп, потенциал секірмесі пайда болады.</p>
<ul><li><b>Тотығу</b> — электрон беру (тотығу дәрежесі артады); <b>тотықсыздандырғыш</b> — электрон доноры.</li><li><b>Тотықсыздану</b> — электрон қабылдау; <b>тотықтырғыш</b> — электрон акцепторы.</li></ul>
<span class="fx">φ = φ° + ${F('RT','nF')}·ln a(Me<sup>n+</sup>) = φ° + ${F('0,059','n')}·lg a(Me<sup>n+</sup>) <small>Нернст теңдеуі, 298 К</small></span>
<p>R = 8,31 Дж/(моль·К), F = 96 500 Кл/моль. Потенциалға металл табиғаты, ион активтілігі, температура әсер етеді.</p>
<p><b>Стандартты потенциал φ°</b> — 298 К-да ион активтілігі 1 моль/л болғанда стандартты сутекті электродпен салыстырып өлшенген потенциал. Олар реттеліп <b>электрохимиялық кернеу қатарын</b> құрайды.</p>`},
{n:2,short:'Электродтар классификациясы',h:'Электродтардың классификациясы: I және II текті, анықтаушы және салыстырушы электродтар',body:`
${T(['Түрі','Құрылысы','Мысалдар'],[
['I текті','өз тұзының ерітіндісіне батырылған металл; катионға қайтымды','Zn<sup>2+</sup>/Zn, Cu<sup>2+</sup>/Cu, Ag<sup>+</sup>/Ag, сутекті электрод'],
['II текті','нашар еритін тұзымен қапталған металл, ортақ анионы бар жақсы еритін тұз ерітіндісінде; анионға қайтымды','хлоркүміс Ag|AgCl,KCl; каломель Hg|Hg<sub>2</sub>Cl<sub>2</sub>,KCl'],
['Тотығу-тотықсыздану','Ox/Red ерітіндісіндегі инертті металл (Pt, Au)','Pt|Fe<sup>3+</sup>,Fe<sup>2+</sup>']])}
<p><b>Стандартты сутекті электрод</b> — 1 моль/л H<sup>+</sup> ерітіндісіне батырылған платиналанған платина, оған 101 325 Па қысыммен H<sub>2</sub> беріледі; φ° = 0.</p>
<span class="fx">φ(H) = 0,059·lg a(H<sup>+</sup>) = −0,059·pH</span>
${T(['Мақсаты','Анықтамасы','Мысалдар'],[
['Салыстырушы','потенциалы белгілі, тұрақты, анықталатын иондарға тәуелсіз','сутекті (0), каломель (+0,248 В), хлоркүміс (+0,222 В)'],
['Анықтаушы (индикаторлы)','потенциалы анықталатын ион концентрациясына тәуелді','сутекті, хингидронды, шыны (H<sup>+</sup> үшін), ион таңдамалы']])}`},
{n:3,short:'Хлоркүміс электроды',h:'Хлоркүміс электроды — салыстырушы электрод',body:`
<span class="fx">Ag | AgCl, KCl</span>
<ul><li>Негізгі процесс: Ag<sup>+</sup> + e ⇄ Ag<sup>0</sup>; ілесе жүретін: AgCl ⇄ Ag<sup>+</sup> + Cl<sup>−</sup>.</li><li>Қосынды: <b>AgCl + e ⇄ Ag + Cl<sup>−</sup></b>.</li></ul>
<span class="fx">φ<sub>хк</sub> = φ°<sub>хк</sub> − 0,059·lg a(Cl<sup>−</sup>) ; φ°<sub>хк</sub> = +0,222 В</span>
<p>Қаныққан KCl-да Cl<sup>−</sup> концентрациясы тұрақты, сондықтан потенциал тұрақты. Артықшылығы: қарапайым, тұрақты, улы емес (каломельдегі сынаптан айырмашылығы), сондықтан медициналық-биологиялық зерттеулерде pH-метрдің салыстырушы электроды ретінде қолданылады.</p>`},
{n:4,short:'Редокс-потенциал',h:'Тотығу-тотықсыздану электродты потенциалдар. Редокс-электродтар',body:`
<p><b>Редокс-электрод</b> — тотыққан және тотықсызданған формалар (Ox/Red жұбы) бар ерітіндіге батырылған инертті металл (Pt, Au); металл тек электрон тасымалдаушы.</p>
<span class="fx">Ox + ze ⇄ Red ; φ = φ° + ${F('RT','nF')}·ln${F('a(Ox)','a(Red)')} <small>Нернст–Петерс теңдеуі</small></span>
<p><b>Стандартты редокс-потенциал</b> — a(Ox) = a(Red) болғандағы потенциал. Ол неғұрлым үлкен болса, Ox формасы соғұрлым күшті тотықтырғыш.</p>
<h3>Тотығу-тотықсыздану реакциясының өздігінен жүру шарты</h3>
<span class="fx">ΔG° = −nFE° &lt; 0 ⇔ E° = φ°(тотықтырғыш) − φ°(тотықсыздандырғыш) &gt; 0</span>
<p>Электрондар редокс-потенциалы кіші жүйеден үлкен жүйеге өтеді.</p>
<p class="note">Ағзада биологиялық тотығу: электрондар субстраттан O<sub>2</sub>-ге қарай редокс-потенциалы біртіндеп өсетін жүйелер тізбегі (тыныс алу тізбегі) бойымен тасымалданып, энергия АТФ түрінде жинақталады.</p>`},
{n:5,short:'Гальваникалық элемент, ЭҚК',h:'Гальваникалық элемент. Электрқозғаушы күші',body:`
<p><b>Гальваникалық элемент</b> — сыртқы тізбегі металл өткізгішпен, ішкі тізбегі тұзды көпірмен жалғанған екі электродтан тұратын жүйе; химиялық энергияны электр энергиясына айналдырады.</p>
<span class="fx">E = φ(+) − φ(−) ; E° = φ°(+) − φ°(−)</span>
<h3>Якоби–Даниэль элементі</h3>
<span class="fx">(−) Zn | ZnSO<sub>4</sub> || CuSO<sub>4</sub> | Cu (+)</span>
<p>Анод (−): Zn − 2e → Zn<sup>2+</sup>; катод (+): Cu<sup>2+</sup> + 2e → Cu. Жалпы: Zn + Cu<sup>2+</sup> → Zn<sup>2+</sup> + Cu. E° = 0,34 − (−0,76) = 1,1 В.</p>
<p><b>Концентрациялық элемент</b> — бір металдан, бірақ ион активтіліктері әр түрлі ерітінділерде:</p>
<span class="fx">(−) Ag | AgNO<sub>3</sub>(a<sub>1</sub>) || AgNO<sub>3</sub>(a<sub>2</sub>) | Ag (+), a<sub>2</sub> &gt; a<sub>1</sub> : E = ${F('0,059','n')}·lg${F('a<sub>2</sub>','a<sub>1</sub>')}</span>
<p><b>Редокс-элемент</b> — екі редокс-электродтан: (−) Pt | Sn<sup>4+</sup>, Sn<sup>2+</sup> || Fe<sup>3+</sup>, Fe<sup>2+</sup> | Pt (+).</p>`},
{n:6,short:'Диффузиялық және мембраналық потенциал',h:'Диффузиялық және мембраналық потенциалдардың пайда болу механизмі. Биологиялық рөлі',body:`
<ul><li><b>Диффузиялық потенциал</b> — екі ерітінді шекарасында иондардың әр түрлі жылдамдықпен диффузиялануынан пайда болады. Ағзада жасуша қабығы механикалық зақымданғанда туындайды — <b>зақымдану потенциалы</b>, ~30–40 мВ.</li>
<li><b>Мембраналық потенциал</b> — мембрананың таңдамалы өткізгіштігінен (K<sup>+</sup> үшін жақсы, Na<sup>+</sup> үшін нашар) пайда болады.</li></ul>
${T(['Потенциал','Сипаттамасы','Шамасы'],[
['Тыныштық потенциалы','қозбаған жасушада; мембрананың сырты оң, іші теріс','~70–90 мВ'],
['Әрекет потенциалы','жасуша қозғанда; деполяризация мен реполяризация амплитудасы','~120–140 мВ'],
['Зақымдану (диффузиялық)','жасуша қабығы зақымданғанда','~30–40 мВ']])}
<p><b>Әрекет потенциалының функциялары:</b> қаңқа бұлшықетінің қозғалысы, жүрек жиырылуы, ОЖЖ-дегі қозу мен тежелу, жүйке импульсінің таралуы.</p>`},
{n:7,short:'Ион таңдамалы электродтар',h:'Ион таңдамалы электродтар. Биологиялық сұйықтықтардағы иондарды анықтау',body:`
<p><b>Ион таңдамалы электрод</b> — белгілі бір ионға таңдамалы сезімтал мембранамен екі бөлікке бөлінген электрохимиялық жүйе. Потенциалы сол ионның активтілігіне Нернст теңдеуі бойынша тәуелді.</p>
<p>Потенциометрия (ионометрия) әдісімен анықтайды:</p>
<ul><li>биосұйықтар мен жасушалардың pH-ы;</li><li>плазмадағы, сарысудағы, тұтас қандағы Na<sup>+</sup>, K<sup>+</sup>, Ca<sup>2+</sup>, Cl<sup>−</sup> иондары;</li><li>тағамдағы және ортадағы улы иондар (нитраттар);</li><li>ферменттер мен субстраттар (ацетилхолин, холинэстераза);</li><li>әлсіз электролиттердің иондану константасы, комплекстердің тұрақсыздық константасы.</li></ul>`},
{n:8,short:'Шыны электроды',h:'Шыны электроды — H⁺ концентрациясын анықтайтын анықтауыш электрод',body:`
<span class="fx">Ag | AgCl | HCl (0,1 моль/л) | шыны | H<sup>+</sup> (зерттелетін ерітінді)</span>
<p>Ұшында диаметрі 10–15 мм жұқа арнайы шыны шары (мембрана) бар түтікше. Ішінде pH-ы тұрақты HCl ерітіндісі және көмекші хлоркүміс электроды. Шыны бетінде ион алмасу жүреді: H<sup>+</sup>(ер-ді) + Na<sup>+</sup>(шыны) ⇄ H<sup>+</sup>(шыны) + Na<sup>+</sup>(ер-ді).</p>
<span class="fx">φ<sub>ш</sub> = φ°<sub>ш</sub> + 0,059·lg a(H<sup>+</sup>) = φ°<sub>ш</sub> − 0,059·pH</span>
<p>Артықшылығы: тотықтырғыш, тотықсыздандырғыш, ақуыздар, боялған ерітінділер өлшеуге кедергі жасамайды; биологиялық сұйықтықтардың pH-ын өлшеудегі негізгі электрод. pH өлшеу жұбы: шыны (анықтауыш) + хлоркүміс (салыстырушы).</p>`},
{n:9,short:'Потенциометрлік титрлеу',h:'Потенциометрлік титрлеу. Медициналық-биологиялық зерттеулерде қолданылуы',body:`
<p><b>Потенциометрия</b> — гальваникалық элемент ЭҚК-ін өлшеуге негізделген әдіс (құралы — pH-метр, ионометр). Осы принципке ЭКГ, ЭМГ, ЭЭГ негізделген.</p>
<p><b>Потенциометрлік титрлеу</b> — титрлеу барысында ЭҚК-ті (pH) өлшеп, эквиваленттік нүктені анықтау әдісі.</p>
<ul><li><b>Интегралдық қисық</b> E (pH) — V(титрант): эквиваленттік нүкте — қисықтың иілу нүктесі (секірме).</li><li><b>Дифференциалдық қисық</b> ΔE/ΔV — V: эквиваленттік нүкте — максимум.</li></ul>
<p>Анықталады: қышқылдар мен негіздер (бейтараптау), тотықтырғыштар мен тотықсыздандырғыштар, галогенид иондары (тұндыру), т.б. (комплекс түзу).</p>
<span class="fx">E = φ<sub>хк</sub> − φ<sub>ш</sub> <small>қышқылдық-негіздік титрлеу: шыны + хлоркүміс электродтары</small></span>
<h3>Артықшылықтары</h3>
<ul><li>боялған, лайлы, тұнбасы бар ерітінділерді титрлеуге болады;</li><li>бірнеше компонентті қатар анықтайды;</li><li>сезімталдығы жоғары, субъективті көз қатесі жоқ, автоматтандыруға болады.</li></ul>
<p>Кемшіліктері: күрделі аппаратура, санақ көп, кейде потенциал баяу орнығады.</p>`}
]};

async function sha256(s){

      else{foot.append(h('span',{style:'font-weight:700;color:var('+(right?'--ok':'--bad')+')'},right?'Дұрыс!':'Қате'),h('button',{class:'btn blue',onclick:()=>{i++;show()}},i+1<order.length?'Келесі сұрақ →':'Нәтижені көру'))}}
    let right=false;
    function check(){done=true;right=sel.size===q.ans.length&&q.ans.every(a=>sel.has(a));if(right)score++;paint();if(q.e)c.insertBefore(h('div',{class:'exp'},h('b',{},'Түсіндірме'),h('span',{html:q.e})),foot)}
    paint();area.append(c)}
  show()}

/* ---------- problems ---------- */
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(',','.');if(!s)return NaN;return Number(s)}
function renderProblems(panel,m){
  if(!m.problems.length){panel.append(h('div',{class:'empty'},h('b',{},'Есептер жақында қосылады'),'Бұл тақырыптың есептері әлі жүктелмеген.'));return}
  panel.append(h('p',{class:'intro'},'Сол жақта — шығарылған мысал, оң жақта — өзіңіз шығаратын ұқсас есеп. Жауапты енгізіп, тексеріңіз; қиналсаңыз, шешімін ашыңыз.'));
  const list=h('div',{class:'plist'});
  m.problems.forEach((p,i)=>{
    const ex=h('div',{class:'pcol'},h('div',{class:'lbl'},'Мысал'),h('div',{class:'ptext',html:p.ex.q}),h('ol',{class:'steps'},...p.ex.s.map(s=>h('li',{html:s}))),h('div',{class:'ansline',html:'Жауабы: '+p.ex.a}));
    let tr=null;
    if(p.tr&&p.tr.ans!=null){
      const inp=h('input',{id:'p'+i,inputmode:'decimal',autocomplete:'off','aria-label':'Жауап'});
      const fb=h('div');
      const check=()=>{const v=parseNum(inp.value);fb.innerHTML='';if(isNaN(v)){fb.append(h('div',{class:'fb bad'},'Сан енгізіңіз (мысалы, 4,46).'));return}
        const ok=Math.abs(v-p.tr.ans)<=Math.max(p.tr.tol||0,Math.abs(p.tr.ans)*0.02);
        fb.append(h('div',{class:'fb '+(ok?'ok':'bad'),html:ok?'Дұрыс! Жауабы: '+p.tr.show:'Қате. Есептеуді қайта тексеріңіз немесе шешімін ашыңыз.'}))};
      tr=h('div',{class:'pcol'},h('div',{class:'lbl'},'Өзің шығар'),h('div',{class:'ptext',html:p.tr.q}),
        h('form',{class:'tryrow',onsubmit:e=>{e.preventDefault();check()}},h('label',{for:'p'+i,html:p.tr.pre}),inp,p.tr.unit?h('span',{class:'muted',html:p.tr.unit}):null,h('button',{class:'btn',type:'submit'},'Тексеру')),
        fb,h('details',{class:'sol'},h('summary',{},'Шешімін көру'),h('ol',{class:'steps'},...p.tr.s.map(s=>h('li',{html:s}))),h('div',{class:'ansline',html:'Жауабы: '+p.tr.show})));
    }else if(p.tr){
      tr=h('div',{class:'pcol'},h('div',{class:'lbl'},'Өзің шығар'),h('div',{class:'ptext',html:p.tr.q}),h('p',{class:'muted',style:'margin:0;font-size:14px'},'Дәптерге шығарып, сосын жауабыңызды тексеріңіз.'),
        h('details',{class:'sol'},h('summary',{},'Жауабын көру'),h('ol',{class:'steps'},...p.tr.s.map(s=>h('li',{html:s}))),h('div',{class:'ansline',html:'Жауабы: '+p.tr.show})));
    }
    list.append(h('article',{class:'prob'},h('header',{},h('div',{class:'no'},String(i+1)),h('div',{},h('h3',{},p.t),p.src?h('div',{class:'src'},p.src):null)),h('div',{class:'pbody',style:tr?null:'grid-template-columns:1fr'},ex,tr)))});
  panel.append(list)}

/* ---------- router ---------- */
function route(){
  const hs=location.hash.slice(1);
  if(!unlocked){renderGate();return}
  if(!hs||hs==='home'){renderHome();window.scrollTo({top:0});return}
  const [id,tab,sub]=hs.split('_');
  renderModule(id,TABS.some(t=>t[0]===tab)?tab:'notes',sub)}
addEventListener('hashchange',route);
route();
</script>
